<html lang="ru">

<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brew Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone tapper — HUD, day task strip, room switcher, live cafe scene, path meters, tabbed management panel. Single warm-dark look around bright pixel art. */
:root{
  --bg:#17120e; --panel:#211913; --panel2:#2c2219; --line:#3e3026; --cream:#f3e8d3; --muted:#ae9b84;
  --caramel:#eaa33c; --soul:#86b86a; --pathos:#86a2e6; --chaos:#e06a4c; --bad:#e0574a; --good:#7fc76a; --shadow:#0a0705;
  --disp:'Unbounded','Golos Text',system-ui,sans-serif; --body:'Golos Text',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:14px;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.num{font-variant-numeric:tabular-nums}
.hud{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end}
.cafe{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--caramel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.money{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;text-align:right;white-space:nowrap}
.money.pulse{animation:pulse .35s ease}
@keyframes pulse{50%{transform:scale(1.08);color:var(--caramel)}}
.inc{font-size:12px;color:var(--good);text-align:right;white-space:nowrap}
.hudrow{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.hudrow b{color:var(--cream);font-weight:600}
.hudrow .sp{flex:1}
.lvl{display:flex;align-items:center;gap:6px;min-width:110px}
.bar{height:5px;background:var(--shadow);flex:1}
.bar i{display:block;height:100%;background:var(--caramel)}
.pxbtn{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:3px 9px;font-size:12px;font-weight:600}
.task{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);padding:5px 9px;font-size:12px}
.task .t{flex:1;min-width:0}
.task b{color:var(--caramel)}
.task .bar{max-width:80px}
.rooms{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{flex:none;background:var(--panel);border:2px solid var(--line);padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.room[aria-pressed="true"]{border-color:var(--caramel);color:var(--cream);background:var(--panel2)}
.room small{font-weight:500;color:var(--good);margin-left:4px}
.scene{position:relative;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:#000;flex:none;touch-action:manipulation}
#cv{display:block;width:100%;aspect-ratio:360/300;height:auto}
.meters{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:center}
.meter .k{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.meter .k b{color:var(--cream);font-weight:600}
.meter .bar{height:4px;margin-top:2px}
.path{font-size:11px;color:var(--muted);white-space:nowrap}
.path b{color:var(--cream)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{position:relative;background:var(--panel);border:2px solid var(--line);padding:7px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--cream);border-color:var(--caramel)}
.badge{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.panel{flex:1;min-height:130px;overflow-y:auto;background:var(--panel);border:2px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:7px}
.h{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--caramel);margin-top:3px}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--panel2);border:2px solid var(--line);padding:8px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .t{font-weight:700;font-size:14px}
.card .d{font-size:12px;line-height:1.4;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.row .sp{flex:1}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.up .t{font-weight:700;font-size:14px}
.up .eff{font-size:12px;color:var(--muted)}
.up .eff b{color:var(--good);font-weight:600}
.pips{grid-column:1/-1;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.pips i{height:5px;background:var(--shadow)}
.pips i.on{background:var(--caramel)}
.btn{background:var(--caramel);color:#1b130c;border:none;box-shadow:2px 2px 0 var(--shadow);padding:8px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none;padding:6px 10px}
.btn.red{background:var(--bad);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.spr{flex:none;background-repeat:no-repeat;image-rendering:auto}
.staff{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;text-align:left;width:100%}
.staff .mood{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.book .cell{height:56px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.book .cell.no .spr{filter:brightness(0);opacity:.35}
.veil{position:fixed;inset:0;background:rgba(8,6,4,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.modal{width:100%;max-width:430px;max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--caramel);box-shadow:5px 5px 0 var(--shadow);padding:15px;display:flex;flex-direction:column;gap:11px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
.modal h2{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.modal p{margin:0;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:10px 12px;text-align:left;font-size:14px;line-height:1.35;font-weight:500}
.opt:active{transform:translate(1px,1px)}
.opt[aria-pressed="true"]{border-color:var(--caramel);background:#3a2a1b}
.opt:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;padding:2px 7px;border:2px solid var(--line);background:var(--panel2)}
.chip.g{border-color:#5f8a4a}.chip.b{border-color:#9b3d33}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{white-space:normal;text-align:left;line-height:1.25}
.acts .btn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.start{display:flex;flex-direction:column;gap:13px;padding-block:6px}
.logo{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;color:var(--caramel);text-shadow:3px 3px 0 var(--shadow)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names .opt{padding:7px 10px;font-size:13px}
.field{background:var(--panel2);border:2px solid var(--line);padding:9px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.two .opt{display:flex;flex-direction:column;gap:3px}
.two .opt b{font-family:var(--disp);font-size:15px}
.two .opt span{font-size:12px;color:var(--muted)}
.fly{position:fixed;z-index:15;pointer-events:none;font-family:var(--disp);font-weight:800;font-size:14px;color:#ffd36b;text-shadow:0 2px 0 #3a2410,0 0 6px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-50%,-50%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel2);border:2px solid var(--caramel);box-shadow:3px 3px 0 var(--shadow);padding:7px 12px;font-size:13px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion: reduce){.money.pulse{animation:none}}
</style>

</head>

function newRoom(id){ const u = {}; UPG.forEach(x=>u[x.id]=0); u.tables = 0; return {id, upg:u}; }
function makeStaff(role, room, quirk){
  const used = new Set(S.staff.map(s=>s.name).concat(S.cands.map(s=>s.name)));
  let name = pick(NAMES), g = 0; while(used.has(name) && g++<40) name = pick(NAMES);
  if(!quirk) quirk = Math.random()<0.18 ? pick(['talker','sleepy','smoker','phone','worker']) : 'none';
  return {id:'s'+Math.random().toString(36).slice(2,8), name, role, room, lvl:1, mood:80, pat:100, quirk, spr:pick(ROLE_SPR[role])};
}
function refreshCands(){
  S.cands = [];

}
function roomDef(id){ return ROOMS.find(r=>r.id===id); }
function room(id){ return S.rooms.find(r=>r.id===id); }
function staffIn(id){ return S.staff.filter(s=>s.room===id); }
function hireCost(role, roomId){ const n = staffIn(roomId).length; return Math.round(ROLES[role].hire * Math.pow(1.55, n) * roomDef(roomId).mult / 10)*10; }
function trainCost(st){ return Math.round(120 * Math.pow(1.42, st.lvl-1) * roomDef(st.room).mult / 10)*10; }

/* ============ economy ============ */
function rt(id){ if(!RT[id]) RT[id] = {guests:[], queue:[], pickup:[], jobs:[], seats:[], floaters:[], spawnT:2, acc:0, pets:[], staff:{}, stains:[]}; return RT[id]; }
function staffSpeed(st){
  const r = rt(st.room).staff[st.id];
  let f = (1 + 0.07*(st.lvl-1)) * (0.6 + st.mood*0.005);
  if(st.quirk==='worker') f *= 1.1;
  if(r && r.boostUntil > performance.now()) f *= r.boostMul;
  return f;
}
function working(st){ const r = rt(st.room).staff[st.id]; return !(r && (r.distract || r.breakUntil > performance.now())); }
function stats(id){
  const rm = room(id), u = rm.upg, def = roomDef(id), st = staffIn(id);
  const w = WEATHER[S.weather];
  const wf = def.outdoor ? w.out : w.f;
  const repF = 0.5 + S.rep*0.2;
  let lambda = 0.12 * (1+0.08*u.sign) * (1+0.035*u.decor) * (1+0.02*u.pets) * (1+0.02*tableCount(u.tables)) * repF * wf;
  if(S.path==='chaos') lambda *= 1.25;
  if(S.boostUntil > Date.now()) lambda *= 2;
  let check = 80 * def.mult * (1+0.12*u.menu);
  if(S.path==='pathos') check *= 1.25;
  if(isHalloween()) check *= 1.1;
  const cashiers = st.filter(s=>s.role==='Кассир' && working(s));
  const baristas = st.filter(s=>s.role==='Бариста' && working(s));
  const cooks = st.filter(s=>s.role==='Повар' && working(s));
  const waiters = st.filter(s=>s.role==='Официант' && working(s));
  const orderSpeed = cashiers.length ? cashiers.reduce((a,s)=>a+staffSpeed(s),0) : (baristas.length ? 0.5 : 0.3);
  const orderT = 3.2 / (1+0.15*u.register) / orderSpeed;
  const prepSpeed = baristas.length ? baristas.reduce((a,s)=>a+staffSpeed(s),0) : 0.3;
  const prepT = 5 / (1+0.15*u.machine);
  const dessert = Math.min(0.8, 0.04*u.showcase), dessertAdd = 0.45*check*(cooks.length?1.5:1);
  const tips = 0.01*u.register + (waiters.length? 0.06*waiters.length : 0) + (S.path==='soul'?0.05:0);
  const through = Math.min(1/orderT, prepSpeed/prepT);
  const income = Math.min(lambda, through) * (check + dessert*dessertAdd) * (1+tips);
  return {lambda, check, orderT, prepT, prepSpeed, dessert, dessertAdd, tips, through, income, cashiers, baristas, waiters, cooks};
}
function totalIncome(){ return S.rooms.reduce((a,r)=>a+stats(r.id).income,0); }
function avgCheck(){ return stats(S.active).check; }
function addMoney(v){ S.money += v; if(v>0){ S.earned += v; if(S.task && S.task.kind==='earn') taskProg(v); } dirty = true; }
function addXp(n){
  S.xp += n; let need = 25 + S.level*20;
  while(S.xp >= need){ S.xp -= need; S.level++; need = 25 + S.level*20; toast('Уровень '+S.level); sfx('level');
    if(S.level===LOCK_LEVEL && !S.path){ S.path = leader(); queueModal({kind:'path'}); } }
}
function leader(){ const m = S.meters; return Object.keys(m).reduce((a,b)=>m[b]>m[a]?b:a); }
function meter(k, v){ if(!v) return; const f = S.path && S.path!==k && v>0 ? 0.5 : 1; S.meters[k] = clamp(S.meters[k]+v*f, 0, 100); }

/* ============ day / weather / task ============ */
function rollWeather(){
  const rain = S.city==='spb' ? 0.42 : 0.25;
  const r = Math.random(); const m = new Date().getMonth();
  S.weather = r < rain ? 'rain' : r < rain+0.3 ? 'cloud' : (m>=10||m<=2) && r > 0.85 ? 'snow' : 'sun';
}
function newTask(){
  const inc = Math.max(8, S.rooms ? totalIncome() : 8);
  const kinds = ['serve','earn','buy','praise'];
  const kind = pick(kinds);
  let goal, label;
  if(kind==='serve'){ goal = 25 + S.level*8; label = 'Обслужить гостей'; }
  if(kind==='earn'){ goal = Math.round(inc*480/100)*100; label = 'Заработать'; }
  if(kind==='buy'){ goal = 3; label = 'Купить улучшения'; }
  if(kind==='praise'){ goal = 3; label = 'Похвалить сотрудников'; }
  S.task = {kind, goal, prog:0, label, reward: Math.max(300, Math.round(inc*240/10)*10), done:false};
}
function taskProg(v){ const t = S.task; if(!t || t.done) return; t.prog += v; if(t.prog >= t.goal){ t.prog = t.goal; t.done = true; addMoney(t.reward); toast('Задание дня выполнено: +'+fmt(t.reward)+' ₽'); sfx('level'); } dirty = true; }
function advanceClock(gmins){
  S.gm += gmins; let days = 0;
  while(S.gm >= CLOSE){ S.gm = OPEN + ((S.gm - CLOSE) % (CLOSE-OPEN)); endDay(true); days++; if(days>30) break; }
  if(days) toast('День '+S.day+' · '+WEATHER[S.weather].n+' · новое задание');
}
function endDay(quiet){
  S.day++;
  const n = 2; for(let i=0;i<n;i++){ const st = clamp(Math.round(S.rep + R(-1.2,1.2)),1,5); S.reviews.unshift({name:pick(REVIEWERS), stars:st, text:pick(REVIEWS[st]), d:S.day-1}); }
  S.reviews = S.reviews.slice(0,20);
  rollWeather(); newTask(); refreshCands();
  structDirty = true;
}

/* ============ incidents ============ */
function pushIncident(def, sid){
  if(S.incidents.length >= 3) expireIncident(S.incidents[0]);
  if(def.who==='staff' && !sid){ const p = staffIn(S.active); if(!p.length) return; sid = pick(p).id; }
  S.incidents.push({uid:S.uid++, id:def.id, sid:sid||null, at:Date.now(), x:def._x||null});
  sfx('alert'); structDirty = true;
}
function defOf(inc){
  if(inc.id==='revenge') return {id:'revenge', t:'Сотрудник сорвался', who:'staff', x:inc.x, o:[
    ['Извиниться при всех',{mood:20,pat:45,soul:2,rep:-1},'{s} кивнул и вернулся к работе. Все сделали вид, что ничего не было.'],
    ['Уволить на месте',{fire:1,chaos:4,moodAll:-10},'{s} ушёл, хлопнув дверью. Остальные притихли.'],
    ['Выходной и премия',{m:-6,mood:35,pat:70},'{s} вернётся завтра. Говорит, что погорячился.']], ig:{fire:1,chaos:3}};
  return INC.find(i=>i.id===inc.id);
}
function fill(s, inc){ const st = inc.sid ? S.staff.find(x=>x.id===inc.sid) : null; return s.replace(/\{s\}/g, st?st.name:'Сотрудник'); }
function spawnIncident(){
  const hw = isHalloween();
  const pool = INC.filter(i=>!S.incidents.some(x=>x.id===i.id) && (!i.season || (i.season==='halloween'&&hw)) && (i.who!=='staff' || staffIn(S.active).length));
  if(pool.length) pushIncident(pick(pool));

function applyFx(fx, sid){

function syncStaff(id){
  const r = rt(id); const list = staffIn(id); const used = {};
  for(const st of list){
    let p = r.staff[st.id];
    const spots = SPOT[st.role]; let home;
    if(spots){ used[st.role] = (used[st.role]||0); home = spots[used[st.role] % spots.length]; used[st.role]++; }
    else home = st.role==='Уборщик' ? [40,270] : [200,226];
    if(!p){ p = r.staff[st.id] = {x:home[0], y:home[1], tx:home[0], ty:home[1], home, walker:!spots, prog:0, distract:null, breakUntil:0, boostUntil:0, boostMul:1, flip:false, t:Math.random()*10}; }
    p.home = home; p.walker = !spots;
    if(!p.walker && !p.distract){ p.tx = home[0]; p.ty = home[1]; }
  }
  for(const sid in r.staff) if(!list.some(s=>s.id===sid)) delete r.staff[sid];
  // pets of the room
  const L = room(id).upg.pets;
  const want = [];
  if(L>=3) want.push({spr:POOL.cat[0], kind:'cat'});
  if(L>=12) want.push({spr:POOL.cat[4]||POOL.cat[1], kind:'cat'});
  if(L>=15) want.push({spr:POOL.dog[2]||POOL.dog[0], kind:'dog'});
  while(r.pets.length < want.length){ const w = want[r.pets.length]; r.pets.push({spr:w.spr, h:petH(w.spr), x:R(40,320), y:R(180,290), tx:R(40,320), ty:R(180,290), idle:R(2,6), flip:false, t:0}); }
  r.pets.length = want.length;
  const n = tableCount(room(id).upg.tables);
  while(r.seats.length < n) r.seats.push(null);
}

function moveTo(e, tx, ty, sp, dt){
  const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx,dy);
  if(d < 1){ e.x = tx; e.y = ty; e.walk = false; return true; }
  const s = Math.min(d, sp*dt); e.x += dx/d*s; e.y += dy/d*s; e.walk = true; if(Math.abs(dx) > 0.5) e.flip = dx > 0; return false;
}

function spawnGuest(id){
  const r = rt(id);
  if(r.queue.length >= 6){ meter('chaos', 0.3); return; }
  const kid = Math.random() < 0.1;
  const spr = kid ? pick(KIDS) : pick(GUESTS);
  const g = {spr, h: kid?34:46, x:DOOR[0], y:DOOR[1]+R(-6,6), state:'toQueue', prog:0, flip:false, t:Math.random()*10, walk:true, pet:null};
  if(Math.random() < 0.12){ const p = pick(PETS); g.pet = {spr:p, h:petH(p), x:g.x+14, y:g.y+4, flip:false, t:0}; markSeen('p', p); }
  markSeen('g', spr);
  r.guests.push(g); r.queue.push(g);
}
function markSeen(k, i){ if(!S.seen[k].includes(i)){ S.seen[k].push(i); if(tab==='book') structDirty = true; } }
function simRoom(id, dt, now){
  const r = rt(id), st = stats(id), rm = room(id);
  // arrivals
  r.spawnT -= dt;
  if(r.spawnT <= 0){ spawnGuest(id); r.spawnT = -Math.log(1-Math.random()) / st.lambda; r.spawnT = clamp(r.spawnT, 1.2, 40); }
  // queue positions
  r.queue.forEach((g,i)=>{ g.qx = QUEUE_X + i*24; });
  const head = r.queue[0];
  if(head && head.state==='queue' && Math.hypot(head.x-QUEUE_X, head.y-QUEUE_Y) < 2){
    head.prog += dt / st.orderT;
    if(head.prog >= 1) completeOrder(id, head, false);
  }
  // prep jobs by baristas
  const baristas = staffIn(id).filter(s=>s.role==='Бариста');
  for(const j of r.jobs){ if(j.by && (!baristas.some(b=>b.id===j.by) || !working(baristas.find(b=>b.id===j.by)))) j.by = null; }
  for(const b of baristas){ if(r.staff[b.id]) r.staff[b.id].prog = 0; }
  for(const b of baristas){ if(!working(b)) continue; if(!r.jobs.some(j=>j.by===b.id)){ const j = r.jobs.find(j=>!j.by); if(j) j.by = b.id; } }
  for(const j of r.jobs.slice()){
    let sp;
    if(j.by){ const b = S.staff.find(s=>s.id===j.by); sp = staffSpeed(b); r.staff[j.by].prog = j.p; }
    else if(!baristas.length && r.jobs.indexOf(j)===0) sp = 0.3; else continue;
    j.p += dt * sp * (1+0.15*rm.upg.machine) / 5;
    if(j.p >= 1) finishJob(id, j);
  }
  // guests movement & states
  for(const g of r.guests){
    g.t += dt;
    if(g.state==='toQueue' || g.state==='queue'){
      const idx = r.queue.indexOf(g);
      if(moveTo(g, QUEUE_X + idx*24, QUEUE_Y + (idx%2)*3, 46, dt)) g.state = 'queue';
    } else if(g.state==='toPick'){
      const p = PICK[Math.min(g.pi, PICK.length-1)];
      if(moveTo(g, p[0], p[1], 46, dt)) g.state = 'wait';
    } else if(g.state==='toSeat'){
      const t = TABLE_SLOTS[g.seat];
      if(moveTo(g, t[0]-18, t[1]-2, 46, dt)){ g.state = 'sit'; g.flip = true; g.sit = R(14,26) * (st.waiters.length ? 0.75 : 1); }
    } else if(g.state==='sit'){
      g.sit -= dt;
      if(g.sit <= 0){
        r.seats[g.seat] = null; g.state = 'leave';
        if(st.waiters.length && Math.random() < 0.55){ const tip = Math.round(st.check*0.12*st.waiters.length); payout(id, g.x, g.y-g.h, tip, 'чай '); }
      }
    } else if(g.state==='leave'){
      if(moveTo(g, DOOR[0]+10, DOOR[1], 50, dt)) g.gone = true;
    }
    if(g.pet){ const p = g.pet; p.t += dt; moveTo(p, g.x + (g.flip?-14:14), g.y + 3, 60, dt); }
  }
  r.guests = r.guests.filter(g=>!g.gone);
  // staff behaviour
  for(const s of staffIn(id)){
    const p = r.staff[s.id]; if(!p) continue; p.t += dt;
    if(p.distract && p.distract.until < now){ p.distract = null; }
    if(p.breakUntil && p.breakUntil < now){ p.breakUntil = 0; }
    const away = (p.distract && p.distract.kind==='smoke') || p.breakUntil > now;
    if(away){ moveTo(p, DOOR[0]+20, p.walker?DOOR[1]:FEET, 55, dt); continue; }
    if(p.walker){
      if(moveTo(p, p.tx, p.ty, 34, dt)){
        p.idle = (p.idle||0) - dt;
        if(p.idle <= 0){
          p.idle = R(1.5,4);
          if(s.role==='Официант'){ const occ = r.seats.map((g,i)=>g?i:-1).filter(i=>i>=0); const t = occ.length ? TABLE_SLOTS[pick(occ)] : pick(TABLE_SLOTS.slice(0,r.seats.length)); p.tx = t[0]+16; p.ty = t[1]+4; }
          else { p.tx = R(30,330); p.ty = R(180,292); }
        }
      }
    } else moveTo(p, p.home[0], p.home[1], 55, dt);
  }
  // cafe pets
  for(const p of r.pets){ p.t += dt; if(moveTo(p, p.tx, p.ty, 18, dt)){ p.idle -= dt; if(p.idle<=0){ p.idle = R(3,9); p.tx = R(30,330); p.ty = R(175,292); } } }
  // floaters
  r.floaters = r.floaters.filter(f=>(f.t += dt) < 1.1);
}
function completeOrder(id, g, tapped){
  const r = rt(id), st = stats(id);
  r.queue.shift();
  let amt = st.check * R(0.85,1.2);
  if(Math.random() < st.dessert) amt += st.dessertAdd;
  if(Math.random() < st.tips) amt *= 1.12;
  if(tapped) amt *= 1.1;
  amt = Math.round(amt);
  payout(id, g.x, g.y - g.h - 4, amt, '');
  addXp(1); if(S.task && S.task.kind==='serve') taskProg(1);
  sfx('coin');
  g.pi = r.pickup.length; r.pickup.push(g); g.state = 'toPick'; g.prog = 0;
  r.jobs.push({g, p:0, by:null});
}
function finishJob(id, j){
  const r = rt(id);
  r.jobs = r.jobs.filter(x=>x!==j);
  if(j.by && r.staff[j.by]) r.staff[j.by].prog = 0;
  const g = j.g; r.pickup = r.pickup.filter(x=>x!==g); r.pickup.forEach((x,i)=>x.pi=i);
  const free = r.seats.map((s,i)=>s?-1:i).filter(i=>i>=0);

  else g.state = 'leave';

cv.addEventListener('pointerdown', e => {
  unlockAudio();
  const b = cv.getBoundingClientRect(); const x = (e.clientX-b.left)/b.width*W, y = (e.clientY-b.top)/b.height*H;
  const id = S.active, r = rt(id);
  // staff first
  let best = null;
  for(const s of staffIn(id)){ const p = r.staff[s.id]; if(!p || p.x>350) continue; const m = META[s.spr]; const w = m[3]*46/m[4]; if(x>p.x-w/2-4 && x<p.x+w/2+4 && y>p.y-50 && y<p.y+4){ if(!best || p.y > best.p.y) best = {s,p}; } }
  if(best){ sfx('tap'); queueModal({kind:'staff', sid:best.s.id}, true); return; }
  // guest at register or waiting pickup -> speed up
  for(const g of r.guests){ if(x>g.x-12 && x<g.x+12 && y>g.y-g.h && y<g.y+4){
    if(r.queue[0]===g && g.state==='queue' && Math.hypot(g.x-QUEUE_X,g.y-QUEUE_Y)<3){ completeOrder(id, g, true); return; }
    if(g.state==='wait'){ const j = r.jobs.find(j=>j.g===g); if(j){ addMoney(Math.round(stats(id).check*0.1)); sfx('tap'); finishJob(id, j); return; } }
  } }
  // tap on register area also serves head
  if(x>186 && x<246 && y>70 && y<COUNTER_Y+30){ const h = r.queue[0]; if(h && h.state==='queue' && Math.hypot(h.x-QUEUE_X,h.y-QUEUE_Y)<3){ h.prog += 0.35; sfx('tap'); if(h.prog>=1) completeOrder(id, h, true); } }
});

/* ============ audio ============ */
let actx = null;
function unlockAudio(){ if(actx || !soundOn) return; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f, d, type, v, delay){ if(!actx || !soundOn) return; const t = actx.currentTime + (delay||0); const o = actx.createOscillator(), g = actx.createGain(); o.type = type||'sine'; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v||0.08, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02); }
function sfx(k){ if(!actx || !soundOn || document.hidden) return;
  if(k==='coin'){ tone(1320,0.08,'square',0.035); tone(1760,0.14,'square',0.035,0.07); }
  else if(k==='buy'){ tone(520,0.07,'triangle',0.07); tone(780,0.1,'triangle',0.07,0.06); tone(1040,0.14,'triangle',0.06,0.12); }
  else if(k==='tap'){ tone(700,0.04,'triangle',0.05); }
  else if(k==='alert'){ tone(440,0.12,'sawtooth',0.04); tone(330,0.16,'sawtooth',0.04,0.12); }
  else if(k==='level'){ [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.06,i*0.09)); }
  else if(k==='bad'){ tone(200,0.2,'sawtooth',0.05); }
}

/* ============ save / load ============ */
function snapshot(){ S.savedAt = Date.now(); S.sound = soundOn; return JSON.stringify(S); }
function save(){ if(!S) return; const js = snapshot(); try{ localStorage.setItem(KEY, js); }catch(e){} }
let lastCloud = 0;
function saveCloud(){
  if(!S || !tg || !tg.CloudStorage || !tg.isVersionAtLeast || !tg.isVersionAtLeast('6.9')) return;
  const js = snapshot(); const parts = []; for(let i=0;i<js.length;i+=3800) parts.push(js.slice(i,i+3800));
  if(parts.length > 60) return;
  try{ parts.forEach((p,i)=>tg.CloudStorage.setItem('bc2_'+i, p)); tg.CloudStorage.setItem('bc2_n', String(parts.length)); }catch(e){}
}
function loadLocal(){ try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function loadCloud(cb){
  if(!tg || !tg.CloudStorage || !tg.isVersionAtLeast || !tg.isVersionAtLeast('6.9')) return cb(null);
  try{ tg.CloudStorage.getItem('bc2_n', (err, n)=>{ n = parseInt(n,10); if(err || !n) return cb(null); const keys = Array.from({length:n},(_,i)=>'bc2_'+i);
    tg.CloudStorage.getItems(keys, (e2, vals)=>{ if(e2 || !vals) return cb(null); try{ cb(JSON.parse(keys.map(k=>vals[k]||'').join(''))); }catch(x){ cb(null); } }); }); }catch(e){ cb(null); }
}
function catchUp(){
  const el2 = Date.now() - (S.savedAt||Date.now());
  if(el2 < 60000) return;
  const secs = Math.min(el2/1000, 8*3600);
  const inc = totalIncome() * secs * 0.5;
  addMoney(inc);
  advanceClock(Math.floor(el2 / MS_PER_GMIN));
  S.staff.forEach(s=>{ s.mood = clamp(s.mood + 10, 0, 100); s.pat = clamp(s.pat + 20, 0, 100); });
  meter('chaos', -secs*0.004);
  queueModal({kind:'away', secs, inc});
}

/* ============ main loop ============ */
let lastT = performance.now(), hudT = 0, saveT = 0, cloudT = 0, gAcc = 0;
function frame(t){
  const dt = Math.min(0.1, (t - lastT)/1000); lastT = t;
  if(S && $('#sMoney')){
    const id = S.active;
    simRoom(id, dt, t);
    for(const r of S.rooms){ if(r.id===id) continue; const rr = rt(r.id); rr.acc += stats(r.id).income * dt; if(rr.acc >= 1){ const v = Math.floor(rr.acc); rr.acc -= v; addMoney(v); } }
    gAcc += dt*1000; if(gAcc >= MS_PER_GMIN){ const n = Math.floor(gAcc/MS_PER_GMIN); gAcc -= n*MS_PER_GMIN; advanceClock(n); }
    // slow drifts
    const cleaners = S.staff.filter(s=>s.role==='Уборщик' && working(s)).length;
    const cl = S.rooms.reduce((a,r)=>a+r.upg.clean,0)/S.rooms.length;
    meter('chaos', -(0.006 + 0.0045*cl + 0.03*cleaners)*dt);
    const target = clamp(2.6 + room(id).upg.decor*0.06 + room(id).upg.menu*0.02 + (S.path==='soul'?0.4:0) - S.meters.chaos*0.015, 1, 5);
    S.rep += (target - S.rep) * 0.004 * dt;
    S.staff.forEach(s=>{ s.mood = clamp(s.mood - 0.012*dt, 0, 100); s.pat = clamp(s.pat + 0.05*dt, 0, 100); });
    maybeDistract(t);
    if(Date.now() >= S.nextInc){ spawnIncident(); S.nextInc = Date.now() + R(180000, 360000); }
    for(const inc of S.incidents.slice()) if(Date.now() - inc.at > 15*60000) expireIncident(inc);
    draw();
    hudT += dt; if(hudT > 0.25){ hudT = 0; renderHud(); refreshAfford(); if(structDirty) renderPanel(); }
    saveT += dt; if(saveT > 5){ saveT = 0; save(); }
    cloudT += dt; if(cloudT > 30){ cloudT = 0; saveCloud(); }
  }
  requestAnimationFrame(frame);
}
function draw(){ if(!cv.width) resizeCanvas(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); drawRoom(S.active); }
document.addEventListener('visibilitychange', ()=>{ if(!S) return; if(document.hidden){ save(); saveCloud(); } else { lastT = performance.now(); catchUp(); } });
window.addEventListener('pagehide', ()=>{ save(); saveCloud(); });

/* ============ boot ============ */
try{ if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#17120e'); tg.setBackgroundColor && tg.setBackgroundColor('#17120e'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } }catch(e){}
function boot(data){
  if(data && data.v===2){ S = data; soundOn = S.sound!==false; S.rooms.forEach(r=>{ UPG.forEach(u=>{ if(r.upg[u.id]==null) r.upg[u.id]=0; }); }); renderGame(); catchUp(); }
  else { S = null; renderStart(); }
}
const local = loadLocal();
boot(local);
loadCloud(cloud=>{ if(cloud && cloud.v===2 && (!S || (cloud.savedAt||0) > (S.savedAt||0) + 5000)){ for(const k in RT) delete RT[k]; modals = []; $('#modalRoot').innerHTML=''; boot(cloud); } });
document.addEventListener('pointerdown', unlockAudio, {once:true});
requestAnimationFrame(frame);
</script>
