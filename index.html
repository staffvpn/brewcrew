/* Layout: one-screen phone game — HUD bar, pixel cafe scene, path meters, tabbed shift panel. Single dark "espresso at closing time" look. */
:root{
  --bg:#16110d;
  --panel:#211913;
  --panel2:#2b2119;
  --line:#3d2f24;
  --cream:#f2e6cf;
  --muted:#ad9a82;
  --caramel:#e9a23b;
  --soul:#86b86a;
  --pathos:#7f9be0;
  --chaos:#de6a4c;
  --bad:#e0574a;
  --shadow:#0b0806;
  --pix:'Return of Ganon','Golos Text',system-ui,sans-serif;
  --body:'Return of Ganon','Golos Text',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:15px;margin:0;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--pix);font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--caramel)}
.clock{font-family:var(--pix);font-size:15px;color:var(--cream);font-variant-numeric:tabular-nums}
.city{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.hud .sp{flex:1}
.pxbtn{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:4px 9px;font-family:var(--pix);font-size:13px}
.pxbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border:2px solid var(--line);padding:4px 6px;min-width:0}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.stat .v{font-family:var(--pix);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--shadow);margin-top:3px}
.bar i{display:block;height:100%;background:var(--caramel)}

/* Scene */
.scene{position:relative;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:#000;flex:none}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:160/112}
.offbanner{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(22,17,13,.88);border:2px solid var(--bad);padding:4px 8px;font-size:12px;text-align:center}

/* Meters */
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:end}
.meter .k{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.meter .k b{font-weight:600;color:var(--cream)}
.meter .bar{height:6px}
.pathline{grid-column:1/-1;font-size:11px;color:var(--muted)}
.pathline b{color:var(--cream);font-weight:600}

/* Tabs + panel */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{position:relative;background:var(--panel);border:2px solid var(--line);padding:7px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--cream);border-color:var(--caramel)}
.badge{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-family:var(--pix);font-size:11px;min-width:17px;height:17px;line-height:17px;padding:0 4px;box-shadow:1px 1px 0 var(--shadow)}
.panel{flex:1;min-height:120px;overflow-y:auto;background:var(--panel);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:6px 2px}
.h{font-family:var(--pix);font-size:14px;color:var(--caramel);letter-spacing:.5px;margin-top:4px}

.card{background:var(--panel2);border:2px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.inc{border-left:4px solid var(--caramel);cursor:pointer;text-align:left}
.card.inc.urgent{border-left-color:var(--bad)}
.card .t{font-weight:700;font-size:14px}
.card .d{font-size:13px;line-height:1.45;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.timer{font-family:var(--pix);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.urgent .timer{color:var(--bad)}
.btn{background:var(--caramel);color:#1b130c;border:none;box-shadow:2px 2px 0 var(--shadow);padding:7px 11px;font-weight:700;font-size:13px}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none;padding:5px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}

.staff{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.ava{width:40px;height:56px;image-rendering:pixelated;background:var(--bg);border:2px solid var(--line)}
.mood{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.mood .bar{flex:1;margin:0}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{font-size:13px;line-height:1.4;background:var(--panel2);border:2px solid var(--line);padding:6px 9px;max-width:92%}
.msg .who{font-weight:700;font-size:12px;margin-right:6px}
.msg .tm{font-family:var(--pix);font-size:11px;color:var(--muted);float:right;margin-left:8px}
.msg.sys{border-style:dashed;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars i{width:9px;height:9px;background:var(--shadow);display:block}
.stars i.on{background:var(--caramel)}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(8,6,4,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.modal{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--caramel);box-shadow:5px 5px 0 var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.modal .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.modal h2{font-family:var(--pix);font-size:22px;line-height:1.15;margin:0;color:var(--cream);text-wrap:balance}
.modal p{margin:0;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:10px 12px;text-align:left;font-size:14px;line-height:1.35;font-weight:500}
.opt:hover{border-color:var(--caramel)}
.opt:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--pix);font-size:12px;padding:2px 7px;border:2px solid var(--line);background:var(--panel2)}
.chip.up{border-color:#5f8a4a}
.chip.down{border-color:#9b3d33}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.sum .n{font-family:var(--pix);font-variant-numeric:tabular-nums;text-align:right}
.sum .tot{border-top:2px solid var(--line);padding-top:4px;font-weight:700}

/* Start screen */
.start{display:flex;flex-direction:column;gap:14px;padding-block:8px}
.logo{font-family:var(--pix);font-size:44px;font-weight:700;line-height:1;color:var(--caramel);text-shadow:3px 3px 0 var(--shadow)}
.tag{color:var(--muted);font-size:15px;margin-top:-6px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice .opt{display:flex;flex-direction:column;gap:4px}
.choice .opt b{font-family:var(--pix);font-size:17px}
.choice .opt span{font-size:12px;color:var(--muted);line-height:1.4}
.opt[aria-pressed="true"]{border-color:var(--caramel);background:#3a2a1b}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel2);border:2px solid var(--caramel);box-shadow:3px 3px 0 var(--shadow);padding:7px 12px;font-size:13px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* ===================== economy ===================== */
function hasRole(r){ return S.staff.some(s=>s.role===r); }
function capacity(){ return 4 + (S.upg.tables?2:0); }
function maxStaff(){ return 4 + (S.upg.kitchen?1:0); }
function checkSize(){
  let m = 1;
  if(!hasRole('Бариста')) m *= 0.35;
  if(!hasRole('Кассир')) m *= 0.75;
  if(hasRole('Официант')) m *= 1.1;
  if(S.upg.kitchen && hasRole('Повар')) m *= 1.2;
  if(S.upg.machine) m *= 1.1;
  if(S.upg.cheap) m *= 0.9;
  m *= (1 + S.meters.pathos*0.004) * (1 - S.meters.chaos*0.002);
  return 320*m;
}
function arrivalsPerHour(){ return 2 + S.rep*1.8 + (S.upg.neon?1.2:0) + S.meters.chaos*0.02 + (S.upg.machine?0.8:0); }
function leader(){ const m=S.meters; return Object.keys(m).reduce((a,b)=>m[b]>m[a]?b:a); }

/* ===================== effects ===================== */
function staffById(id){ return S.staff.find(s=>s.id===id); }
function applyFx(fx, sid, noXp){
  const chips = [];
  const st = sid ? staffById(sid) : null;
  if(fx.m){ S.money += fx.m; S.today.rev += Math.max(0,fx.m); chips.push([(fx.m>0?'+':'−')+fmt(Math.abs(fx.m))+' ₽', fx.m>0]); }
  if(fx.rep){ S.rep = clamp(S.rep + fx.rep/10, 0.5, 5); chips.push(['Репутация '+(fx.rep>0?'+':'−')+(Math.abs(fx.rep)/10).toFixed(1), fx.rep>0]); }
  for(const k of ['soul','pathos','chaos']) if(fx[k]){ S.meters[k] = clamp(S.meters[k]+fx[k]*(S.path&&S.path!==k?0.5:1),0,100); chips.push([METER_N[k]+' '+(fx[k]>0?'+':'−')+Math.abs(fx[k]), null]); }
  if(fx.nerves){ S.nerves = clamp(S.nerves+fx.nerves,0,100); chips.push(['Нервы '+(fx.nerves>0?'+':'−')+Math.abs(fx.nerves), fx.nerves>0]); }
  if(fx.mood && st){ st.mood = clamp(st.mood+fx.mood,0,100); chips.push(['Настроение: '+st.name+' '+(fx.mood>0?'+':'−')+Math.abs(fx.mood), fx.mood>0]); }
  if(fx.moodAll){ S.staff.forEach(s=>s.mood=clamp(s.mood+fx.moodAll,0,100)); chips.push(['Команда '+(fx.moodAll>0?'+':'−')+Math.abs(fx.moodAll), fx.moodAll>0]); }
  if(!noXp) addXp(12);
  if(S.nerves<=0 && S.breakUntil<=absNow()){
    S.breakUntil = absNow()+120; S.nerves = 40;
    sys('Управляющий сорвался и ушёл в отгул на 2 часа. Кофейня без присмотра.');
    toast('Срыв. Управляющий в отгуле 2 часа');
  }
  return chips;
}
function addXp(n){
  S.xp += n;
  let need = 40 + S.level*30;
  while(S.xp >= need){
    S.xp -= need; S.level++; need = 40 + S.level*30;
    toast('Уровень '+S.level);
    if(S.level===LOCK_LEVEL && !S.path){
      S.path = leader();
      queueModal({kind:'path'});
    }
  }
}

/* ===================== incidents ===================== */
function pushIncident(def, force, extra){
  if(!force && S.incidents.length>=5) expireIncident(S.incidents[0], true);
  let sid = null;
  if(def.who==='staff'){
    const pool = def.role ? S.staff.filter(s=>s.role===def.role) : S.staff;
    const p = pool.length ? pool : S.staff;
    if(!p.length) return false;
    sid = pick(p).id;
  }
  S.incidents.push({uid:S.uid++, def:def.id, custom: (def.id==='inherit'?def:null), sid, at:absNow(), c: extra&&extra.c||null});
  if(sid) bubbles[sid] = {k:'!', until: Infinity};
  dirty = true;
  return true;
}
function defOf(inc){
  if(inc.custom) return inc.custom;
  if(inc.def==='costume') return COSTUME_INC;
  return INC.find(i=>i.id===inc.def) || NIGHT.find(i=>i.id===inc.def);
}
function fill(str, inc){
  const st = inc.sid ? staffById(inc.sid) : null;
  return str.replace(/\{s\}/g, st?st.name:'Кто-то').replace(/\{c\}/g, inc.c||'костюме');
}
function spawnRandomIncident(){
  const lead = leader();
  const pool = INC.filter(i=>{
    if(i.city && i.city!==S.city) return false;
    if(S.incidents.some(x=>x.def===i.id)) return false;
    if(i.who==='staff' && !S.staff.length) return false;
    if(i.path){ if(S.path) return S.path===i.path; return lead===i.path || Math.random()<0.35; }
    return true;
  });
  if(pool.length) pushIncident(pick(pool));
}
function expireIncident(inc, crowded){
  const def = defOf(inc);
  applyFx(Object.assign({chaos:1}, def.ig||{}), inc.sid, true);
  S.incidents = S.incidents.filter(x=>x!==inc);
  if(inc.sid && bubbles[inc.sid] && bubbles[inc.sid].k==='!') delete bubbles[inc.sid];
  S.today.auto++; S.autoTotal=(S.autoTotal||0)+1;
  sys('«'+def.t+'» решилось само'+(crowded?', пока ты разбирался с другими':'')+'. Как обычно, плохо.');
  dirty = true;
}
function resolveIncident(inc, idx){
  const def = defOf(inc);
  let [txt, fx, out] = def.o[idx];
  if(typeof fx === 'function'){ const r = fx(S); fx = r[0]; out = r[1]; }
  const chips = applyFx(fx, inc.sid);
  S.incidents = S.incidents.filter(x=>x!==inc);
  if(inc.sid && bubbles[inc.sid] && bubbles[inc.sid].k==='!') delete bubbles[inc.sid];
  S.today.solved++;
  dirty = true; save();
  return {out: fill(out, inc), chips};
}

function quitStaff(st, live){

  if(live){ queueModal({kind:'quit', sid:st.id, reason}); bubbles[st.id] = {k:'!',until:Infinity}; }
  else { removeStaff(st.id); sys(st.name+' уволился. Причина: '+reason+'.'); report.quits.push(st.name); }
}
function removeStaff(id){
  S.staff = S.staff.filter(s=>s.id!==id);
  S.incidents = S.incidents.filter(i=>i.sid!==id);
  delete bubbles[id]; rebuildStaffPos(); dirty = true;
}
function say(st, text){
  S.chat.push({who:st?st.name:null, role:st?st.role:null, text, d:S.day, t:S.gm});
  if(S.chat.length>80) S.chat.shift();
  if(st) bubbles[st.id] = bubbles[st.id] && bubbles[st.id].k==='!' ? bubbles[st.id] : {k:'...', until: performance.now()+3500};
  unreadChat++; dirty = true;
}
function sys(text){ say(null, text); }

/* ===================== clock ===================== */
let report = null; // offline report
let unreadChat = 0, dirty = true;

function stepMinute(live){
  if(S.paused) return;
  S.gm++;
  const now = absNow();
  // arrivals
  if(Math.random() < arrivalsPerHour()/60){
    S.seats = S.seats.filter(t=>t>now);
    if(S.seats.length < capacity()){
      S.seats.push(now + RI(35,70));
      const pay = checkSize()*R(0.8,1.25);
      S.money += pay; S.today.rev += pay; S.today.guests++; addXp(1);
      if(report) report.money += pay;
      if(live) spawnGuest();
    }
  }
  // hourly
  if(S.gm % 60 === 0) hourly(live);
  // incidents
  if(S.gm >= S.nextInc && S.gm < CLOSE-30){
    spawnRandomIncident(); if(report) report.inc++;
    S.nextInc = S.gm + RI(60,170);
  }
  for(const inc of S.incidents.slice()) if(now - inc.at > 240) expireIncident(inc);
  if(S.gm >= CLOSE) endDay(live);
}
function hourly(live){
  S.nerves = clamp(S.nerves+3, 0, 100);
  const understaffed = S.staff.length < 3;
  for(const st of S.staff.slice()){
    let decay = 1.2;
    if(S.upg.rest) decay *= 0.5;
    if(st.trait==='vet') decay *= 0.5;
    if(st.trait==='thief') decay *= 0.6;
    if(understaffed) decay += 0.8;
    st.mood = clamp(st.mood - decay, 0, 100);
    if(st.trait==='thief' && !S.upg.camera){ S.money -= 60; }
    if(st.trait==='eater' && !S.upg.camera){ S.money -= 45; }
    if(st.quitting) continue;

function catchUp(){
  if(S.paused){ queueModal({kind:'day'}); return; }
  const elapsed = Date.now() - (S.lastReal||Date.now());
  const mins = Math.min(Math.floor(elapsed/MS_PER_MIN), 1100);
  if(mins < 30) return;
  report = {mins, money:0, inc:0, quits:[], days:0, auto0:S.today.auto};
  const autoBefore = S.autoTotal||0;
  for(let i=0;i<mins;i++){ stepMinute(false); if(S.paused) break; }
  report.auto = (S.autoTotal||0) - autoBefore;
  queueModal({kind:'away', r:report});
  report = null; save();
}

function moveTo(o, tx, ty, sp){
  const dx = tx-o.x, dy = ty-o.y;
  if(Math.abs(dx) > 0.5){ o.x += Math.sign(dx)*Math.min(sp,Math.abs(dx)); return false; }
  o.x = tx;
  if(Math.abs(dy) > 0.5){ o.y += Math.sign(dy)*Math.min(sp,Math.abs(dy)); return false; }
  o.y = ty; return true;
}
function updateScene(dt){
  const sp = 0.035*dt*speed;

    if(g.phase==='in'){ if(moveTo(g, QUEUE[0], QUEUE[1], sp)){ g.phase='order'; g.wait=900; } }
    else if(g.phase==='order'){ g.wait -= dt*speed; if(g.wait<=0) g.phase='seat'; }
    else if(g.phase==='seat'){ const t = tables()[g.seat]||TABLES[0]; if(moveTo(g, t[0]-7, t[1]-4, sp)){ g.phase='sit'; g.sit = R(14000,26000); } }
    else if(g.phase==='sit'){ g.sit -= dt*speed; if(g.sit<=0){ g.phase='out'; seatGuest[g.seat]=null; } }
    else if(g.phase==='out'){ if(moveTo(g, DOOR[0], DOOR[1]+10, sp)) g.done=true; }
  }
  guests = guests.filter(g=>!g.done);
  for(const id in staffPos){
    const p = staffPos[id];
    if(p.walker){
      if(moveTo(p, p.tx, p.ty, sp*0.7) && Math.random()<0.006){
        const t = pick(tables()); p.tx = t[0]+2; p.ty = t[1]+8;

    }
  }
}

}
function renderHud(){
  if(!$('#clk')) return;
  $('#clk').textContent = 'День '+S.day+' · '+clockStr();
  $('#city').textContent = S.city==='msk'?'Москва':'Петербург';
  $('#sMoney').textContent = fmt(S.money)+' ₽';
  $('#sMoney').style.color = S.money<0?'var(--bad)':'';
  $('#sRep').textContent = S.rep.toFixed(1)+' / 5';
  $('#sNerv').textContent = Math.round(S.nerves);
  $('#bNerv').style.width = S.nerves+'%'; $('#bNerv').style.background = S.nerves<30?'var(--bad)':'var(--caramel)';
  $('#sLvl').textContent = S.level;
  $('#bXp').style.width = Math.min(100, S.xp/(40+S.level*30)*100)+'%';
  $('#brk').hidden = !(S.breakUntil > absNow());
  const m = S.meters;
  $('#meters').innerHTML = ['soul','pathos','chaos'].map(k=>`<div class="meter"><div class="k"><span>${METER_N[k]}</span><b>${Math.round(m[k])}</b></div><div class="bar"><i style="width:${m[k]}%;background:var(--${k})"></i></div></div>`).join('') +
    `<div class="pathline">${S.path ? 'Путь закреплён: <b>'+PATHS[S.path]+'</b>' : 'Путь закрепится на '+LOCK_LEVEL+'-м уровне. Сейчас ведёт: <b>'+METER_N[leader()]+'</b>'}</div>`;
  const bi = $('#bInc'); bi.hidden = !S.incidents.length; bi.textContent = S.incidents.length;
  const bc = $('#bChat'); bc.hidden = !(unreadChat && tab!=='chat'); bc.textContent = Math.min(unreadChat,99);
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===tab));
}
function renderPanel(){
  const p = $('#panel'); if(!p) return;
  dirty = false;
  if(tab==='inc'){
    if(!S.incidents.length){ p.innerHTML = `<div class="empty">Пока тихо. Подозрительно тихо. Новые инциденты появляются каждые 1–3 игровых часа, а нерешённый через 4 часа решается сам — и всегда плохо.</div>`; return; }
    p.innerHTML = '';
    S.incidents.slice().reverse().forEach(inc=>{
      const d = defOf(inc); const left = 240 - (absNow()-inc.at);
      const card = el(`<button class="card inc ${left<60?'urgent':''}"><div class="row"><span class="t">${esc(d.t)}</span><span class="sp"></span><span class="timer">${Math.max(0,Math.ceil(left/60))} ч</span></div><div class="d">${esc(fill(d.x,inc))}</div></button>`);
      card.onclick = () => queueModal({kind:'inc', uid:inc.uid}, true);
      p.appendChild(card);
    });
    return;
  }
  if(tab==='team'){
    p.innerHTML = `<div class="h">Команда · ${S.staff.length} из ${maxStaff()}</div>`;
    if(!S.staff.length) p.appendChild(el(`<div class="empty">Никого. Ты один на кассе, баре и мойке. Найми кого-нибудь ниже.</div>`));
    S.staff.forEach(st=>{
      const tr = TRAITS[st.trait];
      const c = el(`<div class="card staff"><img class="ava" alt="" src="${avatarURL(st.look)}"><div style="display:flex;flex-direction:column;gap:5px;min-width:0">
        <div class="row"><span class="t">${esc(st.name)}</span><span class="d">${st.role}</span><span class="sp"></span><span class="timer">${fmt(st.pay)} ₽/день</span></div>
        <div class="d"><b style="color:var(--cream)">${tr.n}.</b> ${tr.d}</div>
        <div class="mood">Настроение <div class="bar"><i style="width:${st.mood}%;background:${st.mood<25?'var(--bad)':st.mood<50?'var(--caramel)':'var(--soul)'}"></i></div>${Math.round(st.mood)}</div>
        <div class="row"><button class="btn" data-a="bonus">Премия 1 000 ₽</button><button class="btn ghost" data-a="fire">Уволить</button></div></div></div>`);
      c.querySelector('[data-a=bonus]').disabled = S.money < 1000;
      c.querySelector('[data-a=bonus]').onclick = () => { S.money -= 1000; st.mood = clamp(st.mood+20,0,100); say(st, pick(['спасибо, начальник, я вас почти уважаю','на эти деньги куплю себе нормальный кофе. не здесь','о, премия. значит, завтра будет что-то плохое'])); toast(st.name+' доволен'); save(); renderPanel(); renderHud(); };
      const fb = c.querySelector('[data-a=fire]');
      fb.onclick = () => { if(fb.dataset.sure){ sys(st.name+' уволен. Забрал с собой кружку и, кажется, кофемолку.'); removeStaff(st.id); save(); renderPanel(); } else { fb.dataset.sure='1'; fb.textContent='Точно уволить?'; } };
      p.appendChild(c);
    });
    p.appendChild(el(`<div class="h">Кандидаты сегодня</div>`));
    S.candidates.forEach((cd,i)=>{
      const c = el(`<div class="card staff"><img class="ava" alt="" src="${avatarURL(cd.look)}"><div style="display:flex;flex-direction:column;gap:5px;min-width:0">
        <div class="row"><span class="t">${esc(cd.name)}</span><span class="d">${cd.role}</span><span class="sp"></span><span class="timer">${fmt(cd.pay)} ₽/день</span></div>
        <div class="d">${esc(cd.resume)} Характер узнаешь после найма.</div>
        <div class="row"><button class="btn">Нанять за ${fmt(cd.pay)} ₽</button></div></div></div>`);
      const b = c.querySelector('button');
      b.disabled = S.staff.length >= maxStaff() || S.money < cd.pay;
      if(S.staff.length >= maxStaff()) b.textContent = 'Нет мест в команде';
      b.onclick = () => { S.money -= cd.pay; S.staff.push(cd); S.candidates.splice(i,1); rebuildStaffPos(); say(cd, pick(['привет всем. где тут розетка','я новенький, не бейте','а кофе для сотрудников бесплатный?'])); toast(cd.name+': '+TRAITS[cd.trait].n); save(); renderPanel(); renderHud(); };
      p.appendChild(c);
    });
    if(!S.candidates.length) p.appendChild(el(`<div class="empty">Кандидаты закончились. Новые придут завтра утром.</div>`));
    return;
  }
  if(tab==='chat'){
    unreadChat = 0;
    p.innerHTML = `<div class="h">Чат смены</div>`;
    const box = el(`<div class="chat"></div>`);
    S.chat.slice().reverse().slice(0,50).forEach(m=>{
      const st = S.staff.find(s=>s.name===m.who);
      const col = st ? st.look.apron : '';
      const tm = 'Д'+m.d+' '+String(Math.floor(m.t/60)).padStart(2,'0')+':'+String(m.t%60).padStart(2,'0');
      box.appendChild(el(m.who ? `<div class="msg"><span class="tm">${tm}</span><span class="who" style="color:${col==='#262626'||col==='#2f6b55'?'var(--soul)':'var(--caramel)'}">${esc(m.who)}</span>${esc(m.text)}</div>` : `<div class="msg sys"><span class="tm">${tm}</span>${esc(m.text)}</div>`));
    });
    p.appendChild(box); return;
  }
  if(tab==='rev'){
    p.innerHTML = `<div class="h">Отзывы · рейтинг ${S.rep.toFixed(1)}</div>`;
    if(!S.reviews.length) p.appendChild(el(`<div class="empty">Отзывы приходят после закрытия смены, в 22:00.</div>`));
    S.reviews.forEach(r=>p.appendChild(el(`<div class="card"><div class="row"><span class="t">${esc(r.name)}</span><span class="sp"></span>${stars(r.stars)}</div><div class="d">${esc(r.text)}</div><div class="timer">День ${r.d}</div></div>`)));
    return;
  }
  if(tab==='up'){
    p.innerHTML = `<div class="h">Улучшения</div>`;
    UPG.forEach(u=>{
      const have = S.upg[u.id];
      const c = el(`<div class="card"><div class="row"><span class="t">${u.n}</span><span class="sp"></span><span class="timer">${have?'есть':fmt(u.c)+' ₽'}</span></div><div class="d">${u.d}</div>${have?'':'<div class="row"><button class="btn">Купить</button></div>'}</div>`);
      const b = c.querySelector('button');
      if(b){ b.disabled = S.money < u.c; b.onclick = () => buy(u); }
      p.appendChild(c);
    });
  }
}
function stars(n){ return `<span class="stars" aria-label="${n} из 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`; }
function buy(u){
  if(S.money < u.c) return;
  S.money -= u.c; S.upg[u.id] = true;
  if(u.id==='plants'){ S.meters.soul=clamp(S.meters.soul+6,0,100); S.rep=clamp(S.rep+0.1,0.5,5); }
  if(u.id==='neon') S.meters.pathos=clamp(S.meters.pathos+6,0,100);
  if(u.id==='sockets') S.rep=clamp(S.rep+0.1,0.5,5);
  if(u.id==='cheap') S.meters.chaos=clamp(S.meters.chaos+8,0,100);
  if(u.id==='kitchen'){ rebuildStaffPos(); refreshCandidates(); }
  addXp(15);
  if(S.staff.length) say(pick(S.staff), pick(['о, обновка. кто будет мыть?','а зарплату так же обновим?','красиво. но я всё равно уволюсь когда-нибудь']));
  toast('Куплено: '+u.n); save(); renderPanel(); renderHud();
}

/* ===================== modals ===================== */
function queueModal(m, front){ if(front) modals.unshift(m); else modals.push(m); showModal(); }
function closeModal(){ modals.shift(); $('#modalRoot').innerHTML=''; showModal(); renderHud(); renderPanel(); }
function showModal(){
  const root = $('#modalRoot');
  if(root.firstChild || !modals.length) return;
  const m = modals[0];
  const veil = el(`<div class="veil"><div class="modal" role="dialog" aria-modal="true"></div></div>`);
  const box = veil.firstChild;
  const btn = (label, fn, ghost) => { const b = el(`<button class="btn ${ghost?'ghost':''}">${esc(label)}</button>`); b.onclick = fn; return b; };

  if(m.kind==='inc'){
    const inc = S.incidents.find(i=>i.uid===m.uid);
    if(!inc){ closeModal(); return; }
    const d = defOf(inc);
    if(S.breakUntil > absNow()){
      box.append(el(`<div class="eyebrow">Инцидент</div>`), el(`<h2>${esc(d.t)}</h2>`), el(`<p>Управляющий в отгуле после срыва. Вернётся через ${Math.ceil((S.breakUntil-absNow())/60)} ч. Пока решить нельзя.</p>`), btn('Понятно', closeModal));
    } else {
      box.append(el(`<div class="eyebrow">Инцидент${inc.sid?' · '+esc(staffById(inc.sid)?.name||''):''}</div>`), el(`<h2>${esc(d.t)}</h2>`), el(`<p>${esc(fill(d.x,inc))}</p>`));
      const opts = el(`<div class="opts"></div>`);
      d.o.forEach((o,i)=>{
        if(S.nerves < 25 && i===0 && d.o.length>2) return; // на нервах дипломатия недоступна
        const b = el(`<button class="opt">${esc(fill(o[0],inc))}</button>`);
        b.onclick = () => { const r = resolveIncident(inc, i); box.innerHTML=''; box.append(el(`<div class="eyebrow">Итог</div>`), el(`<h2>${esc(d.t)}</h2>`), el(`<p>${esc(r.out)}</p>`), chipsEl(r.chips), btn('Дальше', closeModal)); };
        opts.appendChild(b);
      });
      box.appendChild(opts);
      if(S.nerves < 25) box.appendChild(el(`<div class="empty">Нервы на пределе: вежливый вариант недоступен.</div>`));
      box.appendChild(btn('Подумать потом', closeModal, true));
    }
  }
  else if(m.kind==='quit'){
    const st = staffById(m.sid);
    if(!st){ closeModal(); return; }
    box.append(el(`<div class="eyebrow">Увольнение</div>`), el(`<h2>${esc(st.name)} уходит</h2>`), el(`<p>${esc(st.role)} ${esc(st.name)} кладёт фартук на стойку. Причина: ${esc(m.reason)}.</p>`));
    const opts = el(`<div class="opts"></div>`);
    const a = el(`<button class="opt">Отпустить с миром</button>`);
    a.onclick = () => { removeStaff(st.id); sys(st.name+' уволился. Причина: '+m.reason+'.'); save(); box.innerHTML=''; box.append(el(`<h2>Минус один</h2>`), el(`<p>${esc(st.name)} ушёл, не допив свой бесплатный кофе. Кандидаты — во вкладке «Команда».</p>`), btn('Дальше', closeModal)); };
    const b = el(`<button class="opt">Уговорить остаться: премия 3 000 ₽</button>`);
    b.disabled = S.money < 3000;
    b.onclick = () => { S.money -= 3000; let txt;
      if(Math.random()<0.6){ st.quitting = false; st.mood = clamp(st.mood+35,0,100); txt = st.name+' остаётся. Говорит, что причина «временно рассосалась».'; say(st,'ладно, остаюсь. но луна всё видит'); delete bubbles[st.id]; }
      else { removeStaff(st.id); txt = st.name+' взял премию, поблагодарил и всё равно ушёл.'; sys(st.name+' уволился с премией. Причина: '+m.reason+'.'); }
      save(); box.innerHTML=''; box.append(el(`<h2>Переговоры</h2>`), el(`<p>${esc(txt)}</p>`), btn('Дальше', closeModal)); };
    opts.append(a,b); box.appendChild(opts);
  }
  else if(m.kind==='day'){
    const s = S.summary;
    box.append(el(`<div class="eyebrow">Смена закрыта · день ${s.day}</div>`), el(`<h2>Итоги дня</h2>`));
    box.appendChild(el(`<div class="sum">
      <span>Гостей</span><span class="n">${s.guests}</span>
      <span>Выручка</span><span class="n">+${fmt(s.rev)} ₽</span>
      <span>Зарплаты</span><span class="n">−${fmt(s.wages)} ₽</span>
      <span>Аренда</span><span class="n">−${fmt(s.rent)} ₽</span>
      <span class="tot">За день</span><span class="n tot">${s.rev-s.wages-s.rent>=0?'+':'−'}${fmt(Math.abs(s.rev-s.wages-s.rent))} ₽</span>
      <span>Решено инцидентов</span><span class="n">${s.solved}</span>
      <span>Решились сами</span><span class="n">${s.auto}</span>
    </div>`));
    box.appendChild(el(`<div class="h">Новые отзывы</div>`));
    s.reviews.forEach(r=>box.appendChild(el(`<div class="card"><div class="row"><span class="t">${esc(r.name)}</span><span class="sp"></span>${stars(r.stars)}</div><div class="d">${esc(r.text)}</div></div>`)));
    box.appendChild(el(`<p class="d" style="color:var(--muted);font-size:13px">Ночью кофейня остаётся с командой. Утром узнаешь, что они натворили.</p>`));
    box.appendChild(btn('Открыть кофейню утром', ()=>{ startDay(); closeModal(); }));
  }
  else if(m.kind==='away'){
    const r = m.r;
    box.append(el(`<div class="eyebrow">Пока тебя не было</div>`), el(`<h2>Прошло ${Math.round(r.mins/60)} игровых ч</h2>`));
    box.appendChild(el(`<div class="sum">
      <span>Заработано с гостей</span><span class="n">+${fmt(r.money)} ₽</span>
      <span>Новых инцидентов</span><span class="n">${r.inc}</span>
      <span>Решились сами</span><span class="n">${Math.max(0,r.auto)}</span>
      <span>Смен закрыто</span><span class="n">${r.days}</span>
    </div>`));
    if(r.quits.length) box.appendChild(el(`<p>Уволились: ${esc(r.quits.join(', '))}. Подробности в чате смены.</p>`));
    box.appendChild(btn('К делу', closeModal));
  }
  else if(m.kind==='path'){
    const txt = {soul:'Тебя любят гости, команда держится, дед у окна — почти родственник. Денег меньше, кризисов тоже.',
                 pathos:'Без сахара, без сиропов, без компромиссов. Высокий чек, очереди, капризные звёзды и один шаг до скандала.',
                 chaos:'Кофе из банки, драки за шаурму, кошка на кофемашине. Хаос, проверки и самые дикие истории района.'}[S.path];
    box.append(el(`<div class="eyebrow">Уровень ${LOCK_LEVEL}</div>`), el(`<h2>${PATHS[S.path]}</h2>`), el(`<p>${txt}</p>`), el(`<p style="color:var(--muted);font-size:13px">Путь закреплён. Теперь инциденты и гости будут под него, а остальные шкалы растут вдвое медленнее.</p>`), btn('Так тому и быть', closeModal));
  }
  else if(m.kind==='menu'){
    box.append(el(`<h2>Меню</h2>`), el(`<p style="font-size:13px;color:var(--muted)">День ${S.day}, ${S.city==='msk'?'Москва':'Петербург'}, ${S.premises==='new'?'новое помещение':'б/у помещение'}. Прогресс хранится в этом браузере.</p>`));
    const r = btn('Начать заново', ()=>{ if(r.dataset.sure){ try{localStorage.removeItem(KEY);}catch(e){} S=null; modals=[]; $('#modalRoot').innerHTML=''; guests=[]; staffPos={}; bubbles={}; seatGuest=[]; renderStart(); } else { r.dataset.sure='1'; r.textContent='Точно? Всё пропадёт'; } }, true);
    box.append(r, btn('Закрыть', closeModal));
  }
  root.appendChild(veil);
}
function chipsEl(chips){ const w = el(`<div class="chips"></div>`); chips.forEach(([t,up])=>w.appendChild(el(`<span class="chip ${up===true?'up':up===false?'down':''}">${esc(t)}</span>`))); return w; }

/* ===================== loop ===================== */
let lastSave = 0, hudTick = 0;
function frame(t){
  const dt = Math.min(100, t - lastFrame); lastFrame = t;
  if(S){
    if(!S.paused){
      acc += dt*speed;
      let steps = 0;
      while(acc >= MS_PER_MIN && steps < 30){ acc -= MS_PER_MIN; stepMinute(true); steps++; }
      if(steps){ renderHud(); if(dirty && !(tab==='team' && document.activeElement && document.activeElement.closest && document.activeElement.closest('#panel'))) renderPanel(); }
    }
    updateScene(dt); draw();
    if(t - lastSave > 5000){ lastSave = t; save(); }
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', ()=>{ if(!S) return; if(document.hidden) save(); else { lastFrame = performance.now(); catchUp(); renderHud(); renderPanel(); } });
window.addEventListener('pagehide', save);

/* ===================== boot ===================== */
try{ if(window.Telegram && Telegram.WebApp){ const tg=Telegram.WebApp; tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#16110d'); tg.setBackgroundColor && tg.setBackgroundColor('#16110d'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } }catch(e){}
S = load();
if(S && S.v===1){ renderGame(); catchUp(); }
else { S = null; renderStart(); }
requestAnimationFrame(frame);
</script>
