/* ---------- график: выходные распределяются ровно ---------- */
function balanceSchedule(roomId){
  let changed = 0;
  for(const role of Object.keys(ROLES)){
    const list = S.staff.filter(s=>s.room===roomId && s.role===role && !s.isYou && s.today!=='sub' && s.sched==='5/2');
    if(list.length < 2) continue;
    const cover = [0,0,0,0,0,0,0];
    const sorted = list.slice().sort((a,b)=>(b.legendId?1:0)-(a.legendId?1:0) || b.lvl-a.lvl);
    for(const s of sorted){
      let best = null, bestScore = -1e9;
      for(let d=0; d<7; d++){ const pair = [d, (d+1)%7]; const tmp = cover.slice(); for(let w=0; w<7; w++) if(!pair.includes(w)) tmp[w]++;
        const min = Math.min(...tmp), spread = Math.max(...tmp) - min; const score = min*10 - spread + (pair.includes(5)||pair.includes(6) ? -0.3 : 0);
        if(score > bestScore){ bestScore = score; best = pair; } }
      if(String(s.off) !== String(best)){ s.off = best; changed++; }
      for(let w=0; w<7; w++) if(!best.includes(w)) cover[w]++;
    }
    const tt = S.staff.filter(s=>s.room===roomId && s.role===role && !s.isYou && s.sched==='2/2');
    tt.forEach((s,i)=>{ const ph = (i%2)*2; if(s.phase !== ph){ s.phase = ph; changed++; } });
  }
  return changed;
}
function scheduleHoles(roomId){
  const out = [];
  for(const role of ['Бариста','Кассир','Мойщица','Повар','Официант']){
    const n = S.staff.filter(s=>s.room===roomId && s.role===role && !s.isYou && s.today!=='sub').length; if(n < 2) continue;
    const cov = coverage(roomId, role); const need = Math.ceil(n/2);
    cov.forEach((c,wd)=>{ if(c < need) out.push({role, wd, c, n}); });
  }
  return out;
}

/* ---------- Z-отчёт ---------- */
function zReport(f){
  const lines = [];
  const items = f.items || {}; const top = Object.keys(items).sort((a,b)=>items[b]-items[a])[0];
  const topN = top ? (MENU.find(m=>m.id===top)||{}).n : null;
  lines.push(['Выручка', fmtR(f.rev||0)]);
  lines.push(['Гостей', String(f.guests||0)]);
  if(topN) lines.push(['Хит дня', topN+' × '+items[top]]);
  lines.push(['Ушли злыми', String(Math.max(0, S.c.angry - (S.c._angryZ||0)))]);
  const jokes = [];
  if(topN && items[top] >= 20) jokes.push('Сегодня продано '+items[top]+' «'+topN.toLowerCase()+'». Бариста ненавидит тебя на '+Math.min(99, items[top])+'%');
  if((f.guests||0) === 0) jokes.push('Ни одного гостя. Зато никто не жаловался');
  if((f.rev||0) > 150000) jokes.push('Касса тяжёлая, как совесть кассира');
  if(dirtLevel('main') > 0.5) jokes.push('Пол прилипает к ботинкам. Ботинки прилипают к полу. Круг замкнулся');
  if((S.c.angry - (S.c._angryZ||0)) >= 5) jokes.push('Злых гостей хватит на отдельный отзыв-сериал');
  if(f.fines > 0) jokes.push('Штрафы оплачены. Инспектор доволен, ты — нет');
  const faults = S.staff.filter(s=>s.fault && s.fault.day===S.day).length; if(faults) jokes.push('Косяков персонала за день: '+faults+'. Пиздюли не розданы');
  if(!jokes.length) jokes.push(pick(['Смена закрыта. Все живы, это уже успех','Касса сошлась. Почти. Не спрашивай','Сегодня никто не плакал в подсобке. Рекорд','Кофемашина пережила ещё один день. Ты тоже']));
  S.c._angryZ = S.c.angry;
  return {lines, joke: jokes.slice(0,2).join('. ')};
}

const LINE_SEEN = {};
function pickLine(pool, key){
  key = key || 'x'; const seen = LINE_SEEN[key] = LINE_SEEN[key] || [];
  const fresh = pool.filter(l=>!seen.includes(l)); const line = pick(fresh.length ? fresh : pool);
  seen.push(line); const keep = Math.max(1, Math.floor(pool.length*0.75)); while(seen.length > keep) seen.shift();
  return line;
}

/* ---------- единый журнал денег ----------
   Касса S.money превращается в свойство с сеттером: любое изменение записывается в журнал дня
   (f.L.in / f.L.out по статьям, f.L.inW / f.L.outW — подробности). Итог всегда сходится:
   касса утром + поступления − расходы = касса сейчас. */
const IN_N = {sales:'Продажи', tips:'Чаевые', tasks:'Задания и бонусы', events:'События', level:'Бонус за уровень', stafffine:'Штрафы с персонала', refunds:'Возвраты', sublet:'Субаренда', cashover:'Излишек в кассе', ref:'Агентское вознаграждение', admin:'Поступления от администрации', donate:'Переводы от инвестора', promo:'Гранты и промокоды', pass:'Пропуск сезона', season:'Награды сезона', friends:'Подарки друзей', misc:'Прочие поступления'};
const OUT_N = {supply:'Закупки', wages:'Зарплаты', rent:'Аренда', util:'Коммуналка', tax:'Налог УСН 5%', repairs:'Ремонт и ТО', fines:'Штрафы', invest:'Улучшения, найм, залы', decor:'Интерьер и траты', cashdiff:'Недостача кассы', promoback:'Отзыв вложений', other:'Прочие расходы'};
let MONEY_CTX = null, INCOME_DEF = null, SALE_NEXT = false;
function ledgerOf(f){ if(!f.L) f.L = {in:{}, out:{}, inW:{}, outW:{}}; return f.L; }
function ledgerNote(d){
  if(!S || !S.fin || !S.fin.today || !d) return;
  const f = S.fin.today, L = ledgerOf(f); const c = MONEY_CTX;
  if(d > 0){ const cat = (c && c.cat) || (c && c.out ? 'refunds' : null) || INCOME_DEF || 'misc'; const w = (c && c.why) || IN_N[cat] || 'Поступление';
    L.in[cat] = (L.in[cat]||0) + d; const k = cat+'|'+w; L.inW[k] = (L.inW[k]||0) + d; }
  else { const v = -d; const cat = (c && c.out) || (c && c.cat ? 'other' : 'other'); const w = (c && c.why) || 'Разное';
    L.out[cat] = (L.out[cat]||0) + v; const k = cat+'|'+w; L.outW[k] = (L.outW[k]||0) + v; }
}
function ledgerize(s){
  if(!s || s.__lg) return;
  let v = Number(s.money) || 0;
  Object.defineProperty(s, 'money', {enumerable:true, configurable:true, get(){ return v; }, set(n){ n = Number(n) || 0; const d = n - v; v = n; if(d && S === s) ledgerNote(d); }});
  Object.defineProperty(s, '__lg', {value:true, enumerable:false});
  if(s.fin && s.fin.today && s.fin.today.open == null){ const f = s.fin.today, L = ledgerOf(f); f.open = v - sumObj(L.in) + sumObj(L.out); }
}
function sumObj(o){ let t = 0; for(const k in (o||{})) t += o[k]||0; return t; }

// расход: старая логика статей + журнал

  MONEY_CTX = {out: OUT_N[cat] ? cat : 'other', why: why || SPEND_WHY || (OUT_N[cat]||'Разное')}; S.money -= v; MONEY_CTX = null;

const DECOR_SLOTS = {floor:3, counter:2};
function decorOwned(){ return (S.decor && S.decor.items) || []; }
function hasDecor(id){ return decorOwned().some(x=>x.id===id); }
function decorDef(id){ return DECOR.find(d=>d.id===id); }
function decorFree(slot){ return DECOR_SLOTS[slot] - decorOwned().filter(x=>decorDef(x.id) && decorDef(x.id).slot===slot && !decorDef(x.id).season).length; }
function setsDone(){ return DECOR_SETS.filter(st=>st.need.every(hasDecor)); }
function decorMul(k){ let m = 1;
  for(const it of decorOwned()){ const d = decorDef(it.id); if(!d) continue; if(it.id==='ficus' && it.wilt) continue; const v = d.fx[k]; if(typeof v === 'number' && k!=='dessert' && k!=='daily' && k!=='repDay') m *= v; }
  for(const st of setsDone()) if(st.fx[k]) m *= st.fx[k];
  if(k==='traffic' && S.billboard > absNow()) m *= 1.25;
  return m; }
function buyDecor(id){
  const d = decorDef(id); if(!d || d.season) return 'Не продаётся';
  if(hasDecor(id)) return 'Уже стоит в зале';
  if(decorFree(d.slot) <= 0) return 'Нет свободного места: '+(d.slot==='floor'?'на полу':'на стойке')+'. Продай что-нибудь';
  if(S.money < d.price) return 'Не хватает денег';

}

function sellDecor(id){ const d = decorDef(id); if(!d) return; S.decor.items = S.decor.items.filter(x=>x.id!==id); if(d.price) income(Math.round(d.price*0.3), 'refunds', 'Продал с Авито: '+d.n); HOOK.struct(); }

};
function sezInfo(id){ id = id || sezId(); if(SEZ_INFO[id]) return Object.assign({id}, SEZ_INFO[id]); const m = +id.slice(5,7); const winter = m===12 || m<=2;
  return {id, n:'Сезон «'+SEZ_MONTHS[m-1][0].toUpperCase()+SEZ_MONTHS[m-1].slice(1)+' смена»', d:'Новый месяц — новый сезон: свой рейтинг, свои награды.', drink:'Сезонный раф', item:'garland', style: winter ? 'int_winter' : 'int_autumn', leg:{name:'Сезонная легенда', sex:'m', bio:'Пришёл по объявлению «нужен бариста с душой». Душа на месте, остальное тоже.'}}; }
const SZ_TIER = 140, SZ_TIERS = 30;
function szState(){ const id = sezId(); if(!S.sz || S.sz.id !== id){ if(S.sz) szArchive(S.sz); S.sz = {id, sp:0, acc:0, claimed:{f:[], p:[]}, login:null, profit:0}; HOOK.struct(); } return S.sz; }
function szArchive(z){ S.szHist = (S.szHist||[]).concat([{id:z.id, sp:z.sp, tier:szTier(z)}]).slice(-12); }
function szTier(z){ z = z || S.sz; return z ? Math.min(SZ_TIERS, Math.floor(z.sp / SZ_TIER)) : 0; }
function szAdd(v, why){ if(!S) return; const z = szState(); const t0 = szTier(z); z.sp += v; const t1 = szTier(z); if(t1 > t0){ HOOK.toast('Сезон: ступень '+t1+'. Забери награду во вкладке «Сезон»'); HOOK.sfx('level'); HOOK.struct(); } }
function passOwned(id){ id = id || sezId(); return ((S.ent && S.ent.passes) || []).some(p=>p.season===id); }
function dayBase(){ const h = (S.fin.hist||[]).slice(0,7).map(f=>f.rev||0); const avg = h.length ? h.reduce((a,b)=>a+b,0)/h.length : 0; return Math.max(50000, Math.round(avg*0.3/1000)*1000); }

function szClaim(track, n, silent){

  if(rw.k==='money') income(rw.v, track==='p' ? 'pass' : 'season', track==='p' ? 'Пропуск сезона: '+rw.t.toLowerCase() : 'Сезон: '+rw.t.toLowerCase());

  else if(rw.k==='mod') addMod('traffic', n===20 ? 1.2 : 1.15, 24, rw.t+': гостей +'+(n===20?20:15)+'%');

  else if(rw.k==='item') addDecor(info.item);
  else if(rw.k==='style'){ S.szStyles = Array.from(new Set((S.szStyles||[]).concat([info.style]))); }

  else if(rw.k==='legend') szLegend(info);
  else if(rw.k==='drink') S.szDrink = info.id;
  else if(rw.k==='goldm') S.goldMachine = true;
  else if(rw.k==='badge') S.szBadge = info.id;
  if(!silent){ HOOK.sfx('coin'); }
  HOOK.struct(); return null;
}

/* ---------- промокоды: применение и отзыв ---------- */
function promoApply(rw, code){
  // rw: {kind, amount, legend, ends_at, style}
  S.promos = S.promos || {};
  const legend = rw.legend || pick(['Грант районной администрации','Инвестиция под условие: пока ты с нами','Помощь от фонда поддержки кофеен','Деньги нашлись в кармане старой куртки']);
  let msg = '';
  if(rw.kind==='money'){ income(rw.amount, 'promo', legend); msg = legend+': +'+fmtR(rw.amount); }
  else if(rw.kind==='days'){ const v = cashPackV(rw.amount); income(v, 'promo', legend); rw.amount = v; msg = legend+': +'+fmtR(v); }
  else if(rw.kind==='legend'){ const st = makePrizeStaff(Math.max(5, Math.min(50, rw.amount||20))); st.promo = code; if(typeof syncScene==='function') syncScene('main'); msg = st.name+' выходит на смену по промокоду'; }
  else if(rw.kind==='boost'){ S.promoBoost = {code, mul:1 + (rw.amount||20)/100, until:rw.ends_at || Date.now()+3*86400000}; msg = 'Гостей +'+(rw.amount||20)+'% до '+new Date(S.promoBoost.until).toLocaleDateString('ru-RU'); }
  else if(rw.kind==='xp'){ addXp(rw.amount||500); msg = 'Опыт +'+(rw.amount||500); }
  else if(rw.kind==='style'){ S.promoStyles = S.promoStyles || {}; S.promoStyles[rw.style] = rw.ends_at || Date.now()+7*86400000; msg = 'Интерьер открыт до '+new Date(S.promoStyles[rw.style]).toLocaleDateString('ru-RU'); }
  S.promos[code] = {kind:rw.kind, amount:rw.amount, at:Date.now(), ends:rw.ends_at||null};
  HOOK.struct(); return msg;
}
function cashPackV(days){ const h = (S.fin.hist||[]).slice(0,7).map(f=>f.rev||0); const avg = h.length ? h.reduce((a,b)=>a+b,0)/h.length : 0; return Math.round(Math.max(300000*days, avg*days)/1000)*1000; }
function promoRevoke(code){
  const p = (S.promos||{})[code]; if(!p || p.revoked) return null; p.revoked = Date.now();
  let msg = 'Промокод «'+code+'» отозван: ты отписался от канала';
  if(p.kind==='money' || p.kind==='days'){ const v = Math.min(Math.max(0, S.money), p.amount||0); if(v > 0){ MONEY_CTX = {out:'promoback', why:'Инвестор отозвал вложения: отписка от канала'}; S.money -= v; MONEY_CTX = null; } msg += '. Инвестор забрал '+fmtR(v); }
  if(p.kind==='legend'){ const st = S.staff.find(s=>s.promo===code); if(st){ removeStaff(st.id); msg += '. '+st.name+' ушёл вместе с инвестором'; } }
  if(p.kind==='boost' && S.promoBoost && S.promoBoost.code===code) S.promoBoost = null;
  if(p.kind==='style' && S.promoStyles) for(const k in S.promoStyles) S.promoStyles[k] = 0;
  HOOK.struct(); return msg;
}

let REP_OFF = false, REP_CAUSE = null;
const REP_N = {angry:'Злые гости', slip:'Падения на мокром полу', reviews:'Отзывы', events:'События', rush:'Запары', rivals:'Конкуренты', decor:'Интерьер и траты', staff:'Команда', other:'Другое'};
function repAdd(v){
  if(!v || !S) return;
  if(v < 0 && REP_OFF) return;                 // пока игрока нет, рейтинг не падает
  if(v < 0 && S.rep < 2) v *= 0.5;             // дно: ниже 2,0 падает вдвое медленнее
  if(v < 0 && S.rep < 1.5) v *= 0.6;
  S.rep = clamp(S.rep + v, 1, 5);
  const c = REP_CAUSE || INCOME_DEF_REP() || 'other';
  const f = S.fin && S.fin.today; if(f){ f.repLog = f.repLog || {}; f.repLog[c] = (f.repLog[c]||0) + v; }
}
function INCOME_DEF_REP(){ return INCOME_DEF==='events' ? 'events' : INCOME_DEF==='tasks' ? 'rush' : null; }
function withRep(cause, fn){ return function(){ const prev = REP_CAUSE; REP_CAUSE = cause; try{ return fn.apply(this, arguments); } finally { REP_CAUSE = prev; } }; }
simulateOffline = (function(fn){ return function(){ const prev = REP_OFF; REP_OFF = true; try{ return fn.apply(this, arguments); } finally { REP_OFF = prev; } }; })(simulateOffline);
rivalsDay = withRep('rivals', rivalsDay);

function reviewTick(){
  if(!S.isOpen || !chance(1/16)) return;
  const f = S.fin.today, guests = Math.max(12, f.guests||0), angry = Math.max(0, S.c.angry - (S.c._angryDay||0));
  const angryRate = angry / (guests + angry);

  q = q*0.75 + S.rep*0.25;
  const stars = clamp(Math.round(q + R(-0.9, 0.9)), 1, 5);
  S.reviews = S.reviews || [];
  S.reviews.unshift({id:S.uid++, day:S.day, stars, author:pick(REV_AUTH), text:pick(REV_TXT[stars]), reply:null});
  S.reviews = S.reviews.slice(0, 25);
  REP_CAUSE = 'reviews'; repAdd((stars - 3) * 0.02); REP_CAUSE = null;
  if(stars <= 2) HOOK.toast('Новый отзыв на картах: '+stars+' из 5'); HOOK.struct();
}

function storyFx(st, inc, chips){
  const T = S.story;

  if(st.rel) for(const k in st.rel){ srelAdd(k, st.rel[k]); chips.push([CHARS[k].n+': '+(st.rel[k]>0?'+':'')+st.rel[k], st.rel[k]>0]); }

  if(st.dl){ T.dl = {amount:st.dl.amount||0, label:st.dl.label, by:S.day+st.dl.days, beat:st.dl.beat, cond:st.dl.cond||null}; scheduleBeat(st.dl.days, st.dl.beat, 13); chips.push([st.dl.label+(st.dl.amount?': '+fmtR(st.dl.amount):'')+' до дня '+T.dl.by, false]); }
  if(st.clear) T.dl = null;
  if(st.next) scheduleBeat(st.next[0], st.next[1]);
  if(st.next2) scheduleBeat(st.next2[0], st.next2[1]);
  if(st.season) startSeason(T.season+1, st.season);
  if(st.delay){ const d = T.dl; if(d){ if(srel('palych') >= 0 || chance(0.3)){ d.amount = Math.round(d.amount*1.3/1000)*1000; d.by = S.day+7; scheduleBeat(7, d.beat, 13); chips.push(['Отсрочка на 7 дней, долг +30%', null]); return 'Палыч кивает: «Неделя. И тридцать процентов сверху»'; }

}

function avgRev(){ const h = S.fin.hist.slice(0,7); return h.length ? h.reduce((a,f)=>a+f.rev,0)/h.length : 50000; }
function genSeason(){
  const v = pick(GEN_VILLAINS); const amount = Math.round(Math.max(200000, avgRev()*(v.mul||6))/1000)*1000;
  return {v:GEN_VILLAINS.indexOf(v), title:v.t+': '+v.n, amount, days:RI(12,18)};
}
function genStart(){ scheduleBeat(0, 'g_intro'); }

function maybeArc(){
  if(chance(0.025) === false) return;
  const free = S.staff.filter(s=>s.today!=='sub' && !s.isYou && !S.story.arcs[s.id] && s.shifts >= 5);
  if(!free.length) return;
  const s = pick(free); const arc = pick(ARCS); S.story.arcs[s.id] = arc;
  S.pending.push({at:absNow()+RI(60, 600), ev:'a_'+arc, data:{sid:s.id}});
}

function weekNews(){
  const T = S.story; T.newsN++;
  const w = S.fin.hist.slice(0,7); const rev = w.reduce((a,f)=>a+f.rev,0), guests = w.reduce((a,f)=>a+f.guests,0);
  const items = [];
  items.push(['Итоги недели', '«'+S.name+'» обслужила '+guests+' гостей и заработала '+fmtR(rev)+'.']);
  const T2 = T.dl;
  if(T2) items.push(['Сроки', 'Источники сообщают: у «'+S.name+'» осталось '+Math.max(0,T2.by-S.day)+' дней, чтобы закрыть вопрос «'+T2.label+'».']);
  const pals = [
    [srel('palych') < -30, 'Криминал', 'Валерия Палыча снова видели у вашего дома. Говорят, он «не забыл».'],
    [sflag('roof'), 'Слухи', 'Говорят, у одной кофейни района теперь «надёжные друзья».'],
    [srel('arseniy') < -20, 'Бизнес', '«Кофе Хаус Плюс» ищет новое помещение в квартале. Совпадение?'],
    [sflag('alliance'), 'Соседи', 'Союз трёх кофеен района выпустил общую карту гостя. Сеть нервничает.'],
    [S.meters.chaos > 60, 'Жалобы', 'Жители жалуются на шум и «странных людей» у одной из кофеен.'],
    [S.rep >= 4.5, 'Рейтинг', '«'+S.name+'» вошла в топ кофеен района по отзывам.'],
    [S.c.absurd > 5, 'Странное', 'Очевидцы сообщают о гусях, медиумах и людях в костюмах кальмара у местной кофейни.'],
    [S.story.karma < -3, 'Шёпот', 'Про владельца одной кофейни говорят разное. В основном плохое.'],
    [S.story.karma > 4, 'Люди', 'Пенсионеры района называют одну кофейню «единственным местом, где тебе рады».']
  ].filter(x=>x[0]);
  pals.slice(0,3).forEach(x=>items.push([x[1], x[2]]));
  items.push(['Погода и прочее', pick(['На следующей неделе обещают дождь. Зонты — к кассе.','В районе открылся барбершоп. Бородатые клиенты пойдут за кофе.','Местный гусь замечен в трёх дворах одновременно.','Управляющая компания обещает починить лифт. Опять.'])]);
  HOOK.modal({kind:'news', n:T.newsN, items});
}
function storyMidnight(){
  if(!S.story) S.story = storyInit();
  const T = S.story;
  if(S.day % 7 === 0) weekNews();
  maybeArc();
  // карма слегка влияет на поток гостей
  if(T.karma <= -5 && chance(0.08)) { addMod('traffic', 0.92, 24, 'Дурная слава: гостей −8%'); }
  if(T.karma >= 5 && chance(0.08)) { addMod('traffic', 1.08, 24, 'Добрая слава: гостей +8%'); }
  // клиффхэнгер: что будет завтра
  const soon = S.pending.filter(p=>p.ev && EV[p.ev] && EV[p.ev].cat==='story' && p.at < (S.day+2)*DAY_MIN).sort((a,b)=>a.at-b.at)[0];
  if(soon){ const tease = {s1_palych:'Говорят, тобой интересовались люди в кожаных куртках.', s1_deadline:'Завтра Палыч придёт за деньгами.', s2_offer:'В район приехал человек в очень дорогом костюме.', s3_call:'Тебе пытались дозвониться с незнакомого московского номера.', s4_somov:'Депутат Сомов спрашивал, где тут хорошая кофейня.', s5_news:'Управляющая компания готовит какое-то объявление.', s6_viktor:'Кто-то видел Виктора в аэропорту. Он вернулся.', s5_auction:'Завтра аукцион.', g_deadline:'Завтра развязка.'}[soon.ev];
    if(tease) HOOK.toast(tease); }
}

/* ---------- поведение ходячих сотрудников ---------- */
function staffWalk(id, r, s, p, dt){
  if(s.role==='Мойщица') return washerWalk(id, r, s, p, dt);
  if(!p.walker){ const tg2 = s.role==='Бариста' ? baristaTarget(id, s, p) : s.role==='Кассир' ? p.home : p.home; if(s.role==='Кассир') p.flip = true; moveTo(p, tg2[0], tg2[1], 70, dt); return; }
  const legend3 = s.legendId===1 ? 3 : 1;
  const speed = 34 * (s.role==='Мойщица' ? 1.2 : 1) * Math.min(1.6, staffSpeed(s));
  if(s.distract){ p.walk = false; return; }
  // работа на месте
  if(p.job){ p.job.t -= dt * staffSpeed(s) * legend3; p.walk = false;
    if(p.job.t <= 0){ const j = p.job; p.job = null;
      if(j.kind==='mess'){ const i = r.mess.indexOf(j.m); if(i>=0){ r.mess.splice(i,1); meter('chaos', -0.5); } }
      if(j.kind==='table'){ cleanDirty(id, j.key); }
      if(j.kind==='dish'){ S.dishes[id] = Math.max(0, (S.dishes[id]||0) - (s.role==='Мойщица' ? 2 : 1)); }
    } return; }
  if(p.goal){ if(moveTo(p, p.goal.x, p.goal.y, speed, dt)){ const g = p.goal; p.goal = null;
      if(g.kind==='mess' && r.mess.includes(g.m)) p.job = {kind:'mess', m:g.m, t:2.2};
      else if(g.kind==='table' && (r.dirty||{})[g.key]) p.job = {kind:'table', key:g.key, t:1.6};
      else if(g.kind==='dish') p.job = {kind:'dish', t:1.8}; }
    return; }
  // выбор цели
  if(s.role==='Мойщица'){
    const ms = (r.mess||[]).slice().sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
    const dk = Object.keys(r.dirty||{})[0];
    if(ms){ p.goal = {kind:'mess', m:ms, x:ms.x+10, y:ms.y+4}; return; }
    if(dk){ const sp = dirtySpot(id, dk); if(sp){ p.goal = {kind:'table', key:dk, x:sp[0], y:sp[1]}; return; } }
    if((S.dishes[id]||0) > 0){ p.goal = {kind:'dish', x:SINK[0], y:SINK[1]}; return; }
    if(moveTo(p, SINK[0]-20, SINK[1]+30, speed, dt)) p.walk = false; return;
  }
  if(s.role==='Официант'){
    const dk = Object.keys(r.dirty||{})[0];
    if(dk && chance(dt*0.8)){ const sp = dirtySpot(id, dk); if(sp){ p.goal = {kind:'table', key:dk, x:sp[0], y:sp[1]}; return; } }
    if(moveTo(p, p.tx, p.ty, speed, dt)){ p.idle = (p.idle||0) - dt;
      if(p.idle <= 0){ p.idle = R(1.5,4); const occ = r.seats.map((g,i)=>g?i:-1).filter(i=>i>=0 && slotOf(id,i)[2]!=='out'); const t = occ.length ? slotOf(id, pick(occ)) : null;
        if(t && t[2]==='table'){ const tb = TABLES[t[3]]; p.tx = tb.x + R(-10,10); p.ty = tb.y + 24; } else if(t){ p.tx = t[0] + 16; p.ty = t[1] + 14; } else { p.tx = R(60,236); p.ty = R(260,H-8); } } }
    return;
  }
  if(moveTo(p, p.tx, p.ty, speed, dt)){ p.idle = (p.idle||0) - dt; if(p.idle <= 0){ p.idle = R(1.5,4); p.tx = R(60,236); p.ty = R(260,H-8); } }
}

function attention(){
  const out = [], id = S.active;
  for(const inc of S.incidents){ const d = evDef(inc); if(d) out.push(['tasks', fillText(d.t, inc), true]); }
  if(youNeeded('main')){ const crew = S.staff.filter(x=>!x.isYou && x.room==='main'); out.push(['team', !crew.some(x=>x.role==='Бариста') && !crew.some(x=>x.role==='Кассир') ? 'Ты один за стойкой: найми бариста и кассира' : !crew.some(x=>x.role==='Бариста') ? 'Нет бариста: ты варишь кофе сам' : 'Нет кассира: ты стоишь на кассе сам', true]); }
  for(const st of S.staff){ if(st.isYou) continue;
    if(st.distract) out.push(['team', st.name+': '+DISTRACT[st.distract.kind].toLowerCase(), false]);
    else if(st.today==='absent') out.push(['team', st.name+' не вышел на смену', true]);
    else if(st.pat < 35) out.push(['team', st.name+' вот-вот сорвётся', false]);
    else if(st.mood < 30) out.push(['team', st.name+': плохое настроение', false]); }
  const ls = lowStock(); if(ls.length) out.push(['stock', 'Заканчивается: '+ls.map(k=>STOCK[k].n.toLowerCase()).join(', '), true]);
  for(const r of S.rooms) for(const k in r.broken) if(r.broken[k]) out.push(['stock', EQ[k].n+' сломана', true]);
  const rm = room(id); for(const k in rm.eq) if(!rm.broken[k] && rm.eq[k] < 40) { out.push(['stock', EQ[k].n+': износ, пора обслужить', false]); break; }
  if(S.debt.stage>=1 || S.money<0) out.push(['money', 'Касса в минусе', true]);
  if(S.fin.taxDueDay - S.day <= 2 && S.money < S.fin.taxAcc) out.push(['money', 'Скоро налог, а денег не хватает', true]);
  if(S.story && S.story.dl) out.push(['story', S.story.dl.label+': осталось '+Math.max(0,S.story.dl.by-S.day)+' дн.', true]);
  const tl = (S.tasks||[]).filter(t=>!t.done && !t.failed).length; if(tl) out.push(['tasks', 'Задания дня: осталось '+tl, false]);
  if(S.rivals.some(r=>r.status==='sale')) out.push(['district', 'Конкурент продаёт помещение', false]);
  { const wn = S.staff.filter(x=>x.wish).length; if(wn) out.push(['team', 'Сотрудники чего-то хотят: '+wn, false]); }
  if(daysSinceInventory() >= 7) out.push(['stock', 'Инвентаризацию не делали '+daysSinceInventory()+' дн.', daysSinceInventory()>=10]);
  if(S.tips && S.tips.jar >= tipJarCap()*0.8) out.push(['money', 'Банка чаевых почти полная', false]);
  const ub = typeof unansweredBad==='function' ? unansweredBad() : 0; if(ub) out.push(['guests', 'Плохие отзывы без ответа: '+ub, true]);
  const rq = RT[S.active]; if(rq && rq.outside > 0) out.push(['team', 'Очередь на улице: '+rq.outside+' чел.', true]);
  if(S.delivery && S.delivery.on && S.delivery.rating < 4) out.push(['tasks', 'Рейтинг доставки падает: '+S.delivery.rating.toFixed(1).replace('.',','), false]);
  const step = onbStep(); if(step) out.push([step.tab, 'Первые шаги: '+step.t, false]);
  return out;
}

function upgMetric(u, id){
  const rm = room(id);
  const at = L => { const was = rm.upg[u.id]; rm.upg[u.id] = L; let v;
    const st = stats(id), h0 = S.gm;
    if(u.id==='machine') v = Math.round(st.prepCap*14*60);
    else if(u.id==='register') v = Math.round((st.orderCap||0)*14*60);
    else if(['sign','decor','pets','tables'].includes(u.id)){ let sum = 0; for(let hh=0; hh<24; hh++){ S.gm = hh*60+30; sum += stats(id).lambda/rushMul()*14*60; } S.gm = h0; v = Math.round(sum/ (S.isOpen?1:1)); }
    else if(u.id==='menu') v = Math.round(estCheck(id));
    else if(u.id==='storage') v = Math.round(100*(1+0.25*L));
    rm.upg[u.id] = was; return v; };
  const L = rm.upg[u.id]; const a = at(L), b = L<MAXL ? at(L+1) : null; if(a==null) return '';
  const unit = {machine:'напитков в час', register:'заказов в час', sign:'гостей в день', decor:'гостей в день', pets:'гостей в день', tables:'гостей в день', menu:'₽ средний чек', storage:'% склада'}[u.id];
  return `<div class="metric"><b class="num">${fmt(a)}</b>${b!=null?` → <b class="num g">${fmt(b)}</b>`:''} ${unit}</div>`;
}

  const rm = room(id); let k = 0;
  while(k < n && rm.upg[u.id] < Math.min(MAXL, upgCap())){ const c = upCost(u, rm.upg[u.id], id); if(S.money < c) break; spend(c, 'invest', 'Улучшение: '+u.n); rm.upg[u.id]++; addXp(6); k++; }

function staffStatus(s){

  if(s.today==='absent') return ['warn','Прогул'];
  if(s.today==='training') return ['','На обучении'];
  if(s.vacation && s.vacation>=S.day) return ['','В отпуске'];
  if(s.breakUntil > Date.now()) return ['','Перерыв'];
  if(s.away) return ['warn','Обиделся'];
  if(s.lateUntil && s.lateUntil>absNow()) return ['warn','Опаздывает'];
  if(s.notice) return ['warn','Отрабатывает'];

function doHire(c, id, contract, cost){
  if(S.money < cost) return;
  if(c.claim && !c.interviewed){ const said = c.lvl; c.lvl = c.realLvl || c.lvl; c.claim = false; setTimeout(()=>toast(c.name+' говорил, что уровень '+said+'. На деле — '+c.lvl+'. Надо было собеседовать'), 1200); }
  spend(Math.round(cost), 'invest', 'Найм: '+c.name+' ('+c.role.toLowerCase()+')'); hire(c, id, contract); syncScene(id); sfx('buy'); toast(c.name+' в команде. Выходные: '+c.off.map(d=>WEEKDAYS[d]).join(', ')); save(); structDirty = true; renderPanel();
}

const FIN_ROWS = [['rev','Выручка',1],['invest','Улучшения и найм',-1],['acq','Эквайринг 2%',-1],['comm','Комиссия доставки',-1],['supply','Закупки',-1],['wages','Зарплаты',-1],['rent','Аренда',-1],['util','Коммуналка',-1],['tax','Налог УСН',-1],['repairs','Ремонт и ТО',-1],['fines','Штрафы',-1],['other','Прочее',-1]];
function cashFlow(f){ return f.rev - f.acq - (f.comm||0) - f.supply - f.wages - f.rent - f.util - f.tax - f.repairs - f.fines - f.other - (f.invest||0); }
function tipsCard(p){

let finCat = 'other';
const FIN_CAT_N = {invest:'Улучшения и найм', other:'Прочее', repairs:'Ремонт и ТО', fines:'Штрафы', supply:'Закупки', rent:'Аренда', util:'Коммуналка', tax:'Налог'};
function finDetail(){
  const t = S.fin.today, week = [t].concat(S.fin.hist.slice(0,6));
  const box = el(`<div class="card fin-detail"><div class="t">Куда ушли деньги</div><div class="chips fcats"></div><div class="fd"></div></div>`);
  const cats = ['other','invest','repairs','fines','supply'];
  const chips = box.querySelector('.fcats');
  cats.forEach(k=>{ const b = el(`<button class="chipbtn" aria-pressed="${finCat===k}">${FIN_CAT_N[k]}</button>`); b.onclick = () => { finCat = k; sfx('tap'); renderPanel(); }; chips.appendChild(b); });
  const agg = (fs) => { const m = {}; for(const f of fs){ if(!f || !f.why) continue; for(const key in f.why){ const [c0, w] = key.split('|'); if(c0!==finCat) continue; const g = w.split(':')[0]; m[g] = (m[g]||0) + f.why[key]; } } return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const today = agg([t]), wk = agg(week);
  const fd = box.querySelector('.fd');
  const list = (rows, title) => rows.length ? `<div class="h2">${title}</div>${rows.slice(0,8).map(([w,v])=>`<div class="zl"><span>${esc(w)}</span><i></i><b class="num">−${fmt(v)}</b></div>`).join('')}` : `<div class="h2">${title}</div><div class="d">Пусто. Деньги целы, пока что</div>`;
  const last = (t.last||[]).filter(x=>x.c===finCat).slice(0,10);
  fd.innerHTML = list(today, 'Сегодня') + list(wk, 'За 7 дней') + (last.length ? `<div class="h2">Последние списания</div>${last.map(x=>`<div class="zl"><span>${String(Math.floor(x.gm/60)).padStart(2,'0')}:${String(x.gm%60).padStart(2,'0')} · ${esc(x.w)}</span><i></i><b class="num">−${fmt(x.v)}</b></div>`).join('')}` : '');
  return box;
}
function renderFin(p){
  const t = S.fin.today, y = S.fin.hist[0];

  const sum = k => week.reduce((a,f)=>a+(f[k]||0),0);

  const tbl = el(`<div class="card receipt-card"><div class="rhead">«${esc(S.name)}»<br>ДЕНЬ ${S.day} · КАССОВЫЙ ОТЧЁТ</div><div class="fin"><span></span><b>Сегодня</b><b>Вчера</b><b>7 дней</b>${FIN_ROWS.map(([k,n,sg])=>`<span>${n}</span><i class="num">${fmt((sg<0?-1:1)*(t[k]||0))}</i><i class="num">${y?fmt((sg<0?-1:1)*(y[k]||0)):'—'}</i><i class="num">${week.length?fmt((sg<0?-1:1)*sum(k)):'—'}</i>`).join('')}

/* ---------- события ---------- */
function renderEvents(p){

  S.incidents.slice().reverse().forEach(inc=>{
    const d = evDef(inc); if(!d) return; const left = Math.max(0, 20 - (Date.now()-inc.at)/60000);

/* ---------- модалки ---------- */
function queueModal(m, front){ if(front) modals.unshift(m); else modals.push(m); showModal(); }
function closeModal(){ modals.shift(); $('#modalRoot').innerHTML = ''; showModal(); renderHud(); structDirty = true; }
function chipsEl(chips){ const w = el(`<div class="chips"></div>`); (chips||[]).forEach(([t,g])=>w.appendChild(el(`<span class="chip ${g===true?'g':g===false?'b':''}">${esc(t)}</span>`))); return w; }
function share(text){
  const url = 'https://brewcrew.pages.dev', msg = 'Brew Crew, кофейня «'+S.name+'»: '+text;
  if(tg && tg.openTelegramLink){ tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(msg)); return; }
  try{ navigator.clipboard.writeText(msg+' '+url).then(()=>toast('Текст скопирован, вставь его в чат'), ()=>toast('Не получилось скопировать')); }catch(e){ toast('Не получилось скопировать'); }
}
function showModal(){
  const root = $('#modalRoot'); if(root.firstChild || !modals.length || !S) return;
  const m = modals[0];
  const veil = el(`<div class="veil"><div class="modal" role="dialog" aria-modal="true"></div></div>`); const box = veil.firstChild;
  const btn = (label, fn, cls) => { const b = el(`<button class="btn ${cls||''}">${esc(label)}</button>`); b.onclick = fn; return b; };
  const sticky = ['path','bankrupt','franchise','inc','rz','inventory'].includes(m.kind);
  veil.addEventListener('click', e => { if(e.target===veil && !sticky) closeModal(); });

  if(m.kind==='inc'){
    const inc = S.incidents.find(i=>i.uid===m.uid); if(!inc){ closeModal(); return; }
    const d = evDef(inc);
    const st = inc.sid ? S.staff.find(s=>s.id===inc.sid) : null;
    const tag = {absurd:'Абсурд', inspect:'Проверка', staff:'Команда', break:'Поломка', money:'Деньги', story:'Сюжет · '+seasonName()}[d.cat] || 'Событие';
    const ch = d.who ? CHARS[d.who] : null; if(d.who){ S.story.met = S.story.met || {}; S.story.met[d.who] = 1; }
    const head = el(`<div class="row">${ch?`<div class="spr" style="${sprStyle(charSpr(d.who),60)}"></div>`:st?`<div class="spr" style="${sprStyle(staffSpr(st),56)}"></div>`:''}<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="eyebrow">${esc(tag)}${ch?' · '+esc(ch.n):st?' · '+esc(st.name):''}</div><h2>${esc(fillText(d.t, inc))}</h2></div></div>`);
    box.append(head, el(`<p>${esc(fillText(d.x, inc))}</p>`));
    const opts = el(`<div class="opts"></div>`);
    d.o.forEach((o,i)=>{ if(o.cond && !o.cond(st)) return; if(o.req && !o.req(S, inc)) return; const b = el(`<button class="opt">${esc(fillText(o.t,inc))}</button>`);
      b.onclick = () => { const r = resolveIncident(inc, i); sfx('tap'); save(); box.innerHTML = '';
        box.append(el(`<div class="eyebrow">Итог</div>`), el(`<h2>${esc(r.title)}</h2>`), el(`<p>${esc(r.out)}</p>`), chipsEl(r.chips));
        const row = el(`<div class="row"></div>`); row.append(btn('Поделиться', ()=>share(r.title+'. '+r.out), 'ghost'), btn(pick(HARD.ok), closeModal)); box.appendChild(row); };
      opts.appendChild(b); });
    box.append(opts);
    if(d.cat!=='inspect') box.appendChild(btn('Решу позже', closeModal, 'ghost'));
  }
  else if(m.kind==='result'){
    const d = EV[m.inc.id];
    box.append(el(`<div class="eyebrow">Последствия</div>`), el(`<h2>${esc(fillText(d.t, m.inc))}</h2>`), el(`<p>${esc(fillText(d.x, m.inc))}</p>`), chipsEl(applyFxPreview(d.auto)));
    const row = el(`<div class="row"></div>`); row.append(btn('Поделиться', ()=>share(fillText(d.t,m.inc)+'. '+fillText(d.x,m.inc)), 'ghost'), btn('Понятно', closeModal)); box.appendChild(row);
  }
  else if(m.kind==='news'){
    box.classList.add('paper');
    box.append(el(`<div class="eyebrow">Районные вести · выпуск ${m.n}</div>`), el(`<h2>Новости квартала</h2>`));
    m.items.forEach(([h,t])=>box.appendChild(el(`<div class="newsitem"><b>${esc(h)}</b><p>${esc(t)}</p></div>`)));
    const row = el(`<div class="row"></div>`); row.append(btn('Поделиться', ()=>share('Районные вести: '+m.items.map(x=>x[1]).slice(0,2).join(' ')), 'ghost'), btn('Читать дальше', closeModal)); box.appendChild(row);
  }
  else if(m.kind==='rz'){
    const d = EV[m.id]; const inc = {uid:S.uid++, id:m.id, at:Date.now()};
    let done = false;
    box.classList.add('rzbox');
    box.append(el(`<div class="eyebrow">Казус в запару</div>`), el(`<h2>${esc(d.t)}</h2>`), el(`<p>${esc(d.x)}</p>`));
    const tb = el(`<div class="rztimer"><i></i></div>`); box.appendChild(tb);
    const opts = el(`<div class="opts"></div>`);
    const finish = (r) => { done = true; box.innerHTML = ''; box.append(el(`<div class="eyebrow">Итог</div>`), el(`<h2>${esc(d.t)}</h2>`), el(`<p>${esc(r.out)}</p>`), chipsEl(r.chips), btn(pick(HARD.ok), closeModal)); save(); };
    d.o.forEach((o,i)=>{ if(o.cond && !o.cond(null)) return; const b = el(`<button class="opt">${esc(o.t)}</button>`); b.onclick = () => { if(done) return; sfx('tap'); const r = resolveIncident(inc, i); finish(r); }; opts.appendChild(b); });
    box.appendChild(opts);
    const ms = (d.timer||15)*1000; const t0 = Date.now();
    const tick = () => { if(done) return; const left = 1 - (Date.now()-t0)/ms; tb.firstChild.style.width = Math.max(0, left*100)+'%'; if(left <= 0){ const r = applyFx(d.auto||{}, inc); if(d.autoFx) d.autoFx(S); sfx('bad'); finish({out:d.autoOut||'Не успел решить. Решилось само. Плохо.', chips:r.chips}); return; } requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  else if(m.kind==='interview'){
    const c = S.cands.find(x=>x.id===m.cid); if(!c){ closeModal(); return; }
    const said = c.lvl; const qa = doInterview(c);
    box.append(el(`<div class="row"><div class="spr" style="${sprStyle(staffSpr(c),60)}"></div><div><div class="eyebrow">Собеседование · ${c.role}</div><h2>${esc(c.name)}</h2></div></div>`));

    box.appendChild(btn('Понятно', closeModal));
  }
  else if(m.kind==='level'){
    box.classList.add('kraftbox');
    box.append(el(`<div class="eyebrow">Новый уровень</div>`), el(`<h2>Уровень ${m.lvl}</h2>`), el(`<ul class="introl">${m.perks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`), el(`<p>Бонус от района: +${fmt(m.bonus)} ₽.</p>`), btn(pick(HARD.close), closeModal));
  }

/* ---------- кассовый отчёт, который сходится ---------- */
let finView = 'today', finOpen = null;
function finSum(list){ const L = {in:{}, out:{}, inW:{}, outW:{}}; let open = null, ok = true;
  for(const f of list){ if(!f.L){ ok = false; continue; } for(const g of ['in','out','inW','outW']) for(const k in f.L[g]) L[g][k] = (L[g][k]||0) + f.L[g][k]; }
  const last = list[list.length-1]; open = last && last.open != null ? last.open : null; return {L, open, ok}; }
function renderFin(p){
  const t = S.fin.today, hist = S.fin.hist;
  const views = {today:[t], yday: hist[0] ? [hist[0]] : [], week:[t].concat(hist.slice(0,6))};
  const sel = views[finView] || [t];
  const {L, ok} = finSum(sel);
  const oldest = sel[sel.length-1];
  const open = oldest && oldest.open != null ? oldest.open : null;
  const tin = sumObj(L.in), tout = sumObj(L.out);
  const close = finView==='today' ? S.money : (open != null ? open + tin - tout : null);
  const diff = finView==='today' && open != null ? Math.round(close - (open + tin - tout)) : 0;
  const nav = el(`<div class="subnav finnav">${[['today','Сегодня'],['yday','Вчера'],['week','7 дней']].map(([k,n])=>`<button class="chipbtn" data-k="${k}" aria-pressed="${finView===k}">${n}</button>`).join('')}</div>`);
  nav.querySelectorAll('button').forEach(b=>b.onclick = () => { finView = b.dataset.k; finOpen = null; renderSheet(); });
  p.appendChild(nav);
  const row = (k, n, v, sign, g) => `<button class="fl ${finOpen===g+k?'open':''}" data-g="${g}" data-k="${k}"><span>${esc(n)}</span><i></i><b class="num ${sign<0?'neg':''}">${sign<0?'−':'+'}${fmt(v)}</b></button>`;
  const det = (g, k) => { const W = g==='in' ? L.inW : L.outW; const list = Object.keys(W).filter(x=>x.startsWith(k+'|')).map(x=>[x.split('|').slice(1).join('|'), W[x]]).sort((a,b)=>b[1]-a[1]).slice(0,12); return `<div class="fdet">${list.map(([w,v])=>`<div><span>${esc(w)}</span><b class="num">${fmt(v)}</b></div>`).join('') || '<div><span>Подробностей нет</span></div>'}</div>`; };
  const ins = Object.keys(L.in).filter(k=>L.in[k]>=1).sort((a,b)=>L.in[b]-L.in[a]);
  const outs = Object.keys(L.out).filter(k=>L.out[k]>=1).sort((a,b)=>L.out[b]-L.out[a]);
  const html = `<div class="card receipt-card rc15"><div class="rhead">«${esc(S.name)}»<br>${finView==='today'?'ДЕНЬ '+S.day:finView==='yday'?'ВЧЕРА':'7 ДНЕЙ'} · КАССОВЫЙ ОТЧЁТ</div>
    ${!ok?'<div class="d">Часть дней из старой версии игры: по ним подробностей нет.</div>':''}
    <div class="fl tot"><span>Касса на начало</span><i></i><b class="num">${open!=null?fmt(open):'—'}</b></div>
    <div class="fh">Поступления</div>${ins.map(k=>row(k, IN_N[k]||k, L.in[k], 1, 'in') + (finOpen==='in'+k ? det('in', k) : '')).join('') || '<div class="d">Пока ничего</div>'}
    <div class="fl sub"><span>Итого поступлений</span><i></i><b class="num">+${fmt(tin)}</b></div>
    <div class="fh">Расходы</div>${outs.map(k=>row(k, OUT_N[k]||k, L.out[k], -1, 'out') + (finOpen==='out'+k ? det('out', k) : '')).join('') || '<div class="d">Пока ничего</div>'}
    <div class="fl sub"><span>Итого расходов</span><i></i><b class="num neg">−${fmt(tout)}</b></div>
    ${diff ? `<div class="fl"><span>Прочие движения</span><i></i><b class="num">${diff>0?'+':'−'}${fmt(Math.abs(diff))}</b></div>` : ''}
    <div class="fl tot"><span>${finView==='today'?'Касса сейчас':'Касса на конец'}</span><i></i><b class="num">${close!=null?fmt(close):'—'}</b></div>
    <div class="fl"><span>Прибыль от работы кофейни</span><i></i><b class="num ${sel.reduce((a,f)=>a+opProfit(f),0)<0?'neg':''}">${fmt(sel.reduce((a,f)=>a+opProfit(f),0))}</b></div>
    <div class="d">Прибыль от работы — без переводов, промокодов, вложений в зал и интерьер. Нажми на строку, чтобы увидеть подробности.</div></div>`;
  const card = el(html); p.appendChild(card);
  card.querySelectorAll('button.fl').forEach(b=>b.onclick = () => { const k = b.dataset.g + b.dataset.k; finOpen = finOpen===k ? null : k; renderSheet(); });

    if(o.op==='refgift'){ income(a, 'ref', tx.includes('3 уровня') ? 'Агентское вознаграждение: '+tx : 'Подъёмные за вход по приглашению'); toast(tx || ('Бонус за друзей: +'+fmt(a)+' ₽')); sfx('level'); FR.loaded = 0; }
    else if(o.op==='give'){ const leg = tx || pick(ADMIN_LEG); income(a, 'admin', leg); toast(leg+': +'+fmt(a)+' ₽'); sfx('coin'); }
    else if(o.op==='take'){ MONEY_CTX = {out:'other', why: tx || 'Списание администрацией'}; S.money -= a; MONEY_CTX = null; toast((tx || 'Администрация списала')+': −'+fmt(a)+' ₽'); sfx('bad'); }
    else if(o.op==='set'){ MONEY_CTX = {cat:'admin', out:'other', why:'Баланс выставлен администрацией'}; S.money = a; MONEY_CTX = null; toast('Администрация установила баланс '+fmt(a)+' ₽'); }
    else if(o.op==='ent'){ refreshEntitlements(); toast('Покупки обновлены'); }
    else if(o.op==='msg'){ queueModal({kind:'adminmsg', text:tx}); }
    else if(o.op==='staff'){ const st = makePrizeStaff(Math.max(5, Math.min(50, a||20))); toast('В команду пришёл '+st.name+', уровень '+st.lvl+'. '+tx); sfx('level'); syncScene('main'); }
    else if(o.op==='rename'){ S.name = String(tx||S.name).slice(0,28); toast('Название кофейни изменено: «'+S.name+'»'); setTimeout(renderGame, 50); }
    else if(o.op==='fpraise'){ S.reviews = S.reviews||[]; S.reviews.unshift({id:S.uid++, day:S.day, stars:5, author:tx||'Друг', text:'Зашёл к другу. Кофе отличный, бариста живой, кот наглый. Пять звёзд.', reply:null}); repAdd(0.05); toast((tx||'Друг')+' оставил отзыв на пять звёзд'); }
    else if(o.op==='fgift'){ income(a, 'friends', (tx||'Друг')+' оставил чаевые'); toast((tx||'Друг')+' оставил чаевые '+fmt(a)+' ₽'); sfx('coin'); }
    else if(o.op==='fprank'){ pushIncident('f_prank', {sname:tx||'Друг'}); }
    else if(o.op==='level'){ S.level = Math.max(1, Math.min(60, a||1)); S.xp = 0; toast('Администрация выдала уровень '+S.level); sfx('level'); setTimeout(renderGame, 50); }
    else if(o.op==='cash'){ const v = cashPack(a||1); const leg = tx || 'Перевод от инвестора'; income(v, 'donate', leg); toast(leg+': +'+fmt(v)+' ₽ в кассу'); sfx('coin'); }
    else if(o.op==='promorevoke'){ const msg = promoRevoke(tx); if(msg) queueModal({kind:'promo', title:'Инвестор отозвал вложения', text:msg+'. Следующий промокод сработает, когда снова подпишешься и выйдет новый код.', channel:CFG.channel||null}); }
    else if(o.op==='badge'){ S.badges = Array.from(new Set((S.badges||[]).concat([tx]))); toast('Новый значок: '+tx); sfx('level'); }
    else if(o.op==='wipe') wipe = true;
  }
  save(); saveCloud(); structDirty = true; renderHud();
  apiPost('/api/ack', {ids:ops.map(o=>o.id)}).then(()=>{ if(wipe){ hardReset(); toast('Аккаунт удалён администрацией'); } }).catch(()=>{});
}

/* ---------- миграция сохранений ---------- */
const _migrate14 = migrate;
migrate = function(){
  _migrate14();
  ledgerize(S);
  S.decor = S.decor || {items:[]}; S.tension = S.tension || {};
  for(const r of S.rooms){ if(r.upg.ware == null) r.upg.ware = 0; }
  const f = S.fin.today; if(!f.L) f.L = {in:{}, out:{}, inW:{}, outW:{}}; if(f.open == null) f.open = S.money - sumObj(f.L.in) + sumObj(f.L.out); f.byRoom = f.byRoom || {}; f.cash = f.cash || {fake:0, fakeN:0, caught:0, err:0, errN:0, over:0, theft:0, who:{}};
  szState(); mergeInteriors();
};

/* ================= v15.1: кухня, вкладки, быстрый старт, тише уведомления ================= */
guestLeaves = withRep('angry', guestLeaves);
slipTick = withRep('slip', slipTick);
simRoom = withRep('angry', simRoom);
// вкладки: «Интерьер» уходит в «Улучшения», «Район» — в «Гости»
for(const k of ['decor','district']){ const i = HALL_TABS.findIndex(t=>t[0]===k); if(i >= 0) HALL_TABS.splice(i, 1); }
TAB_N.district = 'Гости'; TAB_N.decor = 'Улучшения';
const _attention15 = attention;
attention = function(){ const out = _attention15().map(a=>a[0]==='district' ? ['guests', a[1], a[2]] : a[0]==='decor' ? ['up', a[1], a[2]] : a);
  if(S.bookNew) out.push(['guests', 'Новых в книге гостей: '+S.bookNew, false]); return out; };
const _renderGuests14 = renderGuests;
renderGuests = function(p){ repCard(p); _renderGuests14(p); S.bookNew = 0; p.appendChild(el(`<div class="h chalk">Район</div>`)); renderDistrict(p); };
const _renderUpgrades14 = renderUpgrades;
renderUpgrades = function(p, id){ _renderUpgrades14(p, id); if(id==='main'){ p.appendChild(el(`<div class="h chalk" id="decorH">Интерьер и траты</div>`)); renderDecor(p); } };
if(hallTab==='decor' || hallTab==='district') hallTab = 'team';
// рейтинг: что тянет вниз и что поднимает
function repCard(p){
  const t = S.fin.today, y = S.fin.hist[0] || {};
  const rows = L => Object.keys(L||{}).filter(k=>Math.abs(L[k]) >= 0.005).sort((a,b)=>L[a]-L[b]).map(k=>`<div class="zl"><span>${esc(REP_N[k]||k)}</span><i></i><b class="num" style="color:${L[k]<0?'var(--bad)':'var(--good)'}">${L[k]>0?'+':'−'}${Math.abs(L[k]).toFixed(2).replace('.',',')}</b></div>`).join('');
  const today = rows(t.repLog), yday = rows(y.repLog);
  p.appendChild(el(`<div class="card chalkboard rep15"><div class="t chalk">Рейтинг ${S.rep.toFixed(2).replace('.',',')}</div>
    <div class="d">Опускают: гости, ушедшие злыми из очереди, грязь, мокрый пол без таблички, плохие отзывы без ответа, проваленные запары. Поднимают: быстрая очередь, чистота, ответы на отзывы, выдержанные запары, хорошие решения в событиях, интерьер и меню.</div>
    <div class="d">Ниже 2,0 рейтинг падает вдвое медленнее. Пока тебя нет в игре, он не падает.</div>
    ${today?`<div class="h2">Сегодня</div>${today}`:''}${yday?`<div class="h2">Вчера</div>${yday}`:''}${!today && !yday?'<div class="d">Сегодня рейтинг пока не менялся.</div>':''}</div>`));
}
// быстрый старт для новичков
const _renderStart14 = renderStart;
renderStart = function(){ _renderStart14(); const go = $('#go'); if(!go || $('#quick')) return; const q = el(`<button class="btn big ghost" id="quick">Быстрый старт: всё «нормальное»</button>`); q.onclick = () => { go.click(); setTimeout(()=>{ const o = $('#open'); if(o && !o.disabled) o.click(); }, 30); }; go.after(q); };
// достижения — коротким уведомлением, без окна посреди запары
HOOK.modal = (function(fn){ return m => { if(m && m.kind==='ach'){ toast('Достижение: '+m.n+(m.reward?' · +'+(m.reward*3)+'% к доходу навсегда':'')); return; } return fn(m); }; })(HOOK.modal);
// блюда: повар готовит, отдаёт на раздачу
function markFood(id, g){ const r = rt(id); const j = r.jobs.filter(j=>j.g===g).pop(); if(!j) return; const m = MENU.find(x=>x.n===g.item); j.food = !!(m && (m.kitchen || m.food)); }
const _completeOrder14 = completeOrder;
completeOrder = function(id, g, tapped){ _completeOrder14(id, g, tapped); if(g.state==='toPick') markFood(id, g); };
const _spawnCourier14 = spawnCourier;
spawnCourier = function(id){ const r = rt(id); const n = r.guests.length; _spawnCourier14(id); const g = r.guests[r.guests.length-1]; if(r.guests.length > n && g && g.courier) markFood(id, g); };
function drawKitchenFx(id, r){
  if(id !== 'main') return; const k = S.kitchen || {tier:0}; if(!k.tier || k.build) return;
  const now = performance.now()/1000; const x = BAR_X1 + 4, y = 156;
  const cooks = workingStaff(id).filter(s=>s.role==='Повар');
  const here = cooks.filter(s=>{ const p = r.staff[s.id]; return p && p.x < W && !s.distract && !(s.breakUntil > Date.now()); });
  for(const s of here){ const p = r.staff[s.id]; const busy = r.jobs.some(j=>j.by===s.id);
    if(busy){ const sh = Math.sin(now*14)*1.6; ctx.fillStyle = '#2a2a2e'; ctx.beginPath(); ctx.ellipse(p.x - 12 + sh, p.y - 30, 6, 2, 0, 0, 7); ctx.fill(); rect(p.x - 6 + sh, p.y - 31, 6, 1.4, '#2a2a2e');
      if(k.tier >= 2 && Math.sin(now*5 + p.x) > 0.3){ ctx.fillStyle = 'rgba(255,140,40,.85)'; ctx.beginPath(); ctx.moveTo(p.x-17+sh, p.y-28); ctx.lineTo(p.x-12+sh, p.y-40 - Math.sin(now*9)*3); ctx.lineTo(p.x-7+sh, p.y-28); ctx.fill(); }
      for(let i=0;i<2;i++){ const t = (now*0.9 + i*0.5) % 1; ctx.fillStyle = `rgba(255,255,255,${0.5*(1-t)})`; ctx.beginPath(); ctx.arc(p.x - 12 + i*4, p.y - 36 - t*14, 2 + t*2, 0, 7); ctx.fill(); } } }
  const ready = r.jobs.filter(j=>j.ready).length;
  for(let i=0;i<Math.min(3, ready);i++){ EL(x + 10 + i*12, y - 2, 5, 1.8, '#f3e8d3'); EL(x + 10 + i*12, y - 3.5, 3.4, 1.6, ['#c9935a','#e9c46a','#b8463a'][i]); }
  if(ready && S.rush && S.rush.until > absNow() && here[0] && (!r.hotT || now - r.hotT > 7)){ r.hotT = now; bubble2(0, 0, pick(['Горячее на раздачу!','Забирайте, остывает!','Сырники стынут, кто берёт?!']), 2400, r.staff[here[0].id]); }
  if(here[0] && stockQty('food') < 1 && MENU.some(m=>m.food && isUnlocked(m.id)) && (!r.noFoodT || now - r.noFoodT > 40)){ r.noFoodT = now; bubble2(0, 0, pick(['Холодильник пустой. Из чего готовить, из воздуха?','Продуктов нет. Я развожу руками','Закажите продукты, или я начну жарить меню']), 2800, r.staff[here[0].id]); }
  if(!here.length){ RR(x + 2, y - 15, 44, 11, 2, '#2a2a2e'); txt(cooks.length ? 'ПОВАР НА ПЕРЕКУРЕ' : 'ПОВАРА НЕТ', x + 24, y - 7.5, '800 4.6px "Golos Text",sans-serif', '#ffd36b', 'center'); }
}
const _draw15 = draw;
draw = function(){ _draw15(); try{ ctx.setTransform(scale,0,0,scale,-OX*scale,0); drawKitchenFx(S.active, rt(S.active)); }catch(e){} };

/* ---------- запуск: в самом конце, когда всё объявлено ---------- */
boot(loadLocal());
loadConfig();
if(S){ streakCheck(); refreshEntitlements(); loadFriends(); setTimeout(()=>track(), 1500); }
loadCloud(cloud=>{ if(cloud && cloud.v===3 && (!S || (cloud.savedAt||0) > (S.savedAt||0) + 5000)){ for(const k in RT) delete RT[k]; modals = []; $('#modalRoot').innerHTML=''; boot(cloud); refreshEntitlements(); } });
document.addEventListener('pointerdown', unlockAudio, {once:true});
requestAnimationFrame(frame);
