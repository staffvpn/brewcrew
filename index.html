<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brew Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=Caveat:wght@600;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone tapper — HUD, day task strip, room switcher, live cafe scene, path meters, tabbed management panel. Single warm-dark look around bright pixel art. */
:root{
  --bg:#17120e; --panel:#211913; --panel2:#2c2219; --line:#3e3026; --cream:#f3e8d3; --muted:#ae9b84;
  --caramel:#eaa33c; --soul:#86b86a; --pathos:#86a2e6; --chaos:#e06a4c; --bad:#e0574a; --good:#7fc76a; --shadow:#0a0705;
  --disp:'Unbounded','Golos Text',system-ui,sans-serif; --body:'Golos Text',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:14px;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.num{font-variant-numeric:tabular-nums}
.hud{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end}
.cafe{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--caramel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.money{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;text-align:right;white-space:nowrap}
.money.pulse{animation:pulse .35s ease}
@keyframes pulse{50%{transform:scale(1.08);color:var(--caramel)}}
.inc{font-size:12px;color:var(--good);text-align:right;white-space:nowrap}
.hudrow{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.hudrow b{color:var(--cream);font-weight:600}
.hudrow .sp{flex:1}
.lvl{display:flex;align-items:center;gap:6px;min-width:110px}
.bar{height:5px;background:var(--shadow);flex:1}
.bar i{display:block;height:100%;background:var(--caramel)}
.pxbtn{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:3px 9px;font-size:12px;font-weight:600}
.task{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);padding:5px 9px;font-size:12px}
.task .t{flex:1;min-width:0}
.task b{color:var(--caramel)}
.task .bar{max-width:80px}
.rooms{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{flex:none;background:var(--panel);border:2px solid var(--line);padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.room[aria-pressed="true"]{border-color:var(--caramel);color:var(--cream);background:var(--panel2)}
.room small{font-weight:500;color:var(--good);margin-left:4px}
.scene{position:relative;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:#000;flex:none;touch-action:manipulation}
#cv{display:block;width:100%;aspect-ratio:360/300;height:auto}
.meters{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:center}
.meter .k{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.meter .k b{color:var(--cream);font-weight:600}
.meter .bar{height:4px;margin-top:2px}
.path{font-size:11px;color:var(--muted);white-space:nowrap}
.path b{color:var(--cream)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{position:relative;background:var(--panel);border:2px solid var(--line);padding:7px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--cream);border-color:var(--caramel)}
.badge{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.panel{flex:1;min-height:130px;overflow-y:auto;background:var(--panel);border:2px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:7px}
.h{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--caramel);margin-top:3px}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--panel2);border:2px solid var(--line);padding:8px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .t{font-weight:700;font-size:14px}
.card .d{font-size:12px;line-height:1.4;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.row .sp{flex:1}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.up .t{font-weight:700;font-size:14px}
.up .eff{font-size:12px;color:var(--muted)}
.up .eff b{color:var(--good);font-weight:600}
.pips{grid-column:1/-1;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.pips i{height:5px;background:var(--shadow)}
.pips i.on{background:var(--caramel)}
.btn{background:var(--caramel);color:#1b130c;border:none;box-shadow:2px 2px 0 var(--shadow);padding:8px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none;padding:6px 10px}
.btn.red{background:var(--bad);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.spr{flex:none;background-repeat:no-repeat;image-rendering:auto}
.staff{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;text-align:left;width:100%}
.staff .mood{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.book .cell{height:56px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.book .cell.no .spr{filter:brightness(0);opacity:.35}
.veil{position:fixed;inset:0;background:rgba(8,6,4,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.modal{width:100%;max-width:430px;max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--caramel);box-shadow:5px 5px 0 var(--shadow);padding:15px;display:flex;flex-direction:column;gap:11px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
.modal h2{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.modal p{margin:0;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:10px 12px;text-align:left;font-size:14px;line-height:1.35;font-weight:500}
.opt:active{transform:translate(1px,1px)}
.opt[aria-pressed="true"]{border-color:var(--caramel);background:#3a2a1b}
.opt:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;padding:2px 7px;border:2px solid var(--line);background:var(--panel2)}
.chip.g{border-color:#5f8a4a}.chip.b{border-color:#9b3d33}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{white-space:normal;text-align:left;line-height:1.25}
.acts .btn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.start{display:flex;flex-direction:column;gap:13px;padding-block:6px}
.logo{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;color:var(--caramel);text-shadow:3px 3px 0 var(--shadow)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names .opt{padding:7px 10px;font-size:13px}
.field{background:var(--panel2);border:2px solid var(--line);padding:9px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.two .opt{display:flex;flex-direction:column;gap:3px}
.two .opt b{font-family:var(--disp);font-size:15px}
.two .opt span{font-size:12px;color:var(--muted)}
.fly{position:fixed;z-index:15;pointer-events:none;font-family:var(--disp);font-weight:800;font-size:14px;color:#ffd36b;text-shadow:0 2px 0 #3a2410,0 0 6px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-50%,-50%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel2);border:2px solid var(--caramel);box-shadow:3px 3px 0 var(--shadow);padding:7px 12px;font-size:13px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion: reduce){.money.pulse{animation:none}}
.mods{display:flex;flex-wrap:wrap;gap:5px}
.mods .chip{font-size:11px}
.row.wrap{flex-wrap:wrap}
.tag.g{border-color:#5f8a4a;color:var(--good)}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.tag.gold{border-color:#c9a24a;color:#e9c46a}
.pips i.wall{box-shadow:inset 0 -2px 0 rgba(224,87,74,.7)}
.cov{display:grid;grid-template-columns:auto repeat(7,1fr);gap:3px 4px;font-size:11px;align-items:center}
.cov b{font-weight:600;color:var(--muted);text-align:center}
.cov b.today{color:var(--caramel)}
.cov span{color:var(--muted);white-space:nowrap;padding-right:4px}
.cov i{font-style:normal;text-align:center;background:var(--panel);padding:2px 0;font-variant-numeric:tabular-nums}
.cov i.zero{background:rgba(224,87,74,.35);color:#fff}
.cov i.one{background:rgba(234,163,60,.18)}
.fin{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;font-size:12px}
.fin b{color:var(--muted);font-weight:600;text-align:right}
.fin i{font-style:normal;text-align:right}
.fin .tot{border-top:2px solid var(--line);padding-top:4px;font-weight:700}
.eq{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:12px}
.eq b{font-weight:600}
.subnav{display:flex;flex-wrap:wrap;gap:5px}
.chipbtn{background:var(--panel2);border:2px solid var(--line);padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chipbtn[aria-pressed="true"]{border-color:var(--caramel);color:var(--cream)}
.days{display:flex;gap:5px;flex-wrap:wrap}
.book .cell.r1{border-color:#4a6fb0}
.book .cell.r2{border-color:#c9a24a}
.ach{opacity:.6}
.ach.ok{opacity:1;border-color:#5f8a4a}
.ava-empty{width:40px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-weight:700}
select{background:var(--panel2);color:var(--cream);border:2px solid var(--line);padding:5px 8px;font:inherit}
label.d{display:flex;align-items:center;gap:6px}
.staff{grid-template-columns:44px 1fr}

.tabs{grid-template-columns:repeat(6,1fr)}
.tab{font-size:11px;padding:7px 1px}
.hud > div:first-child{min-width:0;overflow:hidden}
.meta{overflow:hidden;text-overflow:ellipsis}
.hudrow .inc{text-align:left}
/* v4: полноэкранная раскладка */
html,body{height:100%;overflow:hidden}
#app.game{max-width:560px;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;padding-top:calc(var(--safe-top,0px) + 6px);padding-bottom:calc(var(--safe-bottom,0px) + 6px)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.topL{min-width:0}
.topR{text-align:right}
.top .money{font-size:26px}
.top .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:30px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);padding:4px 10px;font-size:12px;font-weight:600;color:var(--cream);white-space:nowrap;max-width:85vw;overflow:hidden;text-overflow:ellipsis}
.pill.story{border-color:#b0413a;background:#3a1f1b}
.pill.story b{color:#ffb0a0;font-weight:700}
.pill.warn{border-color:#9b3d33;color:#ffc2b8}
.pill.good{border-color:#5f8a4a;color:#cfe8bf}
.pbar{width:34px;height:5px;background:var(--shadow);display:inline-block}
.pbar i{display:block;height:100%}
.scene{position:relative;min-height:0;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:#000;overflow:hidden}
.scene #cv{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.notifs{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:5px;max-width:64%;z-index:2}
.notif{display:flex;align-items:center;gap:7px;background:rgba(23,18,14,.92);border:2px solid var(--caramel);padding:5px 9px 5px 5px;font-size:12px;font-weight:600;text-align:left;box-shadow:2px 2px 0 var(--shadow);animation:pop .25s ease}
.notif b{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--caramel);color:#1b130c;font-weight:800}
.notif.story{border-color:#e0574a}.notif.story b{background:#e0574a;color:#fff}
.notif.absurd{border-color:var(--pathos)}.notif.absurd b{background:var(--pathos)}
.notif.inspect,.notif.money,.notif.break{border-color:#e0574a}
.notif span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif.more{padding:4px 9px;color:var(--muted)}
@keyframes pop{from{transform:translateX(-12px);opacity:0}}
.roomdots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;align-items:center;gap:7px;z-index:2;pointer-events:none}
.rdot{pointer-events:auto;width:10px;height:10px;border:2px solid var(--cream);background:transparent;padding:0}
.rdot.on{background:var(--caramel);border-color:var(--caramel)}
.rname{font-size:11px;font-weight:600;background:rgba(23,18,14,.8);padding:2px 7px;margin-left:4px}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dockb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;background:var(--panel);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);font-size:13px;font-weight:700;color:var(--cream)}
.dockb svg{width:26px;height:26px}
.dockb.on{border-color:var(--caramel);background:var(--panel2);color:var(--caramel)}
.dockb .badge{position:absolute;top:-7px;right:8px;font-style:normal}
.dockb .badge:empty{min-width:12px;height:12px;padding:0}
.sheetwrap{position:fixed;left:0;right:0;top:0;bottom:calc(var(--safe-bottom,0px) + 70px);z-index:12}
.sheetbg{position:absolute;inset:0;background:rgba(8,6,4,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:min(76vh,calc(100% - var(--safe-top,0px) - 50px));background:var(--panel);border-top:3px solid var(--caramel);box-shadow:0 -6px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.grab{display:flex;justify-content:center;padding:9px 0 5px;touch-action:none;cursor:grab}
.grab i{width:44px;height:5px;background:var(--line);display:block}
.sheethead{padding:0 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--line)}
.sheettitle{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--cream)}
.sheethead .subnav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sheethead .subnav::-webkit-scrollbar{display:none}
.sheethead .chipbtn{flex:none;font-size:13px;padding:7px 11px}
.sheetbody{flex:1;overflow-y:auto;padding:10px 14px 18px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.sheetbody .card .t{font-size:15px}
.sheetbody .card .d,.sheetbody .eff{font-size:13px}
.sheetbody .btn{min-height:40px;font-size:14px}
.up .col{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.t.big{font-family:var(--disp);font-size:18px}
.vol{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.vol input{width:100%;accent-color:var(--caramel)}
.shop{display:flex;flex-direction:column;gap:8px}
.shopitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.modal.paper{background:#efe6d2;color:#2a1f16;border-color:#2a1f16}
.modal.paper h2{font-family:'Golos Text',serif;font-weight:800;letter-spacing:-.5px;border-bottom:3px double #2a1f16;padding-bottom:6px;color:#2a1f16}
.modal.paper .eyebrow{color:#6a5a48}
.modal.paper .btn.ghost{color:#2a1f16;border-color:#6a5a48}
.newsitem b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8a2f1f}
.newsitem p{margin:2px 0 0;font-size:15px;line-height:1.45;color:#2a1f16}
/* ===== v5: кофейня изнутри — крафт, мел, чек, бейджи, стикеры ===== */
:root{
  --bg:#1d1410; --panel:#2a1d15; --panel2:#352519; --line:#4d3727; --cream:#f4ead8; --muted:#b9a38a;
  --caramel:#e8a548; --red:#c8322b; --kraft:#c9a477; --kraft2:#b8915f; --chalk:#ecebe4; --board:#26302a; --foam:#f6efe2; --ink:#2a1d15;
  --bad:#e0574a; --good:#86c46e;
  --chalkf:'Caveat','Golos Text',cursive; --mono:'PT Mono',ui-monospace,monospace;
}
body{background:var(--bg) radial-gradient(120% 60% at 50% 0%, #2c1e15 0%, #1d1410 60%)}
/* пиксельные кнопки: ступенчатые углы */
.btn,.opt,.chipbtn,.dockb,.pill,.bopt,.att{clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.btn{background:var(--caramel);color:#1d1410;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.25);border:none;letter-spacing:.2px}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.06);color:inherit;border:none;box-shadow:inset 0 0 0 2px currentColor;opacity:.92}
.btn.red{background:var(--red);color:#fff}
.btn.big{padding:14px;font-size:16px;font-family:var(--disp)}
.chalk{font-family:var(--chalkf)!important;font-weight:700;color:var(--chalk);letter-spacing:.3px}
.h.chalk{font-size:24px;line-height:1;margin-top:6px;text-shadow:0 0 1px rgba(255,255,255,.4)}
.h.chalk.big{font-size:34px}
.h .cd{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
/* шапка: касса */
.top .cafe{font-family:var(--chalkf);font-size:26px;line-height:1;color:var(--chalk);font-weight:700}
.top .cafe small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600;margin-left:4px;text-transform:uppercase;letter-spacing:1px}
.register{background:#1a1612;border:3px solid #0d0a08;box-shadow:inset 0 0 0 2px #3d2f22,3px 3px 0 var(--red);padding:4px 9px 3px}
.register .money{font-family:var(--mono);font-weight:700;font-size:24px;color:#ffcf6b;text-shadow:0 0 6px rgba(255,190,80,.45)}
.register .meta{font-family:var(--mono);font-size:11px;color:#c9b48a}
/* плашки как бумажные ярлыки */
.pill{background:var(--foam);color:var(--ink);border:none;font-weight:700}
.pill.task{background:var(--kraft)}
.pill.onb{background:var(--caramel);color:#1d1410}
.pill.story{background:var(--red);color:#fff}.pill.story b{color:#fff}
.pill.warn{background:#f2c9bd;color:#7a1d16}
.pill.good{background:#d5ebc6;color:#25451a}
.pill.hol{background:#2b1f3a;color:#ffd0ea}
.pbar{background:rgba(0,0,0,.2)}
/* сцена */
.scene{border:4px solid #120c09;box-shadow:0 0 0 2px #4d3727,4px 4px 0 #0a0705}
.notifs{left:auto;top:auto;right:8px;bottom:10px;align-items:flex-end;max-width:62%}
.roomdots{bottom:auto;top:8px}
@keyframes stick{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.notif{position:relative;background:#ffe27a;color:#2a1d15;border:none;padding:8px 10px 8px 8px;box-shadow:2px 3px 0 rgba(0,0,0,.4);animation:stick .25s ease;font-weight:700;clip-path:none}
.notif::before{content:'';position:absolute;top:-5px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.notif.s0{transform:rotate(-2deg)}.notif.s1{transform:rotate(1.5deg);background:#ffc4d6}.notif.s2{transform:rotate(-1deg);background:#bfe3ff}.notif.s3{transform:rotate(2deg);background:#c9f0b5}
.notif b{background:#2a1d15;color:#ffe27a}
.notif.story b,.notif.inspect b,.notif.money b,.notif.break b{background:var(--red);color:#fff}
.notif.more{background:var(--foam);color:var(--ink)}
/* док */
.dock{gap:8px}
.dockb{background:var(--kraft);color:var(--ink);border:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),inset 3px 3px 0 rgba(255,255,255,.25)}
.dockb svg{width:28px;height:28px}
.dockb.on{background:var(--foam);color:var(--red)}
.dockb .badge{background:var(--red);clip-path:none;border:2px solid var(--bg)}
/* шторка: меловая доска в деревянной раме */
.sheet{background:var(--board);background-image:radial-gradient(60% 40% at 30% 20%,rgba(255,255,255,.05),transparent 70%),radial-gradient(50% 30% at 80% 70%,rgba(255,255,255,.04),transparent 70%);border-top:8px solid #6b4528;box-shadow:0 -3px 0 #3d2716,0 -8px 24px rgba(0,0,0,.55)}
.sheettitle.chalk{font-size:28px;line-height:1}
.grab i{background:#8a6a4a}
.sheethead{border-bottom:2px dashed rgba(236,235,228,.25)}
.sheethead .chipbtn{background:transparent;color:rgba(236,235,228,.7);border:none;box-shadow:inset 0 0 0 2px rgba(236,235,228,.25);font-weight:700;position:relative}
.sheethead .chipbtn[aria-pressed="true"]{background:var(--chalk);color:var(--board)}
.chipbtn .tb{display:none}
.chipbtn .tb.n,.chipbtn .tb.u{display:inline-block;margin-left:5px;min-width:8px;height:8px;background:var(--caramel);vertical-align:middle;font-style:normal}
.chipbtn .tb.u{min-width:16px;height:16px;line-height:16px;font-size:11px;background:var(--red);color:#fff;padding:0 3px;text-align:center}
.attn{display:flex;flex-direction:column;gap:4px}
.attn:empty{display:none}
.att{display:flex;gap:8px;align-items:center;text-align:left;background:rgba(236,235,228,.08);border:none;padding:6px 8px;font-size:12px;color:var(--chalk)}
.att b{flex:none;background:var(--chalk);color:var(--board);padding:1px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.att.u b{background:var(--red);color:#fff}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* карточки внутри шторки — бумага */
.sheet .card{--cream:#2a1d15;--muted:#6d5a46;--line:#cdb894;--panel:#e9dcc3;--panel2:#f6efe2;--shadow:rgba(0,0,0,.25);background:var(--foam);color:var(--cream);border:none;box-shadow:2px 3px 0 rgba(0,0,0,.35);position:relative}
.sheet .card .tag{border-color:#bda783;color:#5a4836}
.sheet .card .tag.warn{border-color:var(--red);color:var(--red)}
.sheet .card .tag.g{border-color:#4a7a35;color:#3a6a25}
.sheet .empty{color:rgba(236,235,228,.7)}
.sheet .h{color:var(--chalk)}
.sheet .card .btn.ghost{color:#2a1d15}
.sheet .card .bar,.sheet .pips i{background:rgba(0,0,0,.12)}
.sheet .card.chalkboard{background:#1f2823;color:var(--chalk);box-shadow:inset 0 0 0 3px #3a4a40;--muted:rgba(236,235,228,.7)}
.sheet .card.chalkboard .t.chalk{font-size:24px}
.deadline{color:#ffb0a0!important;font-weight:700}
.note.kraft,.sheet .card.kraft{background:var(--kraft);color:var(--ink);--muted:#4d3a28}
.note.kraft::after,.sheet .card.kraft::after{content:'';position:absolute;top:-8px;left:40%;width:70px;height:18px;background:rgba(246,239,226,.6);transform:rotate(-3deg)}
/* бейджи сотрудников на шнурке */
.badge-card{padding-top:14px!important;border-top:10px solid var(--red)!important}
.badge-card .lanyard{position:absolute;top:-10px;left:50%;width:26px;height:6px;margin-left:-13px;background:var(--bg);border-radius:3px;margin-top:2px}
.badge-card.cand{border-top-color:#4a6fb0!important}
.badge-card.you{border-top-color:var(--caramel)!important}
.badge-card .spr{background-color:#e3d6bd;outline:2px solid #cdb894;outline-offset:0}
/* штампы */
.stamp{display:inline-block;font-family:var(--disp);font-weight:800;font-size:10px;letter-spacing:1px;padding:2px 6px;border:2px solid currentColor;transform:rotate(-6deg);color:var(--red);opacity:.9;white-space:nowrap}
.stamp.green{color:#3a7a25}.stamp.gold{color:#a8781a}
.card > .stamp{position:absolute;right:8px;top:6px;z-index:1}
/* отношения: ровная шкала с меткой */
.mood{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bar{display:block;flex:1;min-width:30px;height:6px}
.rel{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.relbar{position:relative;height:8px;background:linear-gradient(90deg,#e7a59b,#e9dcc3 50%,#b8ddab)}
.relbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:rgba(0,0,0,.3)}
.relbar b{position:absolute;top:-4px;width:8px;height:16px;margin-left:-4px;box-shadow:0 0 0 2px #2a1d15}
/* характер */
.charbar{display:flex;height:12px;box-shadow:0 0 0 2px #2a1d15}
.charbar i,.charleg i{display:block}
.charbar .soul,.charleg .soul{background:#6aa84f}.charbar .pathos,.charleg .pathos{background:#5a7fd6}.charbar .chaos,.charleg .chaos{background:#d0543a}
.charleg{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.charleg span{display:flex;align-items:center;gap:4px}.charleg i{width:9px;height:9px}
/* чек */
.receipt-card{background:#fbf8f1!important;font-family:var(--mono);padding-bottom:18px!important;-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x}
.rhead{text-align:center;font-weight:700;font-size:12px;letter-spacing:1px;border-bottom:2px dashed #2a1d15;padding-bottom:6px}
.receipt-card .fin{font-family:var(--mono);font-size:12px}
.receipt-card .fin .tot{border-top:2px dashed #2a1d15}
.receipt-card .d{font-family:var(--body)}
/* меню мелом */
.menu-item .dots{flex:1;border-bottom:2px dotted #bda783;margin:0 6px;align-self:flex-end;margin-bottom:5px}
.menu-item .price{font-family:var(--mono);font-weight:700}
.menu-item.day{box-shadow:0 0 0 3px var(--red),2px 3px 0 rgba(0,0,0,.35)!important}
.task-card.done{opacity:.85}
.hint{font-size:12px;color:#5a4836;background:rgba(232,165,72,.18);padding:5px 7px;border-left:3px solid var(--caramel)}
.steps{display:flex;flex-direction:column;gap:4px;font-size:13px}
.steps div{display:flex;align-items:center;gap:8px}
.steps i{width:12px;height:12px;box-shadow:inset 0 0 0 2px #2a1d15;flex:none}
.steps .ok{text-decoration:line-through;opacity:.6}.steps .ok i{background:#3a7a25}
.steps .cur{font-weight:700}.steps .cur i{background:var(--caramel)}
/* стикеры событий в списке */
.sheet .card.sticker{background:#ffe27a;transform:rotate(-.6deg)}
.sheet .card.sticker.s1{background:#ffc4d6;transform:rotate(.5deg)}.sheet .card.sticker.s2{background:#bfe3ff}.sheet .card.sticker.s3{background:#c9f0b5;transform:rotate(.4deg)}
.sheet .card.sticker.hot{box-shadow:0 0 0 3px var(--red),2px 3px 0 rgba(0,0,0,.35)}
.friends{display:flex;flex-direction:column;gap:5px}
.friend{display:flex;flex-direction:column;background:rgba(255,255,255,.35);padding:5px 8px}
.friend span{font-size:12px;color:#4d3a28}
/* старт и стройка */
#app.startapp{overflow-y:auto;height:100%;padding-top:calc(var(--safe-top,0px) + 12px);padding-bottom:calc(var(--safe-bottom,0px) + 16px)}
.start .logo{font-size:44px;color:var(--caramel);text-shadow:4px 4px 0 var(--red)}
.note{position:relative;padding:14px;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
.note p{margin:0;font-size:15px;line-height:1.5}
.note .gift{margin-top:8px;font-weight:700;color:var(--red)}
.start .opt{background:var(--panel2);border:none;box-shadow:inset 0 0 0 2px var(--line)}
.start .opt[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--caramel);background:#45301f}
.receipt{background:#fbf8f1;color:#2a1d15;font-family:var(--mono);font-size:13px;padding:10px 12px 16px;position:sticky;top:0;z-index:3;box-shadow:0 4px 10px rgba(0,0,0,.4);-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.rrow.tot{border-top:2px dashed #2a1d15;margin-top:4px;padding-top:5px;font-weight:700}
.rrow b.neg{color:var(--red)}
.rnote{font-family:var(--body);font-size:12px;color:var(--red);margin-top:4px}
.buildrow{display:flex;flex-direction:column;gap:6px}
.buildrow .bt{font-family:var(--chalkf);font-size:24px;font-weight:700;color:var(--chalk)}
.bopts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bopt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--foam);color:var(--ink);border:none;padding:8px 7px;min-width:0}
.bopt .tier{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8a6a4a;font-weight:700}
.bopt b{font-size:12px;line-height:1.2}
.bopt i{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--red)}
.bopt small{font-size:11px;line-height:1.25;color:#6d5a46}
.bopt[aria-pressed="true"]{background:var(--caramel);box-shadow:inset 0 0 0 3px #2a1d15}
.bopt:disabled{opacity:.4}
/* модалки */
.modal{background:var(--foam);color:var(--ink);border:none;box-shadow:0 0 0 4px #2a1d15,6px 6px 0 4px rgba(0,0,0,.5);--cream:#2a1d15;--muted:#6d5a46;--line:#cdb894;--panel2:#efe3cc;--panel:#e9dcc3}
.modal .opt{background:#fff;color:var(--ink);border:none;box-shadow:inset 0 0 0 2px #cdb894}
.modal .opt:hover{box-shadow:inset 0 0 0 2px var(--caramel)}
.modal .btn.ghost{color:var(--ink)}
.modal .chip{background:#fff;border-color:#cdb894}
.modal.kraftbox{background:var(--kraft)}
.introl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}
.toast{background:var(--foam);color:var(--ink);border:none;box-shadow:0 0 0 3px #2a1d15,3px 3px 0 3px rgba(0,0,0,.4);font-weight:600}
.fly{color:#ffcf6b;font-family:var(--mono)}
.vol{color:var(--muted)}
.shopitem{border-top:1px dashed #cdb894}
.bopt b{overflow-wrap:anywhere;hyphens:auto}
/* v6 */
.pill.load{background:#d5ebc6;color:#25451a}
.pill.load.warm{background:#ffe27a;color:#4a3a00}
.pill.load.hot{background:#f2c9bd;color:#7a1d16}
.pill.rush{background:var(--red);color:#fff;animation:rushp 1s steps(2) infinite}
@keyframes rushp{50%{background:#e8a548;color:#1d1410}}
@media (prefers-reduced-motion: reduce){.pill.rush{animation:none}}
.metric{font-size:13px;color:var(--muted);margin:2px 0}
.metric b{color:var(--cream);font-family:var(--mono)}
.metric b.g{color:#3a7a25}
.review .stars{font-size:14px;color:#c8322b;letter-spacing:1px;white-space:nowrap}
.review .stars i{font-style:normal;color:#cdb894}
.review .small{font-size:11px;opacity:.8}
.review .reply{font-size:12px;background:rgba(0,0,0,.06);padding:5px 8px;border-left:3px solid #6d5a46}
.review .row.wrap .btn{font-size:12px;min-height:34px;padding:5px 9px}
.tour{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:12px}
.trow{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(236,235,228,.25)}
.trow.me{color:#ffe27a}
.trow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--body)}
.kitchen-card{border-top:6px solid #8a8a8a!important}
/* v7 */
.angry{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 42%,rgba(200,50,43,.55),rgba(60,10,8,.82) 70%);animation:angin .28s cubic-bezier(.2,1.6,.4,1)}
.angry.out{animation:angout .5s ease forwards}
@keyframes angin{from{opacity:0;transform:scale(.3)}}
@keyframes angout{to{opacity:0;transform:scale(.6) translate(40vw,40vh)}}
.aface{width:min(70vw,320px);aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;animation:jitter .09s steps(2) infinite;filter:drop-shadow(0 0 0 #000) saturate(1.3)}
.aface .aimg{width:100%;height:auto;image-rendering:pixelated;filter:sepia(.4) saturate(2.2) hue-rotate(-25deg) brightness(.95)}
@keyframes jitter{50%{transform:translate(3px,-2px) rotate(1deg)}}
.steam{position:fixed;top:24%;width:26px;height:26px;background:rgba(255,255,255,.75);border-radius:50%;animation:steam .5s ease-out infinite}
.steam.l{left:22%}.steam.r{right:22%;animation-delay:.25s}
@keyframes steam{from{transform:translateY(10px) scale(.5);opacity:.9}to{transform:translateY(-40px) scale(1.4);opacity:0}}
.arev{width:min(86vw,360px);background:#fbf8f1;color:#2a1d15;padding:10px 12px;box-shadow:0 0 0 3px #2a1d15,4px 4px 0 3px rgba(0,0,0,.5);transform:rotate(-2deg)}
.astars{color:#c8322b;font-size:18px;letter-spacing:2px}.astars i{font-style:normal;color:#cdb894}
.atxt{font-size:15px;font-weight:700;line-height:1.35;margin:4px 0}
.aauth{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6d5a46}
@media (prefers-reduced-motion: reduce){.angry,.angry.out,.aface,.steam{animation:none}}
.scene.shake{animation:shake .35s steps(3)}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.qa{display:flex;flex-direction:column;gap:6px;min-height:120px}
.qa .q{font-weight:700;font-size:14px}
.qa .a{font-size:14px;background:#fff;padding:6px 9px;box-shadow:inset 0 0 0 2px #cdb894;animation:pop .2s ease}
.verdict{background:var(--kraft);padding:8px 10px;font-size:14px;line-height:1.4;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.modal.receiptbox{background:#fbf8f1;font-family:var(--mono)}
.modal.receiptbox .rhead{font-size:13px}
.modal .rlines{font-family:var(--mono);font-size:13px;display:flex;flex-direction:column}
.rnote2{font-size:12px;line-height:1.5;border-top:2px dashed #2a1d15;padding-top:6px}
.lvlrow{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:13px;padding:3px 0;border-top:1px dashed rgba(236,235,228,.25)}
.lvlrow b{font-family:var(--mono);color:#ffe27a}
.mood .st{font-size:12px;font-weight:700;white-space:nowrap;color:#3a7a25}
.mood .st.bad{color:var(--red)}
.friend{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.friend b{grid-column:1}.friend span{grid-column:1}.friend .btn{grid-column:2;grid-row:1/3;font-size:12px;min-height:34px;padding:4px 8px}
.opts.sup .opt{font-size:13px}
.opts.sup .opt .d{font-size:12px;color:#6d5a46}
.sheet .card .opt{background:#fff;color:#2a1d15;border:none;box-shadow:inset 0 0 0 2px #cdb894}
.sheet .card .opt[aria-pressed="true"]{background:#e8a548;box-shadow:inset 0 0 0 3px #2a1d15}
.sheet .card .opt:disabled{opacity:.45}
.steam{width:14px;height:14px;background:rgba(255,255,255,.5);top:30%}
/* v8 */
.top{grid-template-columns:minmax(0,1fr) auto;align-items:start}
.top .cafe{white-space:normal;overflow:visible;text-overflow:clip;font-size:22px;line-height:1.05;word-break:break-word}
.top .cafe small{display:block;margin:2px 0 0}
.top .meta{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
.namegen{display:flex;gap:8px;align-items:center}
.bigname{flex:1;font-family:var(--chalkf);font-size:30px;font-weight:700;color:var(--chalk);line-height:1.05}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.shelf{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:#e9dcc3;border:none;padding:7px 8px;box-shadow:inset 0 -6px 0 #b8915f;color:#2a1d15;min-height:74px}
.shelf b{font-size:12px}.shelf span{font-size:11px;color:#6d5a46}
.shelf i{font-style:normal;font-family:var(--mono);font-size:15px;font-weight:700}
.shelf.ok i{color:#3a7a25}.shelf.bad i{color:var(--red)}
.shelf em{font-style:normal;font-size:11px;font-weight:700;color:var(--red)}
.wish{display:flex;flex-direction:column;gap:4px;background:#ffe27a;padding:8px 10px;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.wish span{font-size:13px}
.wishline{font-size:12px;font-weight:700;color:#8a5a00;background:#ffe27a;padding:2px 6px;align-self:flex-start}
.pathfx{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
.pathfx b{color:var(--cream);font-family:var(--mono)}
.pill.corp{background:#bfe3ff;color:#123a5a}
.pill.corp.hot{background:#f2c9bd;color:#7a1d16}
.opts.focus .opt{font-size:13px}
.sheet .card.chalkboard .opt{background:rgba(255,255,255,.1);color:var(--chalk);box-shadow:inset 0 0 0 2px rgba(236,235,228,.35)}
.sheet .card.chalkboard .opt[aria-pressed="true"]{background:var(--chalk);color:var(--board)}
.sheet .card.chalkboard .opt .d{color:inherit;opacity:.8}
.top .cafe{font-size:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top .cafe small{font-size:10px}
.top .meta{font-size:11px}
/* v9 */
.modal.rzbox{box-shadow:0 0 0 4px #c8322b,6px 6px 0 4px rgba(0,0,0,.5);animation:rzshake .4s steps(3)}
@keyframes rzshake{33%{transform:translate(-3px,1px)}66%{transform:translate(3px,-1px)}}
.rztimer{height:8px;background:rgba(0,0,0,.12)}
.rztimer i{display:block;height:100%;width:100%;background:#c8322b}
.svc{display:flex;flex-direction:column;gap:6px}
.svc .opt{font-size:13px}
@media (prefers-reduced-motion: reduce){.modal.rzbox{animation:none}}
.card.staff.legend{background:linear-gradient(160deg,#fff6dc 0%,#f6e3b0 55%,#efd391 100%);box-shadow:0 0 0 2px #d9a93e inset,0 6px 18px rgba(201,150,40,.25)}
.card.staff.legend .lanyard{background:#c9962c}
.card.staff.legend .spr{filter:drop-shadow(0 0 6px rgba(240,190,80,.7))}

.scene{position:relative}

function modMul(k){ const now = absNow(); return S.mods.reduce((a,m)=>m.k===k && m.until>now ? a*m.mul : a, 1); }

let SPEND_WHY = null;
function spend(v, cat, why){ cat = cat||'other'; S.money -= v; const f = S.fin.today; f[cat] = (f[cat]||0) + v;
  if(cat!=='wages' && v){ const w = why || SPEND_WHY || 'Разное'; f.why = f.why || {}; const key = cat+'|'+w; f.why[key] = (f.why[key]||0) + v; f.last = f.last || []; f.last.unshift({c:cat, v:Math.round(v), w, gm:S.gm}); if(f.last.length > 30) f.last.length = 30; } }
function income(v){ S.money += v; }
function canSpend(v){ return S.money >= v; }
function addXp(n){
  S.xp += n; let need = xpNeed();
  while(S.xp >= need){ S.xp -= need; S.level++; need = xpNeed(); HOOK.sfx('level'); onLevel(S.level);
    if(S.level===LOCK_LEVEL && !S.path){ S.path = leader(); HOOK.modal({kind:'path'}); } }
}
function xpNeed(){ return Math.round(130 * Math.pow(1.42, S.level-1)); }
function leader(){ const m = S.meters; return Object.keys(m).reduce((a,b)=>m[b]>m[a]?b:a); }
function meter(k, v){ if(!v) return; const f = S.path && S.path!==k && v>0 ? 0.5 : 1; S.meters[k] = clamp(S.meters[k]+v*f, 0, 100); }
function repAdd(v){ S.rep = clamp(S.rep + v, 1, 5); }

/* ---------- склад ---------- */
function stockQty(k){ if(S.stock[k]===undefined && STOCK[k] && STOCK[k].perish) S.stock[k] = []; const v = S.stock[k]; return Array.isArray(v) ? v.reduce((a,b)=>a+b.q,0) : (v||0); }
function stockCap(k){ return STOCK[k].cap * (1 + 0.25*maxUpg('storage')) * (S.level>=14 ? 1.25 : 1); }
function hasStock(need){ for(const k in need) if(stockQty(k) < need[k]) return false; return true; }
function takeStock(need){
  for(const k in need){ let left = need[k]; const v = S.stock[k];
    if(Array.isArray(v)){ v.sort((a,b)=>a.exp-b.exp); for(const b of v){ const t = Math.min(b.q, left); b.q -= t; left -= t; if(left<=0) break; } S.stock[k] = v.filter(b=>b.q>0.001); }
    else S.stock[k] = Math.max(0, v - left);
  }
}
function unitCost(k){ return STOCK[k].price / STOCK[k].pack * supplyMul(); }
function supplyMul(){ return modMul('supply') * (1 - 0.03*perk('supplier')) * supplier().mul * (S.level>=18 ? 0.95 : 1); }
function needCost(need){ let c = 0; for(const k in need) c += need[k]*unitCost(k); return c; }
function stockFree(k){ const pend = S.orders.filter(o=>o.k===k).reduce((a,o)=>a+o.q,0); return Math.max(0, stockCap(k) - stockQty(k) - pend); }
const SHOP_SHARE = 0.25;
function orderStock(k, packs, mode){
  if(mode===true) mode = 'express';
  mode = mode || 'normal';
  const st = STOCK[k];
  const free = mode==='shop' ? Math.min(stockCap(k) - stockQty(k), stockCap(k)*SHOP_SHARE) : stockFree(k);
  packs = Math.min(packs, Math.floor(free / st.pack));
  if(packs < 1) return mode==='shop' ? 'В руках столько не унести или на складе нет места' : 'На складе нет места: всё, что влезет, уже едет';
  const mul = mode==='shop' ? 2 : mode==='express' ? 1.35 : (packs>=5 ? 0.92 : 1);
  const price = Math.round(st.price * packs * supplyMul() * mul);
  const limit = S.debt.stage>=1 || mode==='shop' ? 0 : 50000;
  if(S.money - price < -limit) return S.debt.stage>=1 ? 'Поставщики работают только по предоплате, а денег не хватает' : 'Не хватает денег';
  spend(price, 'supply');
  if(mode==='shop'){ const q = st.pack*packs; if(st.perish) S.stock[k].push({q, exp:S.day+st.perish}); else S.stock[k] = (S.stock[k]||0) + q; S.youAwayUntil = Date.now() + 45000; HOOK.struct(); return null; }
  const eta = mode==='express' ? absNow()+5 : absNow()+60;
  S.orders.push({k, q:st.pack*packs, eta, price});
  return null;
}
function packsToFull(k){ return Math.floor(stockFree(k) / STOCK[k].pack); }
function nextOpenAbs(){ const o = S.hours.open*60; return S.gm < o ? S.day*DAY_MIN + o : (S.day+1)*DAY_MIN + o; }
function deliver(){
  const now = absNow(); const arrived = S.orders.filter(o=>o.eta<=now);
  if(!arrived.length) return;
  for(const o of arrived){
    if(chance(supplier().wrong) && !S.flags.noSupplierEv){ const ids = ['supplier_sour','courier','e_kefir','e_beans_mold'].filter(x=>EV[x]); HOOK.event(pick(ids), {k:o.k}); }
    const st = STOCK[o.k];
    if(st.perish && !S.stock[o.k]) S.stock[o.k] = [];
    if(st.perish){ const life = st.perish + (o.k==='milk' ? Math.floor(maxUpg('storage')/5) : 0); S.stock[o.k].push({q:o.q, exp:S.day+life}); }
    else S.stock[o.k] = (S.stock[o.k]||0) + o.q;
    const cap = stockCap(o.k); const q = stockQty(o.k);
    if(q > cap){ const over = q-cap; takeStock({[o.k]:over}); const back = Math.round(over*unitCost(o.k)); income(back); S.fin.today.supply -= back; HOOK.toast(st.n+': не влезло на склад, поставщик забрал лишнее и вернул '+fmtR(back)); }
  }
  S.orders = S.orders.filter(o=>o.eta>now);
  HOOK.toast('Приехала поставка'); HOOK.struct();
}
function spoilCheck(){
  for(const k of ['milk','desserts','food']){
    const arr = S.stock[k]; let lost = 0;
    const fridgeBad = S.rooms.some(r=>r.broken.fridge);
    for(const b of arr){ if(b.exp <= S.day || (fridgeBad && k!=='food' && chance(0.5))){ lost += b.q; b.q = 0; } }
    S.stock[k] = arr.filter(b=>b.q>0);
    if(lost>0){ const v = lost*unitCost(k); S.fin.today.spoil += v; S.flags.expired = (S.flags.expired||0)+1; HOOK.toast(STOCK[k].n+': просрочка списана на '+fmtR(v)); }
  }
}
function autoOrder(){
  const mgr = S.staff.some(s=>s.rank===3);
  if(S.restock === false && !S.autoOrder && !mgr) return;
  const th = S.restockAt || 0.35;
  for(const k in STOCK){
    if(k==='matcha' && !isUnlocked('matcha')) continue;
    if(k==='food' && !MENU.some(m=>m.food && isUnlocked(m.id))) continue;
    if(k==='desserts' && !isUnlocked('dessert')) continue;
    if(k==='sandwiches' && !isUnlocked('sandwich')) continue;
    if(k==='pastry' && !isUnlocked('croissant')) continue;
    if(k==='hoz' && !S.hozAuto) continue;
    if(S.orders.some(o=>o.k===k)) continue;
    const cap = stockCap(k);
    if(bookQty(k) < cap*th){ const packs = Math.floor((cap*0.9 - bookQty(k)) / STOCK[k].pack); if(packs>0) orderStock(k, packs, 'normal'); }
  }
}

function isUnlocked(id){ const m = MENU.find(x=>x.id===id); if(!m) return false; if(m.kitchen) return !!(S.kitchen && S.kitchen.tier >= m.kitchen); if(m.season){ const h = holiday(); return !!h && m.season===h.id; } if(!m.unlock) return true; if(S.flags['un_'+id]) return true; if(m.unlock.f(S)){ S.flags['un_'+id] = true; HOOK.toast('В меню появилось: '+m.n); HOOK.struct(); return true; } return false; }
function promoW(m){ const p = S.promo || {}; return m.w * (p.day===m.id ? 3 : 1) * ((p.rec||[]).includes(m.id) ? 1.6 : 1); }
function itemPrice(m, roomId){
  const rm = room(roomId);
  let p = m.price * (1+0.04*rm.upg.menu) * city().check * roomMult(roomId) * modMul('check');
  if(S.path==='pathos') p *= 1.2;
  p *= pathCheck() * focusMul('check') * interiorMul(roomId, 'check');
  if(S.promo && S.promo.day===m.id) p *= 0.85;
  if(m.id==='dessert' || m.id==='breakfast'){ const leg = S.staff.find(s=>s.room===roomId && s.legendId===2 && s.today==='work'); if(leg) p *= 2; }
  return Math.round(p/10)*10;
}
function available(roomId){
  const rm = room(roomId); const list = [];
  const working = workingStaff(roomId);
  const hasCook = working.some(s=>s.role==='Повар');
  const h = S.gm/60;
  for(const m of MENU){
    if(m.side || !isUnlocked(m.id)) continue;
    if(m.coffee && rm.broken.machine) continue;
    if(m.food && !hasCook) continue;
    if(m.hours && (h<m.hours[0] || h>=m.hours[1])) continue;
    if(!hasStock(m.need)) continue;
    list.push(m);
  }

}
function sellOne(roomId, opt){
  opt = opt || {};
  const rm = room(roomId);
  const av = available(roomId);
  if(!av.length) return {fail:'empty'};
  // терминал сломан — платят только наличными
  if(rm.broken.terminal && !opt.delivery && chance(0.55)) return {fail:'card'};
  const tw = av.reduce((a,m)=>a+promoW(m),0); let r = Math.random()*tw, item = av[0];
  for(const m of av){ r -= promoW(m); if(r<=0){ item = m; break; } }
  let amount = itemPrice(item, roomId); takeStock(item.need); let cogs = needCost(item.need);
  const tired = workingStaff(roomId).find(s=>s.role==='Бариста' && !s.isYou && staffState(s) < 40);
  if(tired && chance(0.04)){ const f0 = S.fin.today; f0.cogs += cogs; S.c.mistakes = (S.c.mistakes||0)+1; HOOK.toast(tired.name+' перепутал заказ. Гость ушёл без кофе'); addFault(tired, 'mistake'); return {fail:'mistake'}; }
  let dessert = false;
  const dm = MENU.find(x=>x.id==='dessert');
  if(isUnlocked('dessert') && chance(dessertP(rm.upg.showcase)) && hasStock(dm.need)){ amount += itemPrice(dm, roomId); takeStock(dm.need); cogs += needCost(dm.need); dessert = true; S.c.byItem.dessert = (S.c.byItem.dessert||0)+1; }
  const waiters = workingStaff(roomId).filter(s=>s.role==='Официант').length;
  amount = Math.round(amount * (1 + 0.05*waiters));
  if(S.loyalty && item.coffee && chance(0.4/6)) amount = Math.max(0, amount - itemPrice(item, roomId));
  if(opt.delivery){ cogs += 15; }
  const card = opt.delivery || (!rm.broken.terminal && chance(0.8));
  const fee = opt.delivery ? 0 : card ? amount*0.02 : 0;
  const comm = opt.delivery ? Math.round(amount*0.3) : 0;
  income(amount - fee - comm - (opt.delivery?15:0));
  const f = S.fin.today; f.rev += amount; f.cogs += cogs; f.acq += fee; f.comm = (f.comm||0) + comm; f.supply += opt.delivery?15:0; f.guests++; if(card) f.card += amount;
  if(opt.delivery && S.delivery){ S.delivery.orders++; f.del = (f.del||0)+1; }
  f.items = f.items || {}; f.items[item.id] = (f.items[item.id]||0) + 1;
  S.fin.taxAcc += amount*0.05;
  if(rm.broken.kkt && !rm.noCheck) {} // продажа без чека
  if(rm.broken.kkt) S.fin.noCheck += amount;
  S.c.earnedRun = (S.c.earnedRun||0) + amount;
  taskProg('sell', 1, item.id);
  S.c.sold++; S.c.byItem[item.id] = (S.c.byItem[item.id]||0)+1; S.c.guests++;
  // износ
  const q = S.q || {wear:1, term:1, fridge:1};
  const wear = (1 - 0.03*rm.upg.machine) * (S.serviceContract?0.5:1) * modMul('wear') * (roomId==='main' ? q.wear : 1);
  if(item.coffee) rm.eq.machine = Math.max(0, rm.eq.machine - 0.018*wear);
  if(card) rm.eq.terminal = Math.max(0, rm.eq.terminal - 0.007*wear*(roomId==='main' ? q.term/q.wear : 1));
  rm.eq.kkt = Math.max(0, rm.eq.kkt - 0.005*wear);
  addXp(1); taskProg('serve', 1); taskProg('earn', amount);
  if(opt.delivery) taskProg('delivery', 1);
  if(item.kitchen) taskProg('kitchen', 1);
  if(!opt.delivery) tipDrop(amount);
  return {amount, item, dessert};
}

/* ---------- поток гостей и пропускная способность ---------- */
function hourCurve(h){ if(h<6) return 0.12; if(h<7) return 0.5; if(h<8) return 1.6; if(h<10) return 2.6; if(h<12) return 1.1; if(h<13) return 1.6; if(h<14) return 2.2; if(h<17) return 0.9; if(h<18) return 1.4; if(h<19) return 2.0; if(h<21) return 0.9; return 0.4; }
function youNeeded(roomId){ if(roomId!=='main') return false; const now = Date.now(), a = absNow(); const w = S.staff.filter(s=>!s.isYou && s.room===roomId && (s.today==='work'||s.today==='sub') && !s.away && !(s.breakUntil && s.breakUntil > now) && !(s.lateUntil && s.lateUntil > a) && !(s.distract && s.distract.kind==='smoke')); return !w.some(s=>s.role==='Бариста') || !w.some(s=>s.role==='Кассир'); }
function workingStaff(roomId){ return S.staff.filter(s=>s.room===roomId && (s.isYou ? youNeeded(roomId) && !(S.youAwayUntil > Date.now()) : true) && (s.today==='work' || s.today==='sub') && !s.away && !(s.lateUntil && s.lateUntil > absNow()) && !(s.breakUntil && s.breakUntil > Date.now())); }
function staffSpeed(s){
  let f = (1 + 0.06*(s.lvl-1)) * (0.6 + s.mood*0.005) * (1 + 0.1*s.rank) * (1 - Math.max(0, s.fatigue-50)*0.006);
  if(s.isYou) f *= 0.55;
  if(s.quirk==='genius') f *= 1.25;
  if(s.quirk==='workaholic') f *= 1.1;
  if(s.legendId===3) f *= 1.3; if(s.legendId===5) f *= 1.6;
  if(s.boostUntil && s.boostUntil > Date.now()) f *= s.boostMul;
  if(s.restDay === S.day) f *= 1.1;
  if(typeof dishSlow === 'function' && s.role==='Бариста') f *= dishSlow(s.room);
  f *= focusMul('speed');
  return f;
}
function stats(roomId){
  const rm = room(roomId), u = rm.upg, def = roomDef(roomId);
  const w = WEATHER[S.weather];
  const wf = def.outdoor ? w.out : w.f;
  const h = S.gm/60;
  let lambda = (1/95) * (1+0.07*u.sign) * (1+0.04*u.decor) * (1+0.02*u.pets) * (1+0.015*tableCount(u.tables)) * (0.4+0.2*S.rep) * wf * hourCurve(h) * city().traffic * modMul('traffic') * (1+0.03*perk('word'));
  if(S.path==='chaos') lambda *= 1.2;
  lambda *= 1 + 0.18*(S.level-1);
  lambda *= pathTraffic();
  if(S.loyalty) lambda *= 1.1;
  lambda *= interiorMul(roomId, 'traffic');
  if(S.kitchen && S.kitchen.tier>=3 && h>=12 && h<14) lambda *= 1.4;
  const hol = holiday(); if(hol && hol.id!=='summer') lambda *= 1.15; if(hol && hol.id==='summer' && def.outdoor) lambda *= 1.4;
  const rivalDrag = S.rivals.filter(r=>r.status==='open').reduce((a,r)=>a + r.power*0.0018, 0);
  lambda *= Math.max(0.6, 1 - rivalDrag);
  if(!S.isOpen || S.closedUntil > absNow()) lambda = 0;
  const lambdaD = deliveryLambda(roomId, lambda);
  lambda *= rushMul();
  const ws = workingStaff(roomId);
  let cashiers = ws.filter(s=>s.role==='Кассир' && !s.distract && !s.isYou), baristas = ws.filter(s=>s.role==='Бариста' && !s.distract && !s.isYou);
  const you = ws.find(s=>s.isYou); if(you){ if(!cashiers.length) cashiers = [you]; if(!baristas.length) baristas = [you]; }
  const orderSpeed = cashiers.length ? cashiers.reduce((a,s)=>a+staffSpeed(s),0) : (baristas.length ? 0.5 : 0);
  const orderT = orderSpeed ? 7 * 1.23 * (roomId==='main' && S.q ? Math.sqrt(S.q.term) : 1) / (1+0.15*u.register) / orderSpeed : Infinity;
  const prepSpeed = baristas.length ? baristas.reduce((a,s)=>a+staffSpeed(s),0) : 0;
  const prepT = 12 / (1+0.15*u.machine);
  const alone = you && cashiers[0]===you && baristas[0]===you;
  const orderCap = orderT===Infinity ? 0 : 1/orderT, prepCap = prepSpeed/prepT;
  const through = alone ? 1/(orderT + prepT/prepSpeed) : Math.min(orderCap + 0, prepCap);
  return {lambda, lambdaD, orderT, prepT, prepSpeed, through, orderCap, prepCap, staff:ws, load:(lambda+lambdaD)/Math.max(0.0001, through)};
}
function estCheck(roomId){
  const av = available(roomId); if(!av.length) return 0;
  const tw = av.reduce((a,m)=>a+promoW(m),0); let c = av.reduce((a,m)=>a+itemPrice(m,roomId)*promoW(m),0)/tw;
  if(isUnlocked('dessert')) c += dessertP(room(roomId).upg.showcase) * itemPrice(MENU.find(x=>x.id==='dessert'), roomId);
  return c;
}
function incomePerMin(roomId){ const st = stats(roomId); return Math.min(st.lambda + st.lambdaD*0.7, st.through) * estCheck(roomId) * 60; }

function pickOffDays(role, roomId){

      s.fatigue = clamp(s.fatigue + (s.consec>5 ? 16 : 8) * (hoursOpen()>14 ? 1.4 : 1) * (s.quirk==='workaholic'?2:1) * focusMul('fatigue'), 0, 100);
      if(unpaid){ s.mood = clamp(s.mood-15,0,100); }
    } else if(s.today==='off' || s.today==='absent'){ s.consec = 0; s.fatigue = 0; s.mood = 100; s.pat = 100; s.restDay = S.day + 1; }
    if(s.fatigue > 70) s.mood = clamp(s.mood-5,0,100);
    if(s.quirk==='thief' || s.quirk==='drinker') s.mood = clamp(s.mood+3,0,100);
    if(s.quirk==='thief' && stockQty('desserts')>0){ takeStock({desserts:Math.min(stockQty('desserts'), RI(1,3))}); }
  }
  S.staff = S.staff.filter(s=>s.today!=='sub' || s.isYou);
  // аренда и коммуналка
  for(const r of S.rooms){ const d = roomDef(r.id); const late = S.level >= 10 ? 0.85 : 1; spend(Math.round(d.rent * city().rent * modMul('rent') * late), 'rent', 'Аренда: '+d.n); spend(Math.round((4300 + 60*hoursOpen()) * roomMult(r.id) * late), 'util', 'Коммуналка: '+d.n); }
  if(S.staffMeal){ const n = S.staff.filter(s=>!s.isYou && (s.today==='work'||s.today==='sub')).length; if(n) spend(250*n, 'other', 'Стафф-питание'); }
  if(stockQty('desserts') >= 3 && chance(0.3)) HOOK.event('writeoff', {});
  // кредит
  if(S.debt.loan > 0){ const pay = Math.round(S.debt.loan*0.04); spend(pay, 'other', 'Кредит: платёж 4% в день'); S.debt.loan = Math.max(0, S.debt.loan - pay*0.4); }
  // ежедневные проверки
  if(f.rev > S.c.maxDayRev) S.c.maxDayRev = f.rev;
  if(f.fines === 0) S.c.daysNoFine++; else S.c.daysNoFine = 0;
  for(const t of (S.tasks||[])) if(t.kind==='noangry' && !t.failed && !t.done){ t.prog = 1; t.done = true; income(t.reward); HOOK.toast('Задание выполнено: +'+fmtR(t.reward)); }
  // увольнения по желанию
  for(const s of S.staff){
    if(s.isYou) continue;
    if(s.notice && s.notice <= S.day){ removeStaff(s.id); S.c.quits++; HOOK.toast(s.name+' отработал и ушёл'); continue; }
    if(s.promise && s.promise < S.day && s.rank < s.promiseRank){ HOOK.event('promise_broken', {sid:s.id}); s.promise = 0; continue; }
    const stv = staffState(s); let p = (stv<30 ? 0.06 : 0.004) + (unpaid ? 0.12 : 0);
    if(s.legendId) p *= 0.4;
    if(!s.notice && chance(p)){
      const why = unpaid ? 'money' : s.fatigue>75 ? 'burn' : s.mood<35 ? pick(['money','burn','conflict']) : pick(['life','odd','money','odd']);
      HOOK.event('quit', {sid:s.id, why, reason:pick(QUIT_REASONS[why])});
    }
  }
  // ссоры
  for(const r of S.rooms){ const ws = S.staff.filter(s=>s.room===r.id && s.today==='work' && !s.isYou); if(ws.length>=2 && chance(0.05 + (ws.some(s=>s.quirk==='lover')?0.05:0) - (ws.some(s=>s.legendId===1)?0.05:0))){ const [a,b] = pickTwo(ws); HOOK.event('conflict', {sid:a.id, sid2:b.id}); } }
  staffDayCheck(); pathDaily(); wishTick(); if(S.day % 3 === 0) envyTick(); shrinkDaily();
  tourAdd(typeof opProfit==="function" ? opProfit(f) : profitOf(f));
  S.c._angryDay = S.c.angry;
  (S.reviews||[]).forEach(rv=>{ if(!rv.reply && rv.stars<=2 && S.day - rv.day === 1) repAdd(-0.02); });
  if(!HOOK.quiet && typeof zReport==='function' && (f.guests||0) > 0) HOOK.modal({kind:'z', z:zReport(f), day:S.day});
  if(typeof goldenCheck==='function') goldenCheck(f);
  S.fin.hist.unshift(Object.assign({day:S.day}, f, {last:undefined}));
  S.fin.hist = S.fin.hist.slice(0, 30);
  S.fin.today = blankFin();
  // разорение
  bankruptStep();
  HOOK.struct();
}
function pickTwo(a){ const x = pick(a); const y = pick(a.filter(z=>z!==x)); return [x,y]; }
function removeStaff(id){ S.staff = S.staff.filter(s=>s.id!==id); S.incidents = S.incidents.filter(i=>i.sid!==id && i.sid2!==id); HOOK.struct(); }
function midnight(){
  // смена дня
  S.day++;
  spoilCheck();
  // налог раз в месяц
  // налог списывается каждый день, без месячного удара
  if(S.fin.taxAcc > 0){ const tax = Math.round(S.fin.taxAcc); S.fin.taxAcc = 0; S.fin.taxDueDay = S.day + 1; spend(tax, 'tax', 'Налог УСН 5% за вчера'); }
  autoOrder();
  for(const s of S.staff){ if(s.mood < 100 && s.legendId===3) repAdd(0.01); }
  if(S.staff.some(s=>s.quirk==='blogger' && scheduledToday(s)) && chance(0.15)){ addMod('traffic', 1.15, 4, 'Видео тиктокера: гостей +15%'); }
  // подмены
  S.mods = S.mods.filter(m=>m.until > absNow());
  rivalsDay();
  storyMidnight();
  achCheck();
}
function bankruptStep(){
  const d = S.debt;
  if(S.money < 0){ d.daysNeg++; } else { d.daysNeg = 0; if(d.stage>0){ d.stage = 0; HOOK.toast('Касса снова в плюсе. Поставщики снова возят'); } return; }
  if(d.daysNeg >= 2 && d.stage < 1){ d.stage = 1; HOOK.event('debt1', {}); }
  else if(d.daysNeg >= 5 && d.stage < 2){ d.stage = 2; HOOK.event('debt2', {}); }
  else if(d.daysNeg >= 9 && d.stage < 3){ d.stage = 3; if(S.rooms.length>1){ const lost = S.rooms[S.rooms.length-1]; S.rooms = S.rooms.filter(r=>r!==lost); S.staff.filter(s=>s.room===lost.id).forEach(s=>removeStaff(s.id)); if(S.active===lost.id) S.active = 'main'; HOOK.event('debt3', {room:roomDef(lost.id).n}); } else d.daysNeg++; }
  else if(d.daysNeg >= 14){ HOOK.modal({kind:'bankrupt'}); }
}

/* ---------- карьера ---------- */
function promoInfo(s){
  if(s.rank >= 3) return {can:false, t:'Высшая должность'};
  const req = RANK_REQ[s.rank+1];
  const ok = s.shifts >= req.shifts && s.lvl >= req.lvl && req.f(s);
  const cool = s.examAt && s.examAt > S.day;
  return {can: ok && !cool, req, cool, t:req.t};
}
function tryPromote(s){
  const info = promoInfo(s); if(!info.can) return {ok:false, t:'Условия не выполнены'};
  if(info.req.exam){
    const p = clamp(0.35 + 0.05*(s.lvl - info.req.lvl) + s.mood/400 - s.fatigue/300, 0.1, 0.9);
    if(!chance(p)){ s.examAt = S.day + 3; s.mood = clamp(s.mood-12,0,100); return {ok:false, t:s.name+' завалил аттестацию. Пересдача через 3 дня.'}; }
  }
  s.rank++; S.c.promoted++; s.mood = clamp(s.mood+20,0,100);
  if(s.promise && s.rank >= s.promiseRank) s.promise = 0;
  return {ok:true, t:s.name+' теперь '+RANKS[s.rank].toLowerCase()+'.'};
}
function trainCost(s){ return Math.round(15000 * Math.pow(1.45, s.lvl-1) * (S.level>=6 ? 0.8 : 1) / 100) * 100; }
function trainInfo(s){
  if(s.lvl >= RANK_CAP[s.rank]) return {can:false, t:'Потолок для должности «'+RANKS[s.rank]+'». Нужно повышение'};
  if(s.shifts < s.lvl*2) return {can:false, t:'Нужно отработать смен: '+(s.lvl*2)+' (сейчас '+s.shifts+')'};
  if(s.trainNext) return {can:false, t:'Уже записан на обучение'};
  return {can:true, cost:trainCost(s)};
}

function inspectionResult(kind, mode){
  S.c.inspections++;
  const rm = room(S.active);
  let viol = 0, why = [];
  if(kind==='san'){ if(S.meters.chaos>45){ viol++; why.push('грязно'); } if(dirtLevel(S.active)>0.45){ viol++; why.push('срач в зале и гора посуды'); } if(S.flags.medbad){ viol += 2; why.push('санкнижки куплены в переходе'); S.flags.medbad = 0; } if(S.flags.expired){ viol++; why.push('просрочка'); } if(S.flags.goose){ viol++; why.push('гусь на кухне'); } if(rm.upg.clean<2){ viol += 0.5; } }
  if(kind==='tax'){ if(S.fin.noCheck>0){ viol += 2; why.push('продажи без чеков на '+fmtR(S.fin.noCheck)); } }
  if(kind==='fire'){ if(rm.upg.safety<1){ viol += 2; why.push('нет огнетушителя'); } else if(rm.upg.safety<3 && chance(0.3)){ viol++; why.push('загромождён выход'); } }
  if(kind==='labor'){ const grey = S.staff.filter(s=>s.contract==='grey'); if(grey.length){ viol += grey.length; why.push('неоформленные: '+grey.map(s=>s.name).join(', ')); } if(S.staff.some(s=>s.sched==='every')){ viol += 0.5; why.push('без выходных'); } }
  if(viol < 1 && chance(0.15)) { viol = 1; why.push('нашли, к чему придраться'); }
  let fine = 0, txt = '', fx = {};
  const base = kind==='tax' ? Math.max(10000, S.fin.noCheck*0.5) : kind==='labor' ? 10000*Math.max(1, Math.round(viol)) : RI(FINES[kind][0]/1000, FINES[kind][1]/1000)*1000;
  const lawyer = 1 - 0.1*perk('lawyer');
  if(mode==='bribe'){
    if(chance(0.5)){ fine = Math.round(base*0.35); txt = 'Инспектор взял конверт и ушёл, не глядя по сторонам.'; fx.chaos = 2; }
    else { fine = Math.round(base*2); txt = 'Инспектор оказался принципиальным. Штраф вдвое больше и протокол о попытке подкупа.'; fx.rep = -2; fx.pathos = 2; }
  } else if(viol < 1){
    txt = 'Нарушений не нашли. Инспектор даже взял капучино с собой.'; fx.rep = 1; S.c.passed++;
    if(mode==='treat') { fine = 260; txt = 'Нарушений не нашли. Пирожное съедено, протокол чистый.'; }
  } else {
    let mul = 1; if(mode==='treat') mul = chance(0.4) ? 0.5 : 1; if(mode==='lie' || mode==='stall') mul = chance(0.35) ? 0 : 1.5;
    fine = Math.round(base * mul * lawyer);
    txt = fine ? 'Нарушения: '+why.join(', ')+'. Штраф '+fmtR(fine)+'.' : 'Повезло: инспектор поверил и ушёл.';
    if(kind==='san' && viol>=2.5 && mode!=='lie'){ fx.close = 24; txt += ' Кофейню закрыли на сутки до устранения.'; }
    if(kind==='tax') S.fin.noCheck = 0;
  }
  if(fine){ spend(fine, 'fines'); S.c.fines++; S.c.finesSum += fine; S.c.daysNoFine = 0; }
  if(kind==='san') S.flags.expired = 0;
  return {txt, fx};
}
function dailyEventsRoll(){
  if(S.day < 4 || S.noInspectUntil > S.day) return;
  const comp = S.flags.complaint ? 3 : 1;
  const kinds = [['inspect_san', 1/40], ['inspect_tax', S.fin.noCheck>0 ? 1/6 : 1/55], ['inspect_fire', 1/60], ['inspect_labor', S.staff.some(s=>s.contract==='grey') ? 1/30 : 1/80]];
  const invBad = daysSinceInventory() > 10 ? 1.6 : 1;
  for(const [id, p] of kinds){ if(chance(p*comp*pathInspect()*(id==='inspect_tax'?invBad:1))){ S.pending.push({at:absNow()+RI(60, hoursOpen()*50), ev:id}); S.flags.complaint = 0; break; } }
  // обычные бытовые неприятности
  if(chance(0.08)) S.pending.push({at:absNow()+RI(30,400), ev:pick(['flood','sewer','roaches','power','pricehike','landlord','fakebill'])});
  if(chance(0.06)) S.pending.push({at:absNow()+RI(60,500), ev:'medbook'});
}

function rivalsDay(){
  for(const r of S.rivals){
    if(r.status==='gone' || r.owned) continue;
    const base = RIVALS.find(x=>x.id===r.id);
    r.power = clamp(r.power + R(-2,2) - (S.rep-3)*0.6 - S.level*0.03, 0, 100);
    if(r.status==='open'){
      if(r.power < 12 && chance(0.3)){ r.status = 'sale'; r.ask = Math.round(roomPrice(r)/1000)*1000; HOOK.event('rival_sale', {rid:r.id}); continue; }
      if(chance(0.07)){ const act = r.rel < -20 ? pick(['promo','fake','complain','poach']) : r.rel > 40 ? pick(['coop','coop','promo']) : pick(['promo','poach','coop','fake']);
        if(act==='promo'){ HOOK.event('rival_promo', {rid:r.id}); }
        if(act==='fake'){ repAdd(-0.15); HOOK.toast('«'+base.n+'» накидали вам фейковых отзывов'); }
        if(act==='complain'){ S.flags.complaint = 1; HOOK.toast('Похоже, на вас пожаловались. Жди проверку'); }
        if(act==='poach'){ const st = S.staff.filter(s=>s.lvl>=4 && !s.legendId); if(st.length) HOOK.event('poach', {sid:pick(st).id, rid:r.id}); }
        if(act==='coop'){ HOOK.event('rival_coop', {rid:r.id}); }
      }
    } else if(r.status==='sale'){ r.ask = Math.round(r.ask * 0.985 / 1000) * 1000; if(chance(0.03)){ r.status = 'open'; r.power = 30; HOOK.toast('«'+base.n+'» передумали продаваться'); } }
  }
}
function roomPrice(r){ return Math.max(1200000, 4000000 * (1 + S.level*0.08)); }

const PITCH = [

function rivalTalk(rid, i){
  const r = S.rivals.find(x=>x.id===rid), base = RIVALS.find(x=>x.id===rid), pt = PITCH[i];
  if(r.talkDay === S.day && !pt.wait) return 'Сегодня с ним уже говорили. Попробуй завтра.';
  r.talkDay = S.day;
  if(pt.m){ if(!canSpend(-pt.m)) return 'Не хватает денег на ужин'; spend(-pt.m, 'other', 'Посиделки с командой'); }
  if(pt.chaos) meter('chaos', pt.chaos);
  if(pt.wait){ r.ask = Math.round(r.ask*(1+pt.ask)/1000)*1000; return 'Подождали. Цена снизилась до '+fmtR(r.ask)+'.'; }
  if(chance(pt.p)){ r.rel = clamp(r.rel + pt.rel, -100, 100); r.ask = Math.round(r.ask*(1+pt.ask)/1000)*1000; return pt.rel>=0 ? 'Сработало. Хозяин смягчился. Цена: '+fmtR(r.ask)+'.' : 'Испугался. Цена упала до '+fmtR(r.ask)+', но он тебя ненавидит.'; }
  r.rel = clamp(r.rel - 8, -100, 100); r.ask = Math.round(r.ask*1.05/1000)*1000;
  if(r.rel < -60 && chance(0.4)){ r.status = 'gone'; return 'Хозяин послал тебя и продал помещение кому-то другому.'; }
  return 'Не сработало. Он обиделся и поднял цену до '+fmtR(r.ask)+'.';
}
function rivalOffer(rid, frac){
  const r = S.rivals.find(x=>x.id===rid), base = RIVALS.find(x=>x.id===rid);
  const offer = Math.round(r.ask * frac / 1000) * 1000;
  if(!canSpend(offer)) return {ok:false, t:'Не хватает денег'};
  const need = 1 - (1-base.stub) * 0.25 - r.rel/400;
  if(frac >= need || frac >= 1){ spend(offer, 'invest', 'Выкуп помещения конкурента'); r.status = 'sold'; r.owned = true; const id = 'rv_'+r.id; S.rooms.push(newRoom(id)); S.active = id; HOOK.sfx('level'); return {ok:true, t:'Сделка! Помещение «'+base.n+'» теперь ваше.'}; }
  r.rel = clamp(r.rel - 6, -100, 100);
  return {ok:false, t:'Хозяин отказался. Сказал, что за такие деньги отдаст только вывеску.'};
}
function rivalAction(rid, act){
  const r = S.rivals.find(x=>x.id===rid);
  if(r.actDay === S.day) return 'Сегодня с ними уже что-то было. Завтра.';
  r.actDay = S.day;
  if(act==='visit'){ r.rel = clamp(r.rel+8,-100,100); meter('soul',1); return 'Зашёл познакомиться. Выпили по кофе. Отношения теплее.'; }
  if(act==='fake'){ if(chance(0.25)){ repAdd(-0.3); r.rel -= 30; return 'Тебя спалили: в чате района выложили скриншоты. Рейтинг упал.'; } r.power = clamp(r.power-10,0,100); r.rel -= 15; meter('chaos',2); return 'Отзывы написаны. Им стало хуже.'; }
  if(act==='san'){ r.power = clamp(r.power-15,0,100); r.rel -= 25; meter('chaos',2); if(chance(0.3)){ S.flags.complaint = 1; return 'Проверку к ним вызвали. Они догадались, кто это, и ответили тем же.'; } return 'К ним пришла проверка. Они закрыты до вечера.'; }
  if(act==='poach'){ if(chance(0.4)){ const l = makeLegend() || makeStaff('Бариста'); l.lvl = Math.max(l.lvl,5); S.cands.push(l); r.rel -= 15; return 'Их лучший сотрудник готов перейти. Он в кандидатах.'; } r.rel -= 5; return 'Не захотел уходить.'; }
}

/* ================= разрешение событий ================= */
function fillText(str, inc){
  const st = inc.sid ? S.staff.find(x=>x.id===inc.sid) : null, st2 = inc.sid2 ? S.staff.find(x=>x.id===inc.sid2) : null;
  const rv = inc.rid ? RIVALS.find(x=>x.id===inc.rid) : null;
  return String(str).replace(/\{s\}/g, st?st.name:(inc.sname||'Сотрудник')).replace(/\{s2\}/g, st2?st2.name:'коллега').replace(/\{reason\}/g, inc.reason||'').replace(/\{rival\}/g, rv?rv.n:'Соседи').replace(/\{room\}/g, inc.room||'').replace(/\{dl\}/g, S.story ? dlText() : '').replace(/\{price\}/g, inc.price ? fmtR(inc.price) : '').replace(/\{vt\}/g, inc.vt||'').replace(/\{vintro\}/g, inc.vintro||'').replace(/\{sab\}/g, inc.sab||'');
}
function evDef(inc){ return inc.id==='absurd' ? absurdDef(inc) : EV[inc.id]; }
function pushIncident(id, data){
  data = data || {};
  const d = EV[id]; if(!d && id!=='absurd') return;
  if(id==='conflict') data.reason = pick(CONFLICT_REASONS);
  if(id==='revenge') data.reason = pick(REVENGE);
  if(id==='rival_promo' || id==='rival_coop' || id==='rival_sale'){ if(!data.rid) data.rid = pick(RIVALS).id; }
  const inc = Object.assign({uid:S.uid++, id, at:Date.now(), atG:absNow()}, data);
  S.evLast = S.evLast || {}; S.evLast[id] = absNow();
  if(d && d.pre && d.pre(inc) === false) return;
  if(inc.price) S._lastPrice = inc.price;
  if(inc.sid){ const s = S.staff.find(x=>x.id===inc.sid); if(s) inc.sname = s.name; }
  if(d && d.auto){ applyFx(d.auto, inc); HOOK.modal({kind:'result', inc}); return; }
  if(S.incidents.length >= 6) expireIncident(S.incidents.find(i=>EV[i.id] && EV[i.id].cat!=='inspect' && EV[i.id].cat!=='story') || S.incidents[0]);
  S.incidents.push(inc);
  HOOK.sfx('alert'); HOOK.struct();
  const urgent = d && (d.cat==='inspect' || d.cat==='staff' || d.cat==='break' || d.cat==='money' || d.cat==='story');
  if(urgent) HOOK.modal({kind:'inc', uid:inc.uid, auto:true});
}
HOOK.event = pushIncident;
function expireIncident(inc){
  if(!inc) return;
  const d = evDef(inc);
  S.incidents = S.incidents.filter(x=>x!==inc);
  // если долго не решали: проверки и кадры решаются по умолчанию, остальное — мелкий штраф к рейтингу и бардак
  if(d && d.o){
    if(d.cat==='story'){ let k = d.o.length-1; while(k>0 && d.o[k].req && !d.o[k].req(S, inc)) k--; resolveIncident(inc, k, true); }
    else if(d.cat==='inspect' || d.cat==='break' || d.cat==='money') resolveIncident(inc, 0, true);
    else if(inc.id==='quit') resolveIncident(inc, 0, true);
    else if(inc.id==='absent' || inc.id==='conflict'){ resolveIncident(inc, inc.id==='absent'?2:2, true); }
    else { applyFx({chaos:2, rep:-1}, inc); }
    HOOK.toast('«'+fillText(d.t,inc)+'» решилось без тебя'); }
  HOOK.struct();
}
function applyFx(fx, inc){
  const chips = []; const st = inc && inc.sid ? S.staff.find(s=>s.id===inc.sid) : null; const st2 = inc && inc.sid2 ? S.staff.find(s=>s.id===inc.sid2) : null;
  let target = st;
  if(fx.roleTarget){ target = S.staff.find(s=>s.role===fx.roleTarget && s.room===S.active) || st; }
  if(fx.m){ if(fx.m>0){ income(fx.m); S.fin.today.other -= fx.m; } else spend(-fx.m, 'other'); chips.push([(fx.m>0?'+':'')+fmtR(fx.m), fx.m>0]); }
  if(fx.rep){ repAdd(fx.rep/10); chips.push(['Рейтинг '+(fx.rep>0?'+':'−')+(Math.abs(fx.rep)/10).toFixed(1).replace('.',','), fx.rep>0]); }
  ['soul','pathos','chaos'].forEach(m=>{ if(fx[m]){ meter(m, fx[m]); chips.push([METER_N[m]+' '+(fx[m]>0?'+':'−')+Math.abs(fx[m]), m==='chaos'? fx[m]<0 : null]); } });
  if(target && fx.mood){ target.mood = clamp(target.mood+fx.mood,0,100); chips.push([target.name+': настроение '+(fx.mood>0?'+':'−')+Math.abs(fx.mood), fx.mood>0]); }
  if(st2 && fx.mood2){ st2.mood = clamp(st2.mood+fx.mood2,0,100); chips.push([st2.name+': настроение '+(fx.mood2>0?'+':'−')+Math.abs(fx.mood2), fx.mood2>0]); }
  if(st && fx.pat) st.pat = clamp(st.pat+fx.pat,0,100);
  if(st && fx.fatigue) st.fatigue = clamp(st.fatigue+fx.fatigue,0,100);
  if(fx.moodAll){ S.staff.forEach(s=>s.mood=clamp(s.mood+fx.moodAll,0,100)); chips.push(['Команда '+(fx.moodAll>0?'+':'−')+Math.abs(fx.moodAll), fx.moodAll>0]); }
  if(fx.moodOthers){ S.staff.filter(s=>s!==st && s.today==='work').forEach(s=>{ s.mood=clamp(s.mood+fx.moodOthers,0,100); s.fatigue=clamp(s.fatigue+8,0,100); }); chips.push(['Остальные: настроение '+fx.moodOthers, false]); }
  if(fx.mod){ addMod(...fx.mod); chips.push([fx.mod[3], fx.mod[1]>=1 === (fx.mod[0]!=='rent' && fx.mod[0]!=='supply' && fx.mod[0]!=='wear')]); }
  if(fx.mod2){ addMod(...fx.mod2); chips.push([fx.mod2[3], null]); }
  if(fx.upg){ for(const r of S.rooms){ if(r.upg[fx.upg] < MAXL){ r.upg[fx.upg]++; chips.push([UPG.find(u=>u.id===fx.upg).n+' +1 уровень', true]); break; } } }
  if(fx.close){ S.closedUntil = Math.max(S.closedUntil, absNow()+fx.close*60); chips.push(['Закрыто на '+fx.close+' ч', false]); }
  if(fx.noInspect){ S.noInspectUntil = S.day + fx.noInspect; chips.push(['Без проверок '+fx.noInspect+' дн.', true]); }
  if(fx.rival){ const rid = fx.rival[1] || (inc && inc.rid) || pick(S.rivals.filter(r=>r.status==='open')).id; const r = S.rivals.find(x=>x.id===rid); if(r){ r.rel = clamp(r.rel+fx.rival[0],-100,100); if(fx.rival[0]===0) r.power = clamp(r.power+8,0,100); chips.push(['Отношения с «'+RIVALS.find(x=>x.id===rid).n+'» '+(fx.rival[0]>=0?'+':'')+fx.rival[0], fx.rival[0]>0]); } }
  if(fx.stock){ for(const k in fx.stock){ const st_ = STOCK[k]; if(st_.perish) S.stock[k].push({q:fx.stock[k], exp:S.day+st_.perish}); else S.stock[k] += fx.stock[k]; } }
  if(fx.goose){ S.flags.goose = 1; S.c.geese++; }
  if(fx.fights){ S.c.fights += fx.fights; }
  if(fx.loyal){ const rg = S.regs.find(x=>x.id===fx.loyal[0]); if(rg){ rg.loyal = clamp(rg.loyal + fx.loyal[1], 0, 100); const nm = (REGULARS.find(x=>x.id===rg.id)||{}).n; chips.push([nm+': лояльность '+(fx.loyal[1]>0?'+':'')+fx.loyal[1], fx.loyal[1]>0]); if(rg.loyal<=10 && !rg.gone){ rg.gone = true; chips.push([nm+' ушёл навсегда', false]); } } }
  if(fx.repair){ const [k, how] = fx.repair; const rm = room(inc && inc.room || S.active);
    if(how==='full'){ spend(EQ[k].fix, 'repairs'); rm.broken[k] = false; rm.eq[k] = 100; }
    if(how==='cheap'){ spend(Math.round(EQ[k].fix/3), 'repairs'); if(chance(0.55)){ rm.broken[k] = false; rm.eq[k] = 60; chips.push(['Заработало', true]); } else { chips.push(['Сломалось снова, нужен сервис', false]); } }
    if(how==='none'){ if(k==='kkt') rm.noCheck = true; } }
  if(fx.inspect){ const r = inspectionResult(fx.inspect, fx.mode); const c2 = applyFx(r.fx, inc); return {chips:c2.chips.concat(r.txt? [] : []), out:r.txt}; }
  if(fx.gamble){ const g = chance(0.5) ? fx.gamble[0] : fx.gamble[1]; const c2 = applyFx(Object.assign({}, g, {out:undefined}), inc); return {chips:chips.concat(c2.chips), out:g.out}; }
  if(fx.loan){ income(fx.loan); S.debt.loan += fx.loan*1.3; chips.push(['Долг «серьёзным людям»: '+fmtR(S.debt.loan), false]); }

    if(fx.vacation){ st.vacation = S.day + fx.vacation; st.today = 'off'; }
    if(fx.promise){ st.promise = S.day + 10; st.promiseRank = Math.min(3, st.rank+1); }
    if(fx.notice){ st.notice = S.day + fx.notice; st.mood = clamp(st.mood-30,0,100); }
    if(fx.dayoff){ st.today = 'off'; }
    if(fx.sub){ const sub = makeStaff(st.role, {quirk:'none'}); sub.name = 'Подмена '+sub.name; sub.today = 'sub'; sub.room = st.room; sub.lvl = Math.max(1, st.lvl-2); sub.subPay = shiftPay(st)*2; S.staff.push(sub); S.c.subs++; chips.push(['Подмена за '+fmtR(sub.subPay), false]); }
    if(fx.selfwork){ const sub = makeStaff(st.role, {quirk:'none'}); sub.name = 'Ты'; sub.today = 'sub'; sub.room = st.room; sub.lvl = 2; sub.subPay = 0; sub.isYou = true; S.staff.push(sub); }

    if(fx.fire){ if(fx.quit) S.c.quits++; else S.c.fired++; if(st.contract==='grey' && !fx.quit && chance(0.4)) S.flags.complaint = 1; removeStaff(st.id); chips.push([st.name+' больше не работает', false]); }
  }
  if(st2 && fx.fire2){ removeStaff(st2.id); S.c.fired++; }

function resolveIncident(inc, i, auto){
  const d = evDef(inc); const o = d.o[i];
  S.incidents = S.incidents.filter(x=>x!==inc);
  let out = o.out || '';
  let fx = o.fx || {};
  if(typeof fx === 'function'){ const r0 = fx(S, inc) || {}; fx = r0.fx || {}; if(r0.out) out = r0.out; }
  if(o.p !== undefined && !chance(o.p)){ out = o.fail || out; fx = {fire:1, quit:1}; }
  if(o.buyNow){ const k = o.buyNow; const err = orderStock(k, 3, true); if(err) out = err; }
  const r = applyFx(fx, inc);
  if(r.out) out = r.out;
  if(o.then){ for(const t of o.then){
    let p = t.p; if(t.cond==='rep4') p = S.rep >= 4 ? 1 : 0;
    if(p===-1) continue;
    if(chance(p)){ S.pending.push({at:absNow()+RI(t.after[0], t.after[1]), ev:t.ev, fx:t.fx, note:t.note, data:{rid:inc.rid}}); break; }
  } }
  if(inc.id==='absurd') S.c.absurd++;
  if(!auto) addXp(8);
  HOOK.struct();
  return {out: fillText(out, inc), chips:r.chips, title: fillText(d.t, inc)};
}

/* Офлайн: прогон экономики по агрегированным шагам */
function ownerSub(){ return S.ent && S.ent.sub && S.ent.sub > Date.now(); }
function simulateOffline(realMs){
  const sub = ownerSub();
  const capped = Math.min(realMs, (sub?24:12)*3600*1000);
  const steps = Math.floor(capped / 60000);
  const eff = sub ? 0.8 : 0.6;
  const before = S.money, guests0 = S.c.guests; let expired = 0;
  HOOK.quiet = true;
  for(let i=0;i<steps;i++){
    const gmins = 60000 / REAL_PER_GMIN;
    gAcc += gmins; const whole = Math.floor(gAcc); gAcc -= whole; advanceGameMinutes(whole);
    if(S.isOpen && S.closedUntil <= absNow()){
      for(const r of S.rooms){ const st = stats(r.id); let n = Math.min(st.lambda + st.lambdaD, st.through) * 60 * eff; let k = Math.floor(n) + (chance(n%1)?1:0);
        const over = Math.max(0, (st.lambda + st.lambdaD) - st.through) * 60 * eff; if(over > 0){ S.c.angry += Math.round(over*0.6); repAdd(-0.0008*over); }
        const dshare = st.lambdaD / Math.max(1e-6, st.lambda + st.lambdaD);
        for(let j=0;j<k;j++){ const res = sellOne(r.id, {delivery: chance(dshare)}); if(res.fail){ S.c.angry++; break; } } }
    }
    // нерешённые события решаются сами
    for(const inc of S.incidents.slice()) if(Date.now() - inc.at > 20*60000){ expireIncident(inc); expired++; }
  }
  HOOK.quiet = false;
  return {money:S.money-before, guests:S.c.guests-guests0, mins:Math.round(capped/60000), expired};
}

const EV_EXCL = new Set(['blogger_back','landlord','pricehike','rival_coop','rival_promo','rival_sale','supplier_sour']);
function eventPool(){
  const now = absNow(), last = S.evLast || {};
  const hol = holiday();
  const ids = Object.keys(EV).filter(id=>{ const d = EV[id]; if(d.cat!=='normal' || d.chain || d.auto || EV_EXCL.has(id)) return false; if(id.startsWith('h_') && !(hol && id==='h_'+hol.id)) return false; return (!d.cond || d.cond(S)) && !S.incidents.some(x=>x.id===id); });
  const fresh = ids.filter(id=>!last[id]);
  const cool = ids.filter(id=>last[id] && now - last[id] > 5*DAY_MIN);
  if(fresh.length) return fresh;
  if(cool.length) return cool;
  return ids.sort((a,b)=>(last[a]||0)-(last[b]||0)).slice(0,3);
}

function pathShares(){ const m = S.meters, t = Math.max(1, m.soul + m.pathos + m.chaos); return {soul:m.soul/t, pathos:m.pathos/t, chaos:m.chaos/t}; }

function pathTraffic(){ const p = pathShares(); return 1 + 0.25*p.chaos - 0.05*p.pathos; }

function pathInspect(){ const p = pathShares(); return 1 + 1.5*p.chaos; }
function pathDaily(){

  for(const k of ['soul','pathos','chaos']) S.meters[k] = S.meters[k]*0.93;
  const sp = S.supplier || 'normal';
  if(sp==='premium') meter('pathos', 1.5); if(sp==='cheap') meter('chaos', 1.5);
  const grey = S.staff.filter(s=>s.contract==='grey').length; if(grey) meter('chaos', 0.6*grey);

  if(S.focus && S.focus.day===S.day) (FOCUS_PATH[S.focus.k]||[]).forEach(([k,v])=>meter(k,v));

/* ---------- инвентаризация: скрытая недостача ---------- */
function shrinkDaily(){
  S.shrink = S.shrink || {}; S.shrinkLog = S.shrinkLog || [];
  const thief = S.staff.find(s=>s.quirk==='thief'), tired = S.staff.filter(s=>s.role==='Бариста' && !s.isYou && staffState(s) < 45);
  for(const k in STOCK){ const q = stockQty(k); if(q <= 0) continue;
    let rate = 0.01, why = [];
    if(thief && (k==='desserts' || k==='pastry' || k==='sandwiches' || k==='syrup')){ rate += 0.05; why.push('thief'); }
    if(tired.length && (k==='milk' || k==='beans')){ rate += 0.02*tired.length; why.push('pour'); }
    if((S.supplier||'normal')==='cheap'){ rate += 0.025; why.push('short'); }
    if(S.rooms.some(r=>r.broken.fridge) && STOCK[k].perish){ rate += 0.04; why.push('fridge'); }
    const lost = q * rate * R(0.6, 1.4);
    takeStock({[k]:lost}); S.shrink[k] = (S.shrink[k]||0) + lost;
    why.forEach(w=>S.shrinkLog.push({k, w, day:S.day, sid: w==='thief' && thief ? thief.id : null}));
  }
  S.shrinkLog = S.shrinkLog.slice(-40);
}
function bookQty(k){ return stockQty(k) + ((S.shrink||{})[k]||0); }
function shrinkValue(){ let v = 0; for(const k in (S.shrink||{})) v += S.shrink[k]*unitCost(k); return Math.round(v); }
function inventoryDone(){ const v = shrinkValue(); const log = S.shrinkLog || []; S.shrink = {}; S.shrinkLog = []; S.invDay = S.day; taskProg('inventory', 1); return {value:v, log}; }
function daysSinceInventory(){ return S.day - (S.invDay || 1); }
