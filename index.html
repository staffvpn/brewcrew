<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brew Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone tapper — HUD, day task strip, room switcher, live cafe scene, path meters, tabbed management panel. Single warm-dark look around bright pixel art. */
:root{
  --bg:#17120e; --panel:#211913; --panel2:#2c2219; --line:#3e3026; --cream:#f3e8d3; --muted:#ae9b84;
  --caramel:#eaa33c; --soul:#86b86a; --pathos:#86a2e6; --chaos:#e06a4c; --bad:#e0574a; --good:#7fc76a; --shadow:#0a0705;
  --disp:'Unbounded','Golos Text',system-ui,sans-serif; --body:'Golos Text',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:14px;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.num{font-variant-numeric:tabular-nums}
.hud{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end}
.cafe{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--caramel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.money{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;text-align:right;white-space:nowrap}
.money.pulse{animation:pulse .35s ease}
@keyframes pulse{50%{transform:scale(1.08);color:var(--caramel)}}
.inc{font-size:12px;color:var(--good);text-align:right;white-space:nowrap}
.hudrow{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.hudrow b{color:var(--cream);font-weight:600}
.hudrow .sp{flex:1}
.lvl{display:flex;align-items:center;gap:6px;min-width:110px}
.bar{height:5px;background:var(--shadow);flex:1}
.bar i{display:block;height:100%;background:var(--caramel)}
.pxbtn{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:3px 9px;font-size:12px;font-weight:600}
.task{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);padding:5px 9px;font-size:12px}
.task .t{flex:1;min-width:0}
.task b{color:var(--caramel)}
.task .bar{max-width:80px}
.rooms{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{flex:none;background:var(--panel);border:2px solid var(--line);padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.room[aria-pressed="true"]{border-color:var(--caramel);color:var(--cream);background:var(--panel2)}
.room small{font-weight:500;color:var(--good);margin-left:4px}
.scene{position:relative;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:#000;flex:none;touch-action:manipulation}
#cv{display:block;width:100%;aspect-ratio:360/300;height:auto}
.meters{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:center}
.meter .k{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.meter .k b{color:var(--cream);font-weight:600}
.meter .bar{height:4px;margin-top:2px}
.path{font-size:11px;color:var(--muted);white-space:nowrap}
.path b{color:var(--cream)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{position:relative;background:var(--panel);border:2px solid var(--line);padding:7px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--cream);border-color:var(--caramel)}
.badge{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.panel{flex:1;min-height:130px;overflow-y:auto;background:var(--panel);border:2px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:7px}
.h{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--caramel);margin-top:3px}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--panel2);border:2px solid var(--line);padding:8px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .t{font-weight:700;font-size:14px}
.card .d{font-size:12px;line-height:1.4;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.row .sp{flex:1}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.up .t{font-weight:700;font-size:14px}
.up .eff{font-size:12px;color:var(--muted)}
.up .eff b{color:var(--good);font-weight:600}
.pips{grid-column:1/-1;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.pips i{height:5px;background:var(--shadow)}
.pips i.on{background:var(--caramel)}
.btn{background:var(--caramel);color:#1b130c;border:none;box-shadow:2px 2px 0 var(--shadow);padding:8px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none;padding:6px 10px}
.btn.red{background:var(--bad);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.spr{flex:none;background-repeat:no-repeat;image-rendering:auto}
.staff{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;text-align:left;width:100%}
.staff .mood{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.book .cell{height:56px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.book .cell.no .spr{filter:brightness(0);opacity:.35}
.veil{position:fixed;inset:0;background:rgba(8,6,4,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.modal{width:100%;max-width:430px;max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--caramel);box-shadow:5px 5px 0 var(--shadow);padding:15px;display:flex;flex-direction:column;gap:11px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
.modal h2{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.modal p{margin:0;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);padding:10px 12px;text-align:left;font-size:14px;line-height:1.35;font-weight:500}
.opt:active{transform:translate(1px,1px)}
.opt[aria-pressed="true"]{border-color:var(--caramel);background:#3a2a1b}
.opt:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;padding:2px 7px;border:2px solid var(--line);background:var(--panel2)}
.chip.g{border-color:#5f8a4a}.chip.b{border-color:#9b3d33}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{white-space:normal;text-align:left;line-height:1.25}
.acts .btn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.start{display:flex;flex-direction:column;gap:13px;padding-block:6px}
.logo{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;color:var(--caramel);text-shadow:3px 3px 0 var(--shadow)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names .opt{padding:7px 10px;font-size:13px}
.field{background:var(--panel2);border:2px solid var(--line);padding:9px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.two .opt{display:flex;flex-direction:column;gap:3px}
.two .opt b{font-family:var(--disp);font-size:15px}
.two .opt span{font-size:12px;color:var(--muted)}
.fly{position:fixed;z-index:15;pointer-events:none;font-family:var(--disp);font-weight:800;font-size:14px;color:#ffd36b;text-shadow:0 2px 0 #3a2410,0 0 6px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-50%,-50%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel2);border:2px solid var(--caramel);box-shadow:3px 3px 0 var(--shadow);padding:7px 12px;font-size:13px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion: reduce){.money.pulse{animation:none}}
.mods{display:flex;flex-wrap:wrap;gap:5px}
.mods .chip{font-size:11px}
.row.wrap{flex-wrap:wrap}
.tag.g{border-color:#5f8a4a;color:var(--good)}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.tag.gold{border-color:#c9a24a;color:#e9c46a}
.pips i.wall{box-shadow:inset 0 -2px 0 rgba(224,87,74,.7)}
.cov{display:grid;grid-template-columns:auto repeat(7,1fr);gap:3px 4px;font-size:11px;align-items:center}
.cov b{font-weight:600;color:var(--muted);text-align:center}
.cov b.today{color:var(--caramel)}
.cov span{color:var(--muted);white-space:nowrap;padding-right:4px}
.cov i{font-style:normal;text-align:center;background:var(--panel);padding:2px 0;font-variant-numeric:tabular-nums}
.cov i.zero{background:rgba(224,87,74,.35);color:#fff}
.cov i.one{background:rgba(234,163,60,.18)}
.fin{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;font-size:12px}
.fin b{color:var(--muted);font-weight:600;text-align:right}
.fin i{font-style:normal;text-align:right}
.fin .tot{border-top:2px solid var(--line);padding-top:4px;font-weight:700}
.eq{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:12px}
.eq b{font-weight:600}
.subnav{display:flex;flex-wrap:wrap;gap:5px}
.chipbtn{background:var(--panel2);border:2px solid var(--line);padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chipbtn[aria-pressed="true"]{border-color:var(--caramel);color:var(--cream)}
.days{display:flex;gap:5px;flex-wrap:wrap}
.book .cell.r1{border-color:#4a6fb0}
.book .cell.r2{border-color:#c9a24a}
.ach{opacity:.6}
.ach.ok{opacity:1;border-color:#5f8a4a}
.ava-empty{width:40px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-weight:700}
select{background:var(--panel2);color:var(--cream);border:2px solid var(--line);padding:5px 8px;font:inherit}
label.d{display:flex;align-items:center;gap:6px}
.staff{grid-template-columns:44px 1fr}

.tabs{grid-template-columns:repeat(6,1fr)}
.tab{font-size:11px;padding:7px 1px}
.hud > div:first-child{min-width:0;overflow:hidden}
.meta{overflow:hidden;text-overflow:ellipsis}
.hudrow .inc{text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<script>
'use strict';
/* ================= Brew Crew v3 — ядро: данные, экономика, персонал, события ================= */

const R = (a,b) => a + Math.random()*(b-a);
const RI = (a,b) => Math.floor(R(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const chance = p => Math.random() < p;
const HOOK = {toast(){}, sfx(){}, modal(){}, struct(){}, event(){}};

const REAL_PER_GMIN = 14000;          // игровая минута = 14 реальных секунд → игровой месяц ≈ реальная неделя
const DAY_MIN = 1440;
const MONTH_DAYS = 30;
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

/* ---------- города ---------- */
const CITIES = {
  msk:{n:'Москва', rent:1.25, check:1.15, traffic:1.1, rain:0.25},
  spb:{n:'Петербург', rent:1.0, check:1.0, traffic:1.0, rain:0.45},
  kzn:{n:'Казань', rent:0.75, check:0.85, traffic:0.95, rain:0.25},
  sochi:{n:'Сочи', rent:1.1, check:1.1, traffic:1.25, rain:0.2, season:true},
  nsk:{n:'Новосибирск', rent:0.7, check:0.8, traffic:0.9, rain:0.2, snow:true},
  kgd:{n:'Калининград', rent:0.8, check:0.9, traffic:0.95, rain:0.5}
};

/* ---------- склад ---------- */
const STOCK = {
  beans:{n:'Зерно', unit:'кг', pack:1000, packN:'1 кг', price:1600, cap:10000, show:q=>(q/1000).toFixed(1).replace('.',',')+' кг'},
  milk:{n:'Молоко', unit:'л', pack:12000, packN:'12 л', price:85*12, cap:48000, perish:3, show:q=>(q/1000).toFixed(1).replace('.',',')+' л'},
  cups:{n:'Стаканы', unit:'шт', pack:100, packN:'100 шт', price:950, cap:1500, show:q=>Math.round(q)+' шт'},
  syrup:{n:'Сиропы', unit:'л', pack:1000, packN:'1 л', price:450, cap:4000, show:q=>(q/1000).toFixed(1).replace('.',',')+' л'},
  tea:{n:'Чай', unit:'порц', pack:100, packN:'100 порций', price:800, cap:400, show:q=>Math.round(q)+' порц.'},
  desserts:{n:'Десерты', unit:'шт', pack:10, packN:'10 шт', price:1250, cap:30, perish:1, show:q=>Math.round(q)+' шт'},
  matcha:{n:'Матча', unit:'г', pack:100, packN:'100 г', price:600, cap:400, show:q=>Math.round(q)+' г'},
  food:{n:'Продукты для кухни', unit:'порц', pack:10, packN:'10 порций', price:1600, cap:30, perish:2, show:q=>Math.round(q)+' порц.'}
};

/* ---------- меню ---------- */
const MENU = [
  {id:'espresso', n:'Эспрессо', price:140, w:1, need:{beans:18, cups:1}, coffee:1},
  {id:'americano', n:'Американо', price:170, w:2, need:{beans:18, cups:1}, coffee:1},
  {id:'cappuccino', n:'Капучино', price:240, w:3.2, need:{beans:18, milk:150, cups:1}, coffee:1},
  {id:'tea', n:'Чай', price:150, w:0.7, need:{tea:1, cups:1}},
  {id:'latte', n:'Латте', price:260, w:2, need:{beans:18, milk:200, cups:1}, coffee:1, unlock:{t:'Продать 150 капучино', f:S=>sold('cappuccino')>=150}},
  {id:'dessert', n:'Десерты', price:260, w:0, need:{desserts:1}, side:1, unlock:{t:'Витрина 1 уровня', f:S=>maxUpg('showcase')>=1}},
  {id:'raf', n:'Раф', price:320, w:1.6, need:{beans:18, milk:150, syrup:20, cups:1}, coffee:1, unlock:{t:'Продать 600 напитков и меню 3 уровня', f:S=>S.c.sold>=600 && maxUpg('menu')>=3}},
  {id:'filter', n:'Фильтр-кофе', price:210, w:1, need:{beans:15, cups:1}, coffee:1, unlock:{t:'Кофемашина 5 уровня и бариста 5 уровня', f:S=>maxUpg('machine')>=5 && S.staff.some(s=>s.role==='Бариста'&&s.lvl>=5)}},
  {id:'breakfast', n:'Завтраки', price:420, w:0.9, need:{food:1}, food:1, unlock:{t:'Повар в команде, 6 столиков и 3 дня без штрафов', f:S=>S.staff.some(s=>s.role==='Повар') && maxUpg('tables')>=8 && S.c.daysNoFine>=3}},
  {id:'matcha', n:'Матча', price:340, w:0.9, need:{matcha:4, milk:200, cups:1}, unlock:{t:'Рейтинг 4,5 и Пафос 40', f:S=>S.rep>=4.5 && S.meters.pathos>=40}},
  {id:'shawarma', n:'Шаверма', price:290, w:1.3, need:{food:1}, food:1, unlock:{t:'Бардак 50 и 5 драк в зале', f:S=>S.meters.chaos>=50 && S.c.fights>=5}},
  {id:'pumpkin', n:'Тыквенный раф', price:340, w:1.6, need:{beans:18, milk:150, syrup:25, cups:1}, coffee:1, season:'halloween'}
];
function sold(id){ return (S.c.byItem && S.c.byItem[id]) || 0; }

/* ---------- залы ---------- */
const ROOMS = [
  {id:'main', n:'Кофейня', cost:0, rent:4000, mult:1, d:'Первая точка на 25 квадратов: стойка, витрина и пара столиков.', theme:{wall:'#c99f74', wall2:'#a97f58', trim:'#5b3b25', fa:'#8c6446', fb:'#7f5a3d', counter:'#6e4a30', ctop:'#9b7350'}},
  {id:'hall2', n:'Второй зал', cost:1500000, rent:7000, mult:1.3, need:{t:'Уровень 8 и рейтинг 3,8', f:S=>S.level>=8 && S.rep>=3.8}, d:'Помещение по соседству со своей стойкой. Своя команда и улучшения.', theme:{wall:'#8fab8a', wall2:'#6f8b6b', trim:'#33452f', fa:'#a08566', fb:'#937858', counter:'#3d5a48', ctop:'#58806a'}},
  {id:'veranda', n:'Веранда', cost:9000000, rent:12000, mult:1.6, outdoor:true, need:{t:'Уровень 16 и 3 месяца работы', f:S=>S.level>=16 && S.day>=45}, d:'Летняя веранда. В солнце очередь до угла, в дождь пусто.', theme:{wall:'#9ec9e4', wall2:'#cfe6f2', trim:'#6b4b2e', fa:'#b48a5f', fb:'#a47c53', counter:'#7a5233', ctop:'#a87a50'}},
  {id:'lounge', n:'Лаунж', cost:60000000, rent:35000, mult:2.6, need:{t:'Уровень 26, путь закреплён, рейтинг 4,5', f:S=>S.level>=26 && S.path && S.rep>=4.5}, d:'Второй этаж с неоном и дорогим меню.', theme:{wall:'#3b3550', wall2:'#2c2740', trim:'#151223', fa:'#4a4458', fb:'#423c50', counter:'#1f1b2c', ctop:'#3c3552'}}
];
const RIVAL_ROOM_THEME = {
  chain:{wall:'#d9d4cc', wall2:'#bcb6ac', trim:'#5a1e1e', fa:'#9a8f82', fb:'#8d8276', counter:'#7a2424', ctop:'#a03434'},
  hipster:{wall:'#5c5a56', wall2:'#4a4844', trim:'#1d1c1a', fa:'#7a6650', fb:'#6e5b47', counter:'#2a2826', ctop:'#46423c'},
  shawarma:{wall:'#d8b04a', wall2:'#b48d30', trim:'#5a3a10', fa:'#8a7a5a', fb:'#7d6e50', counter:'#8a2f1f', ctop:'#b24a2a'}
};

/* ---------- улучшения ---------- */
const UPG = [
  {id:'machine', n:'Кофемашина', base:15000, eff:L=>'Напитки быстрее ×'+f2(1+0.15*L)+', износ ниже'},
  {id:'register', n:'Касса', base:9000, eff:L=>'Заказ быстрее ×'+f2(1+0.15*L)},
  {id:'menu', n:'Меню', base:12000, eff:L=>'Цены и качество: +'+Math.round(4*L)+'%'},
  {id:'tables', n:'Столики', base:16000, eff:L=>'Мест: '+tableCount(L)},
  {id:'showcase', n:'Витрина', base:20000, eff:L=>'Десерт берут: '+Math.round(dessertP(L)*100)+'%'},
  {id:'decor', n:'Интерьер', base:14000, eff:L=>'Гостей +'+Math.round(4*L)+'%, редкие гости с 6 ур.'},
  {id:'sign', n:'Вывеска', base:22000, eff:L=>'Гостей +'+Math.round(7*L)+'%'},
  {id:'clean', n:'Уборка', base:8000, eff:L=>'Бардак уходит ×'+f2(1+0.5*L)},
  {id:'storage', n:'Склад и холодильник', base:10000, eff:L=>'Вместимость +'+Math.round(25*L)+'%, молоко живёт дольше'},
  {id:'safety', n:'Безопасность', base:6000, eff:L=>L<1?'Нет огнетушителя':L<3?'Огнетушитель':L<6?'Сигнализация':'Охрана и камеры'},
  {id:'pets', n:'Питомцы', base:40000, eff:L=>'Гостей +'+(2*L)+'%, '+petsLine(L)}

function blankFin(){ return {rev:0, card:0, cogs:0, supply:0, wages:0, rent:0, util:0, acq:0, tax:0, spoil:0, fines:0, repairs:0, other:0, guests:0}; }

function roomDef(id){ if(id && id.startsWith('rv_')){ const r = RIVALS.find(x=>'rv_'+x.id===id); return {id, n:'Бывш. «'+r.n+'»', cost:0, rent:6000, mult:1.4, d:'Выкупленное помещение конкурента.', theme:RIVAL_ROOM_THEME[r.type]}; } return ROOMS.find(r=>r.id===id); }

function isHalloween(){ const d = new Date(); const m = d.getMonth(), day = d.getDate(); return (m===9 && day>=24) || (m===10 && day<=2); }

/* ---------- модификаторы (временные эффекты событий) ---------- */
function addMod(k, mul, hours, label){ S.mods.push({k, mul, until:absNow()+Math.round(hours*60), label}); HOOK.struct(); }
function modMul(k){ const now = absNow(); return S.mods.reduce((a,m)=>m.k===k && m.until>now ? a*m.mul : a, 1); }
function activeMods(){ const now = absNow(); return S.mods.filter(m=>m.until>now && m.label); }

/* ---------- деньги и отчётность ---------- */
function spend(v, cat){ S.money -= v; S.fin.today[cat||'other'] += v; }
function income(v){ S.money += v; }
function canSpend(v){ return S.money >= v; }
function addXp(n){
  S.xp += n; let need = xpNeed();
  while(S.xp >= need){ S.xp -= need; S.level++; need = xpNeed(); HOOK.toast('Уровень '+S.level); HOOK.sfx('level');
    if(S.level===LOCK_LEVEL && !S.path){ S.path = leader(); HOOK.modal({kind:'path'}); } }
}
function xpNeed(){ return Math.round(60 * Math.pow(1.28, S.level-1)); }
function leader(){ const m = S.meters; return Object.keys(m).reduce((a,b)=>m[b]>m[a]?b:a); }
function meter(k, v){ if(!v) return; const f = S.path && S.path!==k && v>0 ? 0.5 : 1; S.meters[k] = clamp(S.meters[k]+v*f, 0, 100); }
function repAdd(v){ S.rep = clamp(S.rep + v, 1, 5); }

/* ---------- склад ---------- */
function stockQty(k){ const v = S.stock[k]; return Array.isArray(v) ? v.reduce((a,b)=>a+b.q,0) : (v||0); }
function stockCap(k){ return STOCK[k].cap * (1 + 0.25*maxUpg('storage')); }
function hasStock(need){ for(const k in need) if(stockQty(k) < need[k]) return false; return true; }
function takeStock(need){
  for(const k in need){ let left = need[k]; const v = S.stock[k];
    if(Array.isArray(v)){ v.sort((a,b)=>a.exp-b.exp); for(const b of v){ const t = Math.min(b.q, left); b.q -= t; left -= t; if(left<=0) break; } S.stock[k] = v.filter(b=>b.q>0.001); }
    else S.stock[k] = Math.max(0, v - left);
  }
}
function unitCost(k){ return STOCK[k].price / STOCK[k].pack * supplyMul(); }
function supplyMul(){ return modMul('supply') * (1 - 0.03*perk('supplier')); }
function needCost(need){ let c = 0; for(const k in need) c += need[k]*unitCost(k); return c; }
function orderStock(k, packs, express){
  const st = STOCK[k];
  const price = Math.round(st.price * packs * supplyMul() * (express?1.35:1) * (packs>=5?0.92:1));
  const limit = S.debt.stage>=1 ? 0 : 50000;
  if(S.money - price < -limit) return S.debt.stage>=1 ? 'Поставщики работают только по предоплате, а денег не хватает' : 'Не хватает денег даже с отсрочкой';
  spend(price, 'supply');
  const eta = express ? absNow()+180 : nextOpenAbs()+RI(0,90);
  S.orders.push({k, q:st.pack*packs, eta, price});
  return null;
}
function nextOpenAbs(){ const o = S.hours.open*60; return S.gm < o ? S.day*DAY_MIN + o : (S.day+1)*DAY_MIN + o; }
function deliver(){
  const now = absNow(); const arrived = S.orders.filter(o=>o.eta<=now);
  if(!arrived.length) return;
  for(const o of arrived){
    if(chance(0.03) && !S.flags.noSupplierEv){ HOOK.event('supplier_sour', {k:o.k}); }
    const st = STOCK[o.k];
    if(st.perish){ const life = st.perish + (o.k==='milk' ? Math.floor(maxUpg('storage')/5) : 0); S.stock[o.k].push({q:o.q, exp:S.day+life}); }
    else S.stock[o.k] = (S.stock[o.k]||0) + o.q;
    const cap = stockCap(o.k); const q = stockQty(o.k);
    if(q > cap){ HOOK.toast(st.n+': не всё влезло на склад, лишнее списано'); const over = q-cap; takeStock({[o.k]:over}); S.fin.today.spoil += over*unitCost(o.k); }
  }
  S.orders = S.orders.filter(o=>o.eta>now);
  HOOK.toast('Приехала поставка'); HOOK.struct();
}
function spoilCheck(){
  for(const k of ['milk','desserts','food']){
    const arr = S.stock[k]; let lost = 0;
    const fridgeBad = S.rooms.some(r=>r.broken.fridge);
    for(const b of arr){ if(b.exp <= S.day || (fridgeBad && k!=='food' && chance(0.5))){ lost += b.q; b.q = 0; } }
    S.stock[k] = arr.filter(b=>b.q>0);
    if(lost>0){ const v = lost*unitCost(k); S.fin.today.spoil += v; S.flags.expired = (S.flags.expired||0)+1; HOOK.toast(STOCK[k].n+': просрочка списана на '+fmtR(v)); }
  }
}
function autoOrder(){
  const mgr = S.staff.some(s=>s.rank===3);
  if(!S.autoOrder && !mgr) return;
  const targets = {beans:1, milk:0.9, cups:1, syrup:0.8, tea:0.7, desserts:0.8, matcha:0.7, food:0.8};
  for(const k in targets){
    if(k==='matcha' && !isUnlocked('matcha')) continue;
    if(k==='food' && !isUnlocked('breakfast') && !isUnlocked('shawarma')) continue;
    if(k==='desserts' && !isUnlocked('dessert')) continue;
    const pending = S.orders.filter(o=>o.k===k).reduce((a,o)=>a+o.q,0);
    const have = stockQty(k) + pending, cap = stockCap(k);
    if(have < cap*0.5){ const packs = Math.max(1, Math.floor((cap*targets[k]-have)/STOCK[k].pack)); orderStock(k, packs, false); }
  }
}

/* ---------- меню и продажи ---------- */
function isUnlocked(id){ const m = MENU.find(x=>x.id===id); if(!m) return false; if(m.season) return m.season==='halloween' && isHalloween(); if(!m.unlock) return true; if(S.flags['un_'+id]) return true; if(m.unlock.f(S)){ S.flags['un_'+id] = true; HOOK.toast('В меню появилось: '+m.n); HOOK.struct(); return true; } return false; }
function itemPrice(m, roomId){
  const rm = room(roomId);
  let p = m.price * (1+0.04*rm.upg.menu) * city().check * roomMult(roomId) * modMul('check');
  if(S.path==='pathos') p *= 1.2;
  if(m.id==='dessert' || m.id==='breakfast'){ const leg = S.staff.find(s=>s.room===roomId && s.legendId===2 && s.today==='work'); if(leg) p *= 2; }
  return Math.round(p/10)*10;
}
function available(roomId){
  const rm = room(roomId); const list = [];
  const working = workingStaff(roomId);
  const hasCook = working.some(s=>s.role==='Повар');
  const h = S.gm/60;
  for(const m of MENU){
    if(m.side || !isUnlocked(m.id)) continue;
    if(m.coffee && rm.broken.machine) continue;
    if(m.food && !hasCook) continue;
    if(m.id==='breakfast' && (h<8 || h>13)) continue;
    if(!hasStock(m.need)) continue;
    list.push(m);
  }
  return list;
}
function sellOne(roomId){
  const rm = room(roomId);
  const av = available(roomId);
  if(!av.length) return {fail:'empty'};
  // терминал сломан — платят только наличными
  if(rm.broken.terminal && chance(0.55)) return {fail:'card'};
  const tw = av.reduce((a,m)=>a+m.w,0); let r = Math.random()*tw, item = av[0];
  for(const m of av){ r -= m.w; if(r<=0){ item = m; break; } }
  let amount = itemPrice(item, roomId); takeStock(item.need); let cogs = needCost(item.need);
  let dessert = false;
  const dm = MENU.find(x=>x.id==='dessert');
  if(isUnlocked('dessert') && chance(dessertP(rm.upg.showcase)) && hasStock(dm.need)){ amount += itemPrice(dm, roomId); takeStock(dm.need); cogs += needCost(dm.need); dessert = true; S.c.byItem.dessert = (S.c.byItem.dessert||0)+1; }
  const waiters = workingStaff(roomId).filter(s=>s.role==='Официант').length;
  amount = Math.round(amount * (1 + 0.05*waiters));
  const card = !rm.broken.terminal && chance(0.8);
  const fee = card ? amount*0.02 : 0;
  income(amount - fee);
  const f = S.fin.today; f.rev += amount; f.cogs += cogs; f.acq += fee; f.guests++; if(card) f.card += amount;
  S.fin.taxAcc += amount*0.06;
  if(rm.broken.kkt && !rm.noCheck) {} // продажа без чека
  if(rm.broken.kkt) S.fin.noCheck += amount;
  S.c.earnedRun = (S.c.earnedRun||0) + amount;
  if(S.task && S.task.kind==='sell' && S.task.item===item.id) taskProg('sell', 1);
  S.c.sold++; S.c.byItem[item.id] = (S.c.byItem[item.id]||0)+1; S.c.guests++;
  // износ
  const wear = (1 - 0.03*rm.upg.machine) * (S.serviceContract?0.5:1) * modMul('wear');
  if(item.coffee) rm.eq.machine = Math.max(0, rm.eq.machine - 0.018*wear);
  if(card) rm.eq.terminal = Math.max(0, rm.eq.terminal - 0.007*wear);
  rm.eq.kkt = Math.max(0, rm.eq.kkt - 0.005*wear);
  addXp(1); taskProg('serve', 1); taskProg('earn', amount);
  return {amount, item, dessert};
}

/* ---------- поток гостей и пропускная способность ---------- */
function hourCurve(h){ if(h<6) return 0.25; if(h<8) return 0.7; if(h<10) return 1.6; if(h<12) return 1.0; if(h<14) return 1.3; if(h<17) return 0.9; if(h<19) return 1.2; if(h<21) return 0.8; return 0.55; }
function workingStaff(roomId){ return S.staff.filter(s=>s.room===roomId && (s.today==='work' || s.today==='sub') && !s.away && !(s.lateUntil && s.lateUntil > absNow()) && !(s.breakUntil && s.breakUntil > Date.now())); }
function staffSpeed(s){
  let f = (1 + 0.06*(s.lvl-1)) * (0.6 + s.mood*0.005) * (1 + 0.1*s.rank) * (1 - Math.max(0, s.fatigue-50)*0.006);
  if(s.quirk==='genius') f *= 1.25;
  if(s.quirk==='workaholic') f *= 1.1;
  if(s.legendId===3) f *= 1.3; if(s.legendId===5) f *= 1.6;
  if(s.boostUntil && s.boostUntil > Date.now()) f *= s.boostMul;
  return f;
}
function stats(roomId){
  const rm = room(roomId), u = rm.upg, def = roomDef(roomId);
  const w = WEATHER[S.weather];
  const wf = def.outdoor ? w.out : w.f;
  const h = S.gm/60;
  let lambda = (1/30) * (1+0.07*u.sign) * (1+0.04*u.decor) * (1+0.02*u.pets) * (1+0.015*tableCount(u.tables)) * (0.4+0.2*S.rep) * wf * hourCurve(h) * city().traffic * modMul('traffic') * (1+0.03*perk('word'));
  if(S.path==='chaos') lambda *= 1.2;
  const rivalDrag = S.rivals.filter(r=>r.status==='open').reduce((a,r)=>a + r.power*0.0018, 0);
  lambda *= Math.max(0.6, 1 - rivalDrag);
  if(!S.isOpen || S.closedUntil > absNow()) lambda = 0;
  const ws = workingStaff(roomId);
  const cashiers = ws.filter(s=>s.role==='Кассир' && !s.distract), baristas = ws.filter(s=>s.role==='Бариста' && !s.distract);
  const orderSpeed = cashiers.length ? cashiers.reduce((a,s)=>a+staffSpeed(s),0) : (baristas.length ? 0.5 : 0);
  const orderT = orderSpeed ? 3.2 / (1+0.15*u.register) / orderSpeed : Infinity;
  const prepSpeed = baristas.length ? baristas.reduce((a,s)=>a+staffSpeed(s),0) : 0;
  const prepT = 5 / (1+0.15*u.machine);
  const through = Math.min(orderT===Infinity?0:1/orderT, prepSpeed/prepT);
  return {lambda, orderT, prepT, prepSpeed, through, staff:ws};
}
function estCheck(roomId){
  const av = available(roomId); if(!av.length) return 0;
  const tw = av.reduce((a,m)=>a+m.w,0); let c = av.reduce((a,m)=>a+itemPrice(m,roomId)*m.w,0)/tw;
  if(isUnlocked('dessert')) c += dessertP(room(roomId).upg.showcase) * itemPrice(MENU.find(x=>x.id==='dessert'), roomId);
  return c;
}

    contract:'white', sched:'5/2', off:[5,6], phase:0, today:'off', consec:0, absences:0, recentAbs:0, legendId:0, spr:null, examAt:0, promise:0, notice:0, lastConflict:-99};
  return s;
}
function makeLegend(){
  const used = new Set(S.staff.map(s=>s.legendId));
  const opts = LEGENDS.map((l,i)=>i+1).filter(i=>!used.has(i)); if(!opts.length) return null;

function pickOffDays(role, roomId){
  const same = S.staff.filter(x=>x.room===roomId && x.role===role && x.sched==='5/2');
  let best = [5,6], bestScore = -1;
  for(let d=0; d<7; d++){ const pair = [d, (d+1)%7];
    const score = pair.reduce((a,wd)=>a + same.filter(x=>!x.off.includes(wd)).length, 0) - (same.length===0 && (d===5)?-2:0);
    if(score > bestScore){ bestScore = score; best = pair; } }
  return best;
}
function coverage(roomId, role){ return [0,1,2,3,4,5,6].map(wd=>{ const d = S.day + ((wd - weekday() + 7) % 7); return S.staff.filter(x=>x.room===roomId && x.role===role && x.today!=='sub' && scheduledToday(x, d)).length; }); }

      HOOK.event('quit', {sid:s.id, why, reason:pick(QUIT_REASONS[why])});
    }
  }
  // ссоры
  for(const r of S.rooms){ const ws = S.staff.filter(s=>s.room===r.id && s.today==='work'); if(ws.length>=2 && chance(0.05 + (ws.some(s=>s.quirk==='lover')?0.05:0) - (ws.some(s=>s.legendId===1)?0.05:0))){ const [a,b] = pickTwo(ws); HOOK.event('conflict', {sid:a.id, sid2:b.id}); } }

function promoInfo(s){
  if(s.rank >= 3) return {can:false, t:'Высшая должность'};
  const req = RANK_REQ[s.rank+1];
  const ok = s.shifts >= req.shifts && s.lvl >= req.lvl && req.f(s);
  const cool = s.examAt && s.examAt > S.day;
  return {can: ok && !cool, req, cool, t:req.t};
}
function tryPromote(s){
  const info = promoInfo(s); if(!info.can) return {ok:false, t:'Условия не выполнены'};
  if(info.req.exam){
    const p = clamp(0.35 + 0.05*(s.lvl - info.req.lvl) + s.mood/400 - s.fatigue/300, 0.1, 0.9);
    if(!chance(p)){ s.examAt = S.day + 3; s.mood = clamp(s.mood-12,0,100); return {ok:false, t:s.name+' завалил аттестацию. Пересдача через 3 дня.'}; }
  }
  s.rank++; S.c.promoted++; s.mood = clamp(s.mood+20,0,100);
  if(s.promise && s.rank >= s.promiseRank) s.promise = 0;
  return {ok:true, t:s.name+' теперь '+RANKS[s.rank].toLowerCase()+'.'};
}
function trainCost(s){ return Math.round(15000 * Math.pow(1.45, s.lvl-1) / 100) * 100; }
function trainInfo(s){
  if(s.lvl >= RANK_CAP[s.rank]) return {can:false, t:'Потолок для должности «'+RANKS[s.rank]+'». Нужно повышение'};
  if(s.shifts < s.lvl*2) return {can:false, t:'Нужно отработать смен: '+(s.lvl*2)+' (сейчас '+s.shifts+')'};
  if(s.trainNext) return {can:false, t:'Уже записан на обучение'};
  return {can:true, cost:trainCost(s)};
}

function breakdown(roomId, k){
  const rm = room(roomId); if(rm.broken[k]) return;
  rm.broken[k] = true; S.c.breakdowns++;
  HOOK.event('break_'+k, {room:roomId});
}

function inspectionResult(kind, mode){
  S.c.inspections++;
  const rm = room(S.active);
  let viol = 0, why = [];
  if(kind==='san'){ if(S.meters.chaos>45){ viol++; why.push('грязно'); } if(S.flags.expired){ viol++; why.push('просрочка'); } if(S.flags.goose){ viol++; why.push('гусь на кухне'); } if(rm.upg.clean<2){ viol += 0.5; } }
  if(kind==='tax'){ if(S.fin.noCheck>0){ viol += 2; why.push('продажи без чеков на '+fmtR(S.fin.noCheck)); } }
  if(kind==='fire'){ if(rm.upg.safety<1){ viol += 2; why.push('нет огнетушителя'); } else if(rm.upg.safety<3 && chance(0.3)){ viol++; why.push('загромождён выход'); } }
  if(kind==='labor'){ const grey = S.staff.filter(s=>s.contract==='grey'); if(grey.length){ viol += grey.length; why.push('неоформленные: '+grey.map(s=>s.name).join(', ')); } if(S.staff.some(s=>s.sched==='every')){ viol += 0.5; why.push('без выходных'); } }
  if(viol < 1 && chance(0.15)) { viol = 1; why.push('нашли, к чему придраться'); }
  let fine = 0, txt = '', fx = {};
  const base = kind==='tax' ? Math.max(10000, S.fin.noCheck*0.5) : kind==='labor' ? 10000*Math.max(1, Math.round(viol)) : RI(FINES[kind][0]/1000, FINES[kind][1]/1000)*1000;
  const lawyer = 1 - 0.1*perk('lawyer');
  if(mode==='bribe'){
    if(chance(0.5)){ fine = Math.round(base*0.35); txt = 'Инспектор взял конверт и ушёл, не глядя по сторонам.'; fx.chaos = 2; }
    else { fine = Math.round(base*2); txt = 'Инспектор оказался принципиальным. Штраф вдвое больше и протокол о попытке подкупа.'; fx.rep = -2; fx.pathos = 2; }
  } else if(viol < 1){
    txt = 'Нарушений не нашли. Инспектор даже взял капучино с собой.'; fx.rep = 1; S.c.passed++;
    if(mode==='treat') { fine = 260; txt = 'Нарушений не нашли. Пирожное съедено, протокол чистый.'; }
  } else {
    let mul = 1; if(mode==='treat') mul = chance(0.4) ? 0.5 : 1; if(mode==='lie' || mode==='stall') mul = chance(0.35) ? 0 : 1.5;
    fine = Math.round(base * mul * lawyer);
    txt = fine ? 'Нарушения: '+why.join(', ')+'. Штраф '+fmtR(fine)+'.' : 'Повезло: инспектор поверил и ушёл.';
    if(kind==='san' && viol>=2.5 && mode!=='lie'){ fx.close = 24; txt += ' Кофейню закрыли на сутки до устранения.'; }
    if(kind==='tax') S.fin.noCheck = 0;
  }
  if(fine){ spend(fine, 'fines'); S.c.fines++; S.c.finesSum += fine; S.c.daysNoFine = 0; }
  if(kind==='san') S.flags.expired = 0;
  return {txt, fx};
}
function dailyEventsRoll(){
  if(S.day < 4 || S.noInspectUntil > S.day) return;
  const comp = S.flags.complaint ? 3 : 1;
  const kinds = [['inspect_san', 1/40], ['inspect_tax', S.fin.noCheck>0 ? 1/6 : 1/55], ['inspect_fire', 1/60], ['inspect_labor', S.staff.some(s=>s.contract==='grey') ? 1/30 : 1/80]];
  for(const [id, p] of kinds){ if(chance(p*comp)){ S.pending.push({at:absNow()+RI(60, hoursOpen()*50), ev:id}); S.flags.complaint = 0; break; } }
  // обычные бытовые неприятности
  if(chance(0.08)) S.pending.push({at:absNow()+RI(30,400), ev:pick(['flood','sewer','roaches','power','pricehike','landlord','fakebill'])});
}

function rivalsDay(){

    const base = RIVALS.find(x=>x.id===r.id);
    r.power = clamp(r.power + R(-2,2) - (S.rep-3)*0.6 - S.level*0.03, 0, 100);
    if(r.status==='open'){
      if(r.power < 12 && chance(0.3)){ r.status = 'sale'; r.ask = Math.round(roomPrice(r)/1000)*1000; HOOK.event('rival_sale', {rid:r.id}); continue; }
      if(chance(0.07)){ const act = r.rel < -20 ? pick(['promo','fake','complain','poach']) : r.rel > 40 ? pick(['coop','coop','promo']) : pick(['promo','poach','coop','fake']);

        if(act==='fake'){ repAdd(-0.15); HOOK.toast('«'+base.n+'» накидали вам фейковых отзывов'); }
        if(act==='complain'){ S.flags.complaint = 1; HOOK.toast('Похоже, на вас пожаловались. Жди проверку'); }
        if(act==='poach'){ const st = S.staff.filter(s=>s.lvl>=4 && !s.legendId); if(st.length) HOOK.event('poach', {sid:pick(st).id, rid:r.id}); }
        if(act==='coop'){ HOOK.event('rival_coop', {rid:r.id}); }

  }
}

function rivalTalk(rid, i){
  const r = S.rivals.find(x=>x.id===rid), base = RIVALS.find(x=>x.id===rid), pt = PITCH[i];
  if(r.talkDay === S.day && !pt.wait) return 'Сегодня с ним уже говорили. Попробуй завтра.';
  r.talkDay = S.day;
  if(pt.m){ if(!canSpend(-pt.m)) return 'Не хватает денег на ужин'; spend(-pt.m, 'other'); }
  if(pt.chaos) meter('chaos', pt.chaos);
  if(pt.wait){ r.ask = Math.round(r.ask*(1+pt.ask)/1000)*1000; return 'Подождали. Цена снизилась до '+fmtR(r.ask)+'.'; }

function rivalOffer(rid, frac){

  r.rel = clamp(r.rel - 6, -100, 100);

function fillText(str, inc){
  const st = inc.sid ? S.staff.find(x=>x.id===inc.sid) : null, st2 = inc.sid2 ? S.staff.find(x=>x.id===inc.sid2) : null;
  const rv = inc.rid ? RIVALS.find(x=>x.id===inc.rid) : null;
  return String(str).replace(/\{s\}/g, st?st.name:(inc.sname||'Сотрудник')).replace(/\{s2\}/g, st2?st2.name:'коллега').replace(/\{reason\}/g, inc.reason||'').replace(/\{rival\}/g, rv?rv.n:'Соседи').replace(/\{room\}/g, inc.room||'');
}
function evDef(inc){ return inc.id==='absurd' ? absurdDef(inc) : EV[inc.id]; }
function pushIncident(id, data){
  data = data || {};
  const d = EV[id]; if(!d && id!=='absurd') return;
  if(id==='conflict') data.reason = pick(CONFLICT_REASONS);
  if(id==='revenge') data.reason = pick(REVENGE);
  if(id==='rival_promo' || id==='rival_coop' || id==='rival_sale'){ if(!data.rid) data.rid = pick(RIVALS).id; }
  const inc = Object.assign({uid:S.uid++, id, at:Date.now(), atG:absNow()}, data);
  if(inc.sid){ const s = S.staff.find(x=>x.id===inc.sid); if(s) inc.sname = s.name; }
  if(d && d.auto){ applyFx(d.auto, inc); HOOK.modal({kind:'result', inc}); return; }
  if(S.incidents.length >= 5) expireIncident(S.incidents.find(i=>EV[i.id] && EV[i.id].cat!=='inspect') || S.incidents[0]);
  S.incidents.push(inc);
  HOOK.sfx('alert'); HOOK.struct();
  const urgent = d && (d.cat==='inspect' || d.cat==='staff' || d.cat==='break' || d.cat==='money');
  if(urgent) HOOK.modal({kind:'inc', uid:inc.uid, auto:true});
}
HOOK.event = pushIncident;
function expireIncident(inc){
  if(!inc) return;
  const d = evDef(inc);
  S.incidents = S.incidents.filter(x=>x!==inc);
  // если долго не решали: проверки и кадры решаются по умолчанию, остальное — мелкий штраф к рейтингу и бардак
  if(d && d.o){
    if(d.cat==='inspect' || d.cat==='break' || d.cat==='money') resolveIncident(inc, 0, true);
    else if(inc.id==='quit') resolveIncident(inc, 0, true);
    else if(inc.id==='absent' || inc.id==='conflict'){ resolveIncident(inc, inc.id==='absent'?2:2, true); }
    else { applyFx({chaos:2, rep:-1}, inc); }

function resolveIncident(inc, i, auto){
  const d = evDef(inc); const o = d.o[i];
  S.incidents = S.incidents.filter(x=>x!==inc);
  let out = o.out || '';
  let fx = o.fx || {};
  if(o.p !== undefined && !chance(o.p)){ out = o.fail || out; fx = {fire:1, quit:1}; }
  if(o.buyNow){ const k = o.buyNow; const err = orderStock(k, 3, true); if(err) out = err; }
  const r = applyFx(fx, inc);
  if(r.out) out = r.out;
  if(o.then){ for(const t of o.then){
    let p = t.p; if(t.cond==='rep4') p = S.rep >= 4 ? 1 : 0;
    if(p===-1) continue;
    if(chance(p)){ S.pending.push({at:absNow()+RI(t.after[0], t.after[1]), ev:t.ev, fx:t.fx, note:t.note, data:{rid:inc.rid}}); break; }
  } }
  if(inc.id==='absurd') S.c.absurd++;
  if(!auto) addXp(8);
  HOOK.struct();
  return {out: fillText(out, inc), chips:r.chips, title: fillText(d.t, inc)};
}
function processPending(){
  const now = absNow();

  if(!due.length) return;
  S.pending = S.pending.filter(p=>p.at>now);
  for(const p of due){
    if(p.ev) pushIncident(p.ev, p.data||{});
    else if(p.fx){ const r = applyFx(p.fx, p.data||{}); HOOK.modal({kind:'note', title:p.note || 'Последствия', chips:r.chips}); }
  }
}
function scheduleEvents(nowReal){
  if(!S.isOpen) return;
  if(!S.nextEv) S.nextEv = nowReal + 6*60000;
  if(!S.nextAbsurd) S.nextAbsurd = nowReal + 18*60000;
  if(nowReal >= S.nextEv){
    S.nextEv = nowReal + R(14, 24)*60000;
    const pool = ['blogger','dog','laptop','school','critic','milk_out','courier','fakebill'].filter(id=>!S.incidents.some(x=>x.id===id) && (!EV[id].cond || EV[id].cond(S)));
    if(pool.length) pushIncident(pick(pool));
  }
  if(nowReal >= S.nextAbsurd){ S.nextAbsurd = nowReal + R(30, 50)*60000; const a = makeAbsurd(); pushIncident('absurd', a); }
  // поломки техники по износу — раз в игровой час
  for(const r of S.rooms){ for(const k of ['machine','terminal','kkt']){ if(!r.broken[k] && r.eq[k] < 40 && chance((40 - r.eq[k])/400/60)) breakdown(r.id, k); } if(!r.broken.fridge){ r.eq.fridge = Math.max(0, r.eq.fridge - 0.0006*(S.serviceContract?0.5:1)); if(r.eq.fridge<40 && chance((40-r.eq.fridge)/400/60)) breakdown(r.id,'fridge'); } }
}

let gAcc = 0;
function advanceGameMinutes(n){
  for(let i=0;i<n;i++){
    S.gm++;
    const o = S.hours.open*60, c = S.hours.close*60;
    if(S.gm >= DAY_MIN){ if(S.isOpen && c===DAY_MIN) closeDay(); S.gm = 0; midnight(); }
    const should = S.gm >= o && S.gm < c;
    if(should && !S.isOpen) openDay(); else if(!should && S.isOpen) closeDay();
    if(S.gm % 60 === 0){ hourly(); }
    // опоздуны, обиженные
    for(const s of S.staff){ if(s.awayUntil && s.awayUntil <= absNow()){ s.away = false; s.awayUntil = 0; } }
    processPending();
  }
}
function hourly(){
  deliver();
  if(S.isOpen){
    for(const s of S.staff){ if(s.today==='work'){ s.mood = clamp(s.mood - 0.4, 0, 100); s.pat = clamp(s.pat + 3, 0, 100); } }
    const cleaners = S.staff.filter(s=>s.role==='Уборщик' && s.today==='work').reduce((a,s)=>a+(s.legendId===1?3:1),0);
    const cl = S.rooms.reduce((a,r)=>a+r.upg.clean,0)/S.rooms.length;
    meter('chaos', -(0.3 + 0.12*cl + 0.9*cleaners) + 0.05*S.rooms.length);
    const target = clamp(3.0 + avgUpg('decor')*0.05 + avgUpg('menu')*0.03 + (S.path==='soul'?0.3:0) - S.meters.chaos*0.01 + (S.staff.some(s=>s.quirk==='bore')?0.1:0), 1, 5);
    S.rep += (target - S.rep) * 0.03;
  }
  S.c.earnedRun = S.c.earnedRun || 0;
}

/* Офлайн: прогон экономики по агрегированным шагам */
function simulateOffline(realMs){
  const capped = Math.min(realMs, 12*3600*1000);
  const steps = Math.floor(capped / 60000);
  const eff = 0.6;
  const before = S.money, guests0 = S.c.guests;
  HOOK.quiet = true;
  for(let i=0;i<steps;i++){
    const gmins = 60000 / REAL_PER_GMIN;
    gAcc += gmins; const whole = Math.floor(gAcc); gAcc -= whole; advanceGameMinutes(whole);
    if(S.isOpen && S.closedUntil <= absNow()){
      for(const r of S.rooms){ const st = stats(r.id); let n = Math.min(st.lambda, st.through) * 60 * eff; let k = Math.floor(n) + (chance(n%1)?1:0);
        for(let j=0;j<k;j++){ const res = sellOne(r.id); if(res.fail){ S.c.angry++; break; } } }
    }
    // нерешённые события решаются сами
    for(const inc of S.incidents.slice()) if(Date.now() - inc.at > 20*60000) expireIncident(inc);
  }
  HOOK.quiet = false;
  return {money:S.money-before, guests:S.c.guests-guests0, mins:Math.round(capped/60000)};
}

function moveTo(e, tx, ty, sp, dt){
  const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx,dy);
  if(d < 1){ e.x = tx; e.y = ty; e.walk = false; return true; }
  const s = Math.min(d, sp*dt); e.x += dx/d*s; e.y += dy/d*s; e.walk = true; if(Math.abs(dx) > 0.5) e.flip = dx > 0; return false;
}
function pickGuestSprite(){
  const rm = room(S.active); const dec = rm.upg.decor;
  const allowRare = dec >= 6, allowLeg = dec >= 14 && S.rep >= 4.3;
  const roll = Math.random();
  const want = allowLeg && roll < 0.012 ? 2 : allowRare && roll < 0.12 ? 1 : 0;
  const kid = chance(0.1);
  const pool = (kid ? KIDS : GUESTS).filter(i=>RARITY['g'+i]===want);
  return {spr: pick(pool.length ? pool : (kid?KIDS:GUESTS).filter(i=>RARITY['g'+i]===0)), kid};
}
function pickPet(){
  const rm = room(S.active); const allowRare = rm.upg.pets >= 5 || rm.upg.decor >= 8, allowLeg = rm.upg.pets >= 12 && S.rep >= 4.3;
  const roll = Math.random(); const want = allowLeg && roll < 0.05 ? 2 : allowRare && roll < 0.3 ? 1 : 0;
  const pool = PETS.filter(i=>RARITY['p'+i]===want); return pick(pool.length ? pool : PETS.filter(i=>RARITY['p'+i]===0));
}
function markSeen(k, i){ if(!S.seen[k].includes(i)){ S.seen[k].push(i); const rar = RARITY[k+i]; if(rar>=1) toast((k==='g'?'Новый гость в книге: ':'Новый питомец в книге: ')+RNAME[rar].toLowerCase()); structDirty = true; } }
function spawnGuest(id, reg){
  const r = rt(id);
  if(r.queue.length >= 7){ meter('chaos', 0.3); return; }
  let g;
  if(reg){ const def = REGULARS.find(x=>x.id===reg.id); if(reg.spr==null) reg.spr = pick(def.pool==='old' ? POOL.old : POOL.guest); g = {spr:reg.spr, h:46, reg:reg.id, name:def.n}; }
  else { const p = pickGuestSprite(); g = {spr:p.spr, h:p.kid?34:46}; markSeen('g', p.spr); }
  Object.assign(g, {x:DOOR[0], y:DOOR[1]+R(-6,6), state:'toQueue', prog:0, flip:false, t:Math.random()*10, walk:true, pet:null, wait:0,
    patience: (55 + room(id).upg.decor*2.5) * (S.path==='soul'?1.3:1) * (workingStaff(id).some(s=>s.quirk==='talker')?1.2:1) * (workingStaff(id).some(s=>s.quirk==='bore')?0.85:1)});
  if(!reg && chance(0.12)){ const p = pickPet(); g.pet = {spr:p, h:petH(p), x:g.x+14, y:g.y+4, flip:false, t:0}; markSeen('p', p); }
  r.guests.push(g); r.queue.push(g);
}
function guestLeaves(id, g, why){
  const r = rt(id);
  r.queue = r.queue.filter(x=>x!==g); r.pickup = r.pickup.filter(x=>x!==g); r.pickup.forEach((x,i)=>x.pi=i);
  g.state = 'leave'; g.angry = why;
  S.c.angry++; repAdd(-0.006);
  if(S.task && S.task.kind==='noangry') S.task.failed = true;
  if(g.reg){ const rg = S.regs.find(x=>x.id===g.reg); rg.loyal = clamp(rg.loyal - 8, 0, 100); if(rg.loyal <= 10 && !rg.gone){ rg.gone = true; toast(g.name+' ушёл к конкурентам насовсем'); } }
}
function simRoom(id, dt){
  const r = rt(id), st = stats(id), rm = room(id);
  const open = S.isOpen && S.closedUntil <= absNow();
  if(open){
    r.spawnT -= dt;
    if(r.spawnT <= 0){ if(st.lambda > 0) spawnGuest(id); r.spawnT = clamp(-Math.log(1-Math.random()) / Math.max(st.lambda, 0.002), 1.5, 90); }
    // постоянные гости
    const h = S.gm/60;
    for(const rg of S.regs){ if(rg.gone || r.regDay[rg.id]===S.day || id!=='main') continue; const def = REGULARS.find(x=>x.id===rg.id); if(h>=def.hour[0] && h<def.hour[1] && chance(dt/240)){ r.regDay[rg.id] = S.day; spawnGuest(id, rg); if(rg.loyal>=80 && chance(S.path==='soul'?0.7:0.45)) setTimeout(()=>spawnGuest(id), 1500); } }
  }
  r.queue.forEach((g,i)=>{ g.qx = QUEUE_X + i*24; });
  const head = r.queue[0];
  if(head && head.state==='queue' && Math.hypot(head.x-QUEUE_X, head.y-QUEUE_Y) < 2 && st.orderT < Infinity){
    head.prog += dt / st.orderT;
    if(head.prog >= 1) completeOrder(id, head, false);
  }
  for(const g of r.queue){ if(g.state==='queue' || g.state==='toQueue'){ g.wait += dt; if(g.wait > g.patience) { guestLeaves(id, g, 'wait'); } } }
  // приготовление
  const baristas = workingStaff(id).filter(s=>s.role==='Бариста');
  for(const b of baristas){ const p = r.staff[b.id]; if(p) p.prog = 0; }
  for(const j of r.jobs){ if(j.by && !baristas.some(b=>b.id===j.by && !b.distract)) j.by = null; }
  for(const b of baristas){ if(b.distract) continue; if(!r.jobs.some(j=>j.by===b.id)){ const j = r.jobs.find(j=>!j.by); if(j) j.by = b.id; } }
  for(const j of r.jobs.slice()){
    let sp;
    if(j.by){ const b = S.staff.find(s=>s.id===j.by); sp = staffSpeed(b); if(r.staff[j.by]) r.staff[j.by].prog = j.p; }
    else if(!baristas.length && r.jobs.indexOf(j)===0) sp = 0.25; else continue;
    if(rm.broken.machine && j.coffee) sp = 0;
    j.p += dt * sp * (1+0.15*rm.upg.machine) / 5;
    if(j.p >= 1) finishJob(id, j);
  }
  const waiters = workingStaff(id).filter(s=>s.role==='Официант' && !s.distract);
  for(const g of r.guests){
    g.t += dt;
    if(g.state==='toQueue' || g.state==='queue'){ const idx = r.queue.indexOf(g); if(moveTo(g, QUEUE_X + idx*24, QUEUE_Y + (idx%2)*3, 46, dt)) g.state = 'queue'; }
    else if(g.state==='toPick'){ const p = PICK[Math.min(g.pi, PICK.length-1)]; if(moveTo(g, p[0], p[1], 46, dt)) g.state = 'wait'; }
    else if(g.state==='toSeat'){ const t = TABLE_SLOTS[g.seat]; if(moveTo(g, t[0]-18, t[1]-2, 46, dt)){ g.state = 'sit'; g.flip = true; g.sit = R(16,30) * (waiters.length ? 0.75 : 1); } }
    else if(g.state==='sit'){ g.sit -= dt; if(g.sit <= 0){ r.seats[g.seat] = null; g.state = 'leave'; } }
    else if(g.state==='leave'){ if(moveTo(g, DOOR[0]+10, DOOR[1], 50, dt)) g.gone = true; }
    if(g.pet){ const p = g.pet; p.t += dt; moveTo(p, g.x + (g.flip?-14:14), g.y + 3, 60, dt); }
  }
  r.guests = r.guests.filter(g=>!g.gone);
  // поведение персонала
  const now = Date.now();
  for(const s of workingStaff(id)){
    const p = r.staff[s.id]; if(!p) continue; p.t += dt;
    if(s.distract && s.distract.until < now) s.distract = null;
    if(s.breakUntil && s.breakUntil < now){ s.breakUntil = 0; s.away = false; }
    const gone = (s.distract && s.distract.kind==='smoke') || s.breakUntil > now;
    if(gone){ moveTo(p, DOOR[0]+20, p.walker?DOOR[1]:FEET, 55, dt); continue; }
    if(p.walker){
      if(moveTo(p, p.tx, p.ty, 34, dt)){ p.idle = (p.idle||0) - dt;
        if(p.idle <= 0){ p.idle = R(1.5,4);
          if(s.role==='Официант'){ const occ = r.seats.map((g,i)=>g?i:-1).filter(i=>i>=0); const t = occ.length ? TABLE_SLOTS[pick(occ)] : pick(TABLE_SLOTS.slice(0,r.seats.length)); p.tx = t[0]+16; p.ty = t[1]+4; }
          else { p.tx = R(30,330); p.ty = R(180,292); } } }
    } else moveTo(p, p.home[0], p.home[1], 55, dt);
  }
  for(const p of r.pets){ p.t += dt; if(moveTo(p, p.tx, p.ty, 18, dt)){ p.idle -= dt; if(p.idle<=0){ p.idle = R(3,9); p.tx = R(30,330); p.ty = R(175,292); } } }
}
function completeOrder(id, g, tapped){
  const r = rt(id);
  const res = sellOne(id);
  r.queue.shift();
  if(res.fail){ guestLeaves(id, g, res.fail); return; }
  let amt = res.amount;
  if(tapped){ const tip = Math.round(amt*0.05); income(tip); amt += tip; }
  flyMoney(g.x, g.y - g.h - 4, amt);
  sfx('coin');
  if(g.reg){ const rg = S.regs.find(x=>x.id===g.reg); rg.loyal = clamp(rg.loyal + (g.wait < 20 ? 4 : 1), 0, 100); S.c.regularsMax = Math.max(S.c.regularsMax, rg.loyal); }
  g.item = res.item.n;
  g.pi = r.pickup.length; r.pickup.push(g); g.state = 'toPick'; g.prog = 0;
  r.jobs.push({g, p:0, by:null, coffee:!!res.item.coffee});
}
function finishJob(id, j){
  const r = rt(id);
  r.jobs = r.jobs.filter(x=>x!==j);
  if(j.by && r.staff[j.by]) r.staff[j.by].prog = 0;
  const g = j.g; r.pickup = r.pickup.filter(x=>x!==g); r.pickup.forEach((x,i)=>x.pi=i);
  const free = r.seats.map((s,i)=>s?-1:i).filter(i=>i>=0);
  if(free.length && chance(0.75)){ g.seat = pick(free); r.seats[g.seat] = g; g.state = 'toSeat'; } else g.state = 'leave';
}
function flyMoney(lx, ly, amt){
  const cvR = cv.getBoundingClientRect(); const mEl = $('#sMoney');
  if(!mEl || !cvR.width || document.hidden) return;
  const sx = cvR.left + lx/W*cvR.width, sy = cvR.top + ly/H*cvR.height;
  const mR = mEl.getBoundingClientRect(); const tx = mR.left + mR.width*0.6, ty = mR.top + mR.height/2;
  const f = el(`<div class="fly">+${fmt(amt)} ₽</div>`); f.style.left = sx+'px'; f.style.top = sy+'px'; document.body.appendChild(f);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim = f.animate([
    {transform:'translate(-50%,-50%) scale(.8)', opacity:0},
    {transform:'translate(-50%,-150%) scale(1)', opacity:1, offset:.25},
    {transform:'translate(-50%,-170%) scale(1)', opacity:1, offset:.5},
    {transform:`translate(calc(-50% + ${tx-sx}px), calc(-50% + ${ty-sy}px)) scale(.6)`, opacity:.9}], {duration: reduce?400:1150, easing:'cubic-bezier(.4,0,.2,1)'});
  anim.onfinish = () => { f.remove(); const m = $('#sMoney'); if(m){ m.classList.remove('pulse'); void m.offsetWidth; m.classList.add('pulse'); } };
}

let actx = null, soundOn = true;
function unlockAudio(){ if(actx || !soundOn) return; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f, d, type, v, delay){ if(!actx || !soundOn) return; const t = actx.currentTime + (delay||0); const o = actx.createOscillator(), g = actx.createGain(); o.type = type||'sine'; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v||0.08, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02); }
function sfx(k){ if(!actx || !soundOn || document.hidden || HOOK.quiet) return;
  if(k==='coin'){ tone(1320,0.08,'square',0.03); tone(1760,0.14,'square',0.03,0.07); }
  else if(k==='buy'){ tone(520,0.07,'triangle',0.07); tone(780,0.1,'triangle',0.07,0.06); tone(1040,0.14,'triangle',0.06,0.12); }
  else if(k==='tap'){ tone(700,0.04,'triangle',0.05); }
  else if(k==='alert'){ tone(440,0.12,'sawtooth',0.04); tone(330,0.16,'sawtooth',0.04,0.12); }
  else if(k==='level'){ [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.06,i*0.09)); }
  else if(k==='bad'){ tone(200,0.2,'sawtooth',0.05); } }

function snapshot(){ S.savedAt = Date.now(); S.sound = soundOn; const copy = Object.assign({}, S); return JSON.stringify(copy, (k,v)=> k==='distract' ? undefined : v); }
function save(){ if(!S) return; try{ localStorage.setItem(KEY, snapshot()); }catch(e){} }
function cloudOK(){ return tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'); }
function saveCloud(){ if(!S || !cloudOK()) return; const js = snapshot(); const parts = []; for(let i=0;i<js.length;i+=3900) parts.push(js.slice(i,i+3900)); if(parts.length > 200) return;
  try{ parts.forEach((p,i)=>tg.CloudStorage.setItem('bc3_'+i, p)); tg.CloudStorage.setItem('bc3_n', String(parts.length)); }catch(e){} }
function loadLocal(){ try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function loadCloud(cb){ if(!cloudOK()) return cb(null);
  try{ tg.CloudStorage.getItem('bc3_n', (err, n)=>{ n = parseInt(n,10); if(err || !n) return cb(null); const keys = Array.from({length:n},(_,i)=>'bc3_'+i); const out = {}; let left = Math.ceil(n/50);
    for(let i=0;i<n;i+=50){ tg.CloudStorage.getItems(keys.slice(i,i+50), (e2, vals)=>{ if(vals) Object.assign(out, vals); if(--left===0){ try{ cb(JSON.parse(keys.map(k=>out[k]||'').join(''))); }catch(x){ cb(null); } } }); } }); }catch(e){ cb(null); } }

function catchUp(){
  const gap = Date.now() - (S.savedAt||Date.now());
  if(gap < 90000) return;
  const before = {money:S.money, day:S.day, staff:S.staff.length};
  const r = simulateOffline(gap);
  for(const id in RT){ RT[id].guests = []; RT[id].queue = []; RT[id].pickup = []; RT[id].jobs = []; RT[id].seats = RT[id].seats.map(()=>null); }
  queueModal({kind:'away', mins:r.mins, money:r.money, guests:r.guests, days:S.day-before.day, gone:before.staff - S.staff.length, capped: gap > 12*3600*1000});
  quietModals.splice(0).forEach(m=>queueModal(m));
}

      <div class="row wrap"><span class="t">${esc(c.name)}</span><span class="tag">${c.role}</span><span class="tag num">ур. ${c.lvl}</span>${c.legendId?'<span class="tag gold">Легенда</span>':''}${c.quirk!=='none'?`<span class="tag">${QUIRKS[c.quirk].n}</span>`:''}</div>
      <div class="d">${c.legendId?esc(LEGENDS[c.legendId-1].legend):esc(ROLES[c.role].d)}${c.quirk!=='none'?' '+esc(QUIRKS[c.quirk].d):''}</div>
      <div class="d">Смена: ${fmt(shiftPay(Object.assign({}, c, {contract:'white'})))} ₽ официально или ${fmt(shiftPay(Object.assign({}, c, {contract:'grey'})))} ₽ в серую</div>
      <div class="row">${full?'<span class="tag">Мест на эту роль нет</span>':btnHtml('Оформить', hireCost(c), false)+btnHtml('В серую', hireCost(c)*0.7, false, 'ghost')}</div></div></div>`);

  if(!S.cands.length) p.appendChild(el(`<div class="empty">Кандидаты закончились. Новые придут завтра.</div>`));
  p.appendChild(el(`<div class="empty" style="font-size:12px">Оформление стоит две смены: медкнижка, документы. В серую дешевле, но трудовая инспекция и обиженные сотрудники могут устроить проблемы.</div>`));
}
function doHire(c, id, contract, cost){
  if(S.money < cost) return;
  spend(Math.round(cost), 'other'); hire(c, id, contract); syncScene(id); sfx('buy'); toast(c.name+' в команде. Выходные: '+c.off.map(d=>WEEKDAYS[d]).join(', ')); save(); structDirty = true; renderPanel();
}

/* ---------- склад ---------- */
function renderStock(p, id){
  p.appendChild(el(`<div class="h">Склад</div>`));
  const low = lowStock();
  Object.keys(STOCK).forEach(k=>{
    if(k==='matcha' && !isUnlocked('matcha')) return;
    if(k==='food' && !isUnlocked('breakfast') && !isUnlocked('shawarma')) return;
    if(k==='desserts' && !isUnlocked('dessert')) return;
    const st = STOCK[k], q = stockQty(k), cap = stockCap(k);
    const pend = S.orders.filter(o=>o.k===k);
    const price = Math.round(st.price*supplyMul());
    const card = el(`<div class="card"><div class="row"><span class="t">${st.n}</span><span class="sp"></span><span class="tag num ${low.includes(k)?'warn':''}">${st.show(q)} из ${st.show(cap)}</span></div>
      ${bar(q/cap*100, low.includes(k)?'var(--bad)':'var(--caramel)')}
      <div class="d">Упаковка ${st.packN}: ${fmt(price)} ₽${st.perish?' · хранится '+st.perish+' дн.':''}${pend.length?' · в пути: '+st.show(pend.reduce((a,o)=>a+o.q,0)):''}</div>
      <div class="row wrap">${btnHtml('1 уп.', price, false)}${btnHtml('5 уп. −8%', price*5*0.92, false, 'ghost')}${btnHtml('Срочно +35%', price*1.35, false, 'ghost')}</div></div>`);
    const bs = card.querySelectorAll('button');
    const go = (n, ex) => { const err = orderStock(k, n, ex); if(err) toast(err); else { toast(ex ? 'Срочная доставка через 3 игровых часа' : 'Доставка к открытию'); sfx('buy'); } save(); structDirty = true; renderPanel(); renderHud(); };
    bs[0].onclick = () => go(1); bs[1].onclick = () => go(5); bs[2].onclick = () => go(1, true);
    p.appendChild(card);
  });
  // автозаказ и сервис
  const auto = el(`<div class="card"><div class="row"><span class="t">Договор с поставщиком</span><span class="sp"></span>${S.autoOrder?'<span class="tag g">Подключён</span>':''}</div><div class="d">Каждую ночь поставщик сам довозит то, что заканчивается. Управляющий зала тоже умеет делать заказы.</div>${S.autoOrder?'':'<div class="row">'+btnHtml('Подписать за 60 000 ₽', 60000, false)+'</div>'}</div>`);
  const ab = auto.querySelector('button'); if(ab) ab.onclick = () => { if(S.money<60000) return; spend(60000,'other'); S.autoOrder = true; toast('Автозаказ подключён'); sfx('buy'); save(); renderPanel(); };
  p.appendChild(auto);
  p.appendChild(el(`<div class="h">Техника · ${esc(roomDef(id).n)}</div>`));
  const rm = room(id);
  const eq = el(`<div class="card"><div class="eq">${Object.keys(EQ).map(k=>`<span>${EQ[k].n}</span>${bar(rm.eq[k], rm.broken[k]?'var(--bad)':rm.eq[k]<40?'var(--bad)':rm.eq[k]<70?'var(--caramel)':'var(--good)')}<b class="num">${rm.broken[k]?'сломано':Math.round(rm.eq[k])+'%'}</b>`).join('')}</div>
    <div class="d">Ниже 40% техника начинает ломаться. Обслуживание дешевле ремонта.</div>
    <div class="row wrap">${btnHtml('Обслужить всё: '+fmt(serviceCost(rm))+' ₽', serviceCost(rm), serviceCost(rm)<=0)}${S.serviceContract?'<span class="tag g">Сервисный договор</span>':btnHtml('Сервисный договор 90 000 ₽', 90000, false, 'ghost')}</div></div>`);
  const eb = eq.querySelectorAll('button');
  if(eb[0]) eb[0].onclick = () => { if(doService(rm)){ toast('Техника обслужена'); sfx('buy'); save(); renderPanel(); } };
  if(eb[1]) eb[1].onclick = () => { if(S.money<90000) return; spend(90000,'other'); S.serviceContract = true; toast('Износ техники вдвое медленнее'); save(); renderPanel(); };
  p.appendChild(eq);
  Object.keys(EQ).forEach(k=>{ if(rm.broken[k]){ const b = el(`<div class="card"><div class="t">${EQ[k].n}: сломано</div><div class="row wrap">${btnHtml('Сервис '+fmt(EQ[k].fix)+' ₽', EQ[k].fix, false)}${btnHtml('Мастер по объявлению '+fmt(EQ[k].fix/3)+' ₽', EQ[k].fix/3, false, 'ghost')}</div></div>`);
    const bb = b.querySelectorAll('button'); bb[0].onclick = () => { const r = applyFx({repair:[k,'full']}, {room:id}); toast('Починили'); save(); renderPanel(); }; bb[1].onclick = () => { const r = applyFx({repair:[k,'cheap']}, {room:id}); toast(r.chips[0]?r.chips[0][0]:'Готово'); save(); renderPanel(); }; p.appendChild(b); } });

/* ---------- деньги ---------- */
const FIN_ROWS = [['rev','Выручка',1],['acq','Эквайринг 2%',-1],['supply','Закупки',-1],['wages','Зарплаты',-1],['rent','Аренда',-1],['util','Коммуналка',-1],['tax','Налог УСН',-1],['repairs','Ремонт и ТО',-1],['fines','Штрафы',-1],['other','Прочее',-1]];
function cashFlow(f){ return f.rev - f.acq - f.supply - f.wages - f.rent - f.util - f.tax - f.repairs - f.fines - f.other; }
function renderFin(p){
  const t = S.fin.today, y = S.fin.hist[0];
  const week = S.fin.hist.slice(0,7);
  const sum = k => week.reduce((a,f)=>a+(f[k]||0),0);
  p.appendChild(el(`<div class="h">Деньги</div>`));
  const tbl = el(`<div class="card"><div class="fin"><span></span><b>Сегодня</b><b>Вчера</b><b>7 дней</b>${FIN_ROWS.map(([k,n,sg])=>`<span>${n}</span><i class="num">${fmt((sg<0?-1:1)*t[k])}</i><i class="num">${y?fmt((sg<0?-1:1)*y[k]):'—'}</i><i class="num">${week.length?fmt((sg<0?-1:1)*sum(k)):'—'}</i>`).join('')}
    <span class="tot">Итого</span><i class="num tot">${fmt(cashFlow(t))}</i><i class="num tot">${y?fmt(cashFlow(y)):'—'}</i><i class="num tot">${week.length?fmt(week.reduce((a,f)=>a+cashFlow(f),0)):'—'}</i></div>
    <div class="d">Покупка улучшений и найм идут в «Прочее». Списано просрочки сегодня: ${fmt(t.spoil)} ₽. Гостей сегодня: ${t.guests}.</div></div>`);
  p.appendChild(tbl);
  p.appendChild(el(`<div class="card"><div class="row"><span class="t">Налог УСН 6%</span><span class="sp"></span><span class="tag num">${fmt(S.fin.taxAcc)} ₽</span></div><div class="d">Уплата через ${Math.max(0,S.fin.taxDueDay - S.day)} игр. дн. (раз в игровой месяц). Деньги на налог лучше не тратить.</div>${S.fin.noCheck>0?`<div class="d" style="color:var(--bad)">Продано без чеков: ${fmt(S.fin.noCheck)} ₽. Налоговая может прийти.</div>`:''}</div>`));
  const rentDay = S.rooms.reduce((a,r)=>a+roomDef(r.id).rent*city().rent*modMul('rent'),0);
  p.appendChild(el(`<div class="card"><div class="t">Постоянные расходы в день</div><div class="d">Аренда ${fmt(rentDay)} ₽ · коммуналка ≈${fmt(S.rooms.reduce((a,r)=>a+(350+45*hoursOpen())*roomMult(r.id),0))} ₽ · зарплаты сегодняшней смены ≈${fmt(S.staff.filter(s=>s.today==='work'||s.today==='sub').reduce((a,s)=>a+(s.today==='sub'?s.subPay:shiftPay(s)),0))} ₽</div></div>`));
  if(S.debt.stage>0 || S.debt.loan>0 || S.money<0){
    const d = el(`<div class="card" style="border-color:var(--bad)"><div class="t">Долги</div><div class="d">Дней в минусе подряд: ${S.debt.daysNeg}. ${['','Поставщики работают только по предоплате.','Звонят коллекторы.','Арендодатель забрал зал.'][S.debt.stage]||''} После 14 дней в минусе — банкротство.</div>${S.debt.loan>0?`<div class="d">Долг «серьёзным людям»: ${fmt(S.debt.loan)} ₽, каждый день 4% платежа.</div><div class="row">${btnHtml('Погасить долг', S.debt.loan, false)}</div>`:''}</div>`);
    const lb = d.querySelector('button'); if(lb) lb.onclick = () => { if(S.money < S.debt.loan) return; spend(S.debt.loan,'other'); S.debt.loan = 0; toast('Долг погашен. Люди в кожанках больше не заходят'); save(); renderPanel(); };
    p.appendChild(d);
  }
  // часы работы
  const maxClose = S.level >= 18 ? 24 : 23;
  const hrs = el(`<div class="card"><div class="t">Часы работы</div><div class="d">Дольше открыт — больше выручки, но смены длиннее: сотрудники устают быстрее, а зарплата и коммуналка выше.${S.level<18?' Работа до полуночи и круглосуточно открывается на 18 уровне.':''}</div>
    <div class="row wrap"><label class="d">Открытие <select id="hOpen">${[0,6,7,8,9,10].filter(h=>h>0||S.level>=18).map(h=>`<option value="${h}" ${h===S.hours.open?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></label>
    <label class="d">Закрытие <select id="hClose">${[20,21,22,23,24].filter(h=>h<=maxClose).map(h=>`<option value="${h}" ${h===S.hours.close?'selected':''}>${h===24?'24:00':h+':00'}</option>`).join('')}</select></label></div></div>`);
  hrs.querySelector('#hOpen').onchange = e => { S.hours.open = +e.target.value; save(); toast('Новые часы работы с завтрашнего дня'); renderHud(); };
  hrs.querySelector('#hClose').onchange = e => { S.hours.close = +e.target.value; save(); toast('Время закрытия изменено'); renderHud(); };
  p.appendChild(hrs);
}

/* ---------- события ---------- */
function renderEvents(p){
  p.appendChild(el(`<div class="h">События</div>`));
  if(!S.incidents.length) p.appendChild(el(`<div class="empty">Пока тихо. Нерешённые события через 20 минут решаются сами, и почти всегда хуже, чем решил бы ты.</div>`));
  S.incidents.slice().reverse().forEach(inc=>{
    const d = evDef(inc); if(!d) return; const left = Math.max(0, 20 - (Date.now()-inc.at)/60000);
    const tag = {absurd:'Абсурд', inspect:'Проверка', staff:'Команда', break:'Поломка', money:'Деньги'}[d.cat] || 'Событие';
    const card = el(`<button class="card" style="text-align:left;border-left:4px solid ${d.cat==='absurd'?'var(--pathos)':left<5?'var(--bad)':'var(--caramel)'}"><div class="row"><span class="tag">${tag}</span><span class="t">${esc(fillText(d.t, inc))}</span><span class="sp"></span><span class="tag num">${Math.ceil(left)} мин</span></div><div class="d">${esc(fillText(d.x, inc))}</div></button>`);
    card.onclick = () => queueModal({kind:'inc', uid:inc.uid}, true);

  if(mods.length){ p.appendChild(el(`<div class="h">Действуют сейчас</div>`)); mods.forEach(m=>p.appendChild(el(`<div class="card"><div class="row"><span class="t">${esc(m.label)}</span><span class="sp"></span><span class="tag num">${Math.ceil((m.until-absNow())/60)} игр. ч</span></div></div>`))); }
}

  const dt = Math.min(0.1, (t - lastT)/1000); lastT = t;
  if(S && $('#sMoney')){
    gAcc += dt*1000 / REAL_PER_GMIN; const whole = Math.floor(gAcc); if(whole){ gAcc -= whole; const wasOpen = S.isOpen, d0 = S.day; advanceGameMinutes(whole); if(wasOpen !== S.isOpen || d0 !== S.day){ for(const r of S.rooms) syncScene(r.id); structDirty = true; } }
    const id = S.active;
    if(!room(id)){ S.active = 'main'; }
    syncSceneLight(S.active);
    simRoom(S.active, dt);
    // остальные залы считаются по средним
    if(S.isOpen && S.closedUntil <= absNow()) for(const r of S.rooms){ if(r.id===S.active) continue; const rr = rt(r.id); const st = stats(r.id); rr.acc += Math.min(st.lambda, st.through) * dt * 0.9; while(rr.acc >= 1){ rr.acc -= 1; const res = sellOne(r.id); if(res.fail){ S.c.angry++; } } }
    maybeDistract();
    scheduleEvents(Date.now());
    for(const inc of S.incidents.slice()) if(Date.now() - inc.at > 20*60000) expireIncident(inc);
    draw();
    hudT += dt; if(hudT > 0.3){ hudT = 0; renderHud(); refreshAfford(); if(structDirty) renderPanel(); }
    achT += dt; if(achT > 5){ achT = 0; achCheck(); }
    saveT += dt; if(saveT > 6){ saveT = 0; save(); }
    cloudT += dt; if(cloudT > 30){ cloudT = 0; saveCloud(); }
    trackT += dt; if(trackT > 60){ trackT = 0; track(); }
  }
  requestAnimationFrame(frame);
}
let syncSig = '';
function syncSceneLight(id){ const sig = id + '|' + workingStaff(id).map(s=>s.id).join() + '|' + room(id).upg.tables + '|' + room(id).upg.pets; if(sig !== syncSig){ syncSig = sig; syncScene(id); } }
function draw(){
  if(!cv.width) resizeCanvas();
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  drawRoom(S.active);
  ctx.setTransform(scale,0,0,scale,0,0);
  drawGuestBadges(S.active);
  if(!S.isOpen || S.closedUntil > absNow()) drawClosed();
}
document.addEventListener('visibilitychange', ()=>{ if(!S) return; if(document.hidden){ save(); saveCloud(); track(true); } else { lastT = performance.now(); catchUp(); renderHud(); structDirty = true; } });
window.addEventListener('pagehide', ()=>{ if(S){ save(); saveCloud(); } });

/* ---------- запуск ---------- */
try{ if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#17120e'); tg.setBackgroundColor && tg.setBackgroundColor('#17120e'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } }catch(e){}
function boot(data){
  if(data && data.v===3){ S = data; soundOn = S.sound!==false; S.staff.forEach(s=>{ s.distract = null; }); renderGame(); catchUp(); }
  else { S = null; renderStart(); }
}
boot(loadLocal());
loadCloud(cloud=>{ if(cloud && cloud.v===3 && (!S || (cloud.savedAt||0) > (S.savedAt||0) + 5000)){ for(const k in RT) delete RT[k]; modals = []; $('#modalRoot').innerHTML=''; boot(cloud); } });
document.addEventListener('pointerdown', unlockAudio, {once:true});
requestAnimationFrame(frame);

</script>
